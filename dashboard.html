<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mobius</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {
                colors: { brand: { DEFAULT: '#5246EE', hover: '#4538d8', light: '#766df2', subtle: '#f4f3ff' } },
                fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'] }
            } }
        }
    </script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; transition: background-color .3s, color .3s; }
        .glass-card { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-drop { animation: fadeInScale .25s cubic-bezier(.16,1,.3,1) forwards; }
        .animate-menu { animation: slideDown .18s ease-out forwards; }
        .animate-toast { animation: toastIn .25s ease-out forwards; }
        @media (max-width: 768px) { input, select, textarea { font-size: 16px !important; } }
    </style>
    <style>.tree-multi{background:rgba(82,70,238,.16)!important;box-shadow:inset 0 0 0 1.5px #5246EE}.tree-drop-before{box-shadow:0 -2px 0 0 #5246EE}.tree-drop-after{box-shadow:0 2px 0 0 #5246EE}.tree-drop-inside{background:rgba(82,70,238,.12);box-shadow:inset 0 0 0 2px rgba(82,70,238,.5)}</style>
    <style>
        /* Barre de chargement fine sous le menu du haut (visible seulement à l'ouverture d'un document) */
        #top-progress { position: absolute; left: 0; right: 0; top: 100%; height: 2px; pointer-events: none; opacity: 0; transition: opacity .25s ease; z-index: 41; }
        #top-progress.active { opacity: 1; }
        #top-progress > div { height: 100%; width: 0; background: #3b82f6; box-shadow: 0 0 6px rgba(59,130,246,.55); transition: width .3s ease; }
    </style>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 flex flex-col selection:bg-[#5246EE] selection:text-white">

    <!-- NAVBAR -->
    <header class="w-full border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 glass-card sticky top-0 z-30 px-4 sm:px-8 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" id="brand">
            <img src="logo_mobius_nobg.png" alt="MOBIUS" class="w-8 h-8 object-contain rounded-xl">
            <span class="font-bold tracking-tight text-base sm:text-lg">MOBIUS <span class="text-[10px] px-2 py-0.5 rounded-full bg-[#5246EE]/10 text-[#5246EE] font-semibold uppercase tracking-wider">Standard</span></span>
        </div>

        <div class="flex items-center gap-2.5 sm:gap-3">
            <!-- NOTIFICATIONS (mobile : panneau calé sur la largeur de l'écran ; ≥ sm : sous la cloche) -->
            <div class="sm:relative">
                <button id="notif-btn" class="relative w-9 h-9 rounded-xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all" aria-label="Notifications">
                    <i class="fa-solid fa-bell"></i>
                    <span id="notif-badge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center ring-2 ring-white dark:ring-gray-900">0</span>
                </button>
                <div id="notif-panel" class="hidden absolute left-3 right-3 top-full mt-2 sm:left-auto sm:right-0 sm:top-auto sm:w-[22rem] bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl shadow-2xl overflow-hidden animate-menu">
                    <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between">
                        <span class="text-xs font-bold">Notifications</span>
                        <span class="flex items-center gap-3"><span class="text-[10px] text-gray-400" id="notif-count-label"></span><button id="notif-readall" class="text-[10px] font-semibold text-[#5246EE] hover:underline">Tout marquer comme lu</button></span>
                    </div>
                    <div id="notif-list" class="max-h-[60vh] sm:max-h-96 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-800"></div>
                </div>
            </div>

            <button id="theme-btn" class="w-9 h-9 rounded-xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
            </button>

            <div id="profile-btn" class="flex items-center gap-2.5 bg-gray-100 dark:bg-gray-800/80 hover:bg-gray-200 dark:hover:bg-gray-700 px-3 py-1.5 rounded-2xl cursor-pointer transition-all">
                <div class="w-7 h-7 rounded-full bg-[#5246EE] text-white flex items-center justify-center text-xs font-bold" id="nav-user-initial">U</div>
                <div class="hidden sm:block text-left leading-tight">
                    <div class="text-xs font-semibold" id="nav-user-name">Chargement...</div>
                    <div class="text-[10px] text-gray-500 dark:text-gray-400" id="nav-user-email">...</div>
                </div>
            </div>
        </div>
    <div id="top-progress"><div></div></div>
    </header>
    <script>
        // Barre de chargement fine sous le menu du haut : visible seulement pendant l'ouverture d'un document
        window.topProgress = (() => {
            const el = document.getElementById('top-progress'), bar = el && el.firstElementChild;
            let timer = null, w = 0;
            return {
                start() {
                    if (!el) return;
                    clearInterval(timer);
                    bar.style.transition = 'none'; bar.style.width = '0%'; void bar.offsetWidth; bar.style.transition = '';
                    el.classList.add('active'); w = 12; bar.style.width = w + '%';
                    timer = setInterval(() => { w += (92 - w) * 0.1; bar.style.width = w + '%'; }, 250);
                },
                done() {
                    if (!el) return;
                    clearInterval(timer); bar.style.width = '100%';
                    setTimeout(() => el.classList.remove('active'), 250);
                    setTimeout(() => { bar.style.width = '0%'; }, 600);
                }
            };
        })();
        // retour arrière (page restaurée depuis le cache) : on ne garde pas une barre à moitié remplie
        window.addEventListener('pageshow', (e) => { if (e.persisted) window.topProgress.done(); });
    </script>

    <!-- DASHBOARD -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-8 flex flex-col" id="main-view">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
            <div class="bg-gray-200/70 dark:bg-gray-800 p-1 rounded-2xl flex w-full sm:w-auto overflow-x-auto">
                <button data-tab="projects" class="tab-btn flex-1 sm:flex-none px-5 py-2 rounded-xl text-xs font-semibold transition-all">Projets & Dossiers</button>
                <button data-tab="cards" class="tab-btn flex-1 sm:flex-none px-5 py-2 rounded-xl text-xs font-semibold transition-all">Cartes Libres</button>
                <button data-tab="scripts" class="tab-btn flex-1 sm:flex-none px-5 py-2 rounded-xl text-xs font-semibold transition-all">Scénarios</button>
                <button data-tab="texts" class="tab-btn flex-1 sm:flex-none px-5 py-2 rounded-xl text-xs font-semibold transition-all">Textes</button>
            </div>

            <div class="flex items-center gap-2.5 w-full sm:w-auto justify-between sm:justify-end flex-wrap">
                <div class="relative flex-1 sm:flex-none">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-[10px] text-gray-400"></i>
                    <input id="search-input" type="search" placeholder="Rechercher..." class="w-full sm:w-44 pl-8 pr-3 py-2 bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-xs focus:outline-none focus:border-[#5246EE]">
                </div>
                <div class="bg-gray-200/70 dark:bg-gray-800 p-1 rounded-xl flex items-center">
                    <button data-view="grid" class="view-btn w-8 h-8 rounded-lg text-xs flex items-center justify-center transition-all"><i class="fa-solid fa-border-all"></i></button>
                    <button data-view="list" class="view-btn w-8 h-8 rounded-lg text-xs flex items-center justify-center transition-all"><i class="fa-solid fa-list"></i></button>
                </div>
                <select id="sort-select" class="bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none">
                    <option value="alpha">Ordre alphabétique</option>
                    <option value="chrono">Plus récents</option>
                </select>
                <!-- Bouton d'importation global .mobius -->
                <input type="file" id="import-mobius-input" accept=".mobius,.mobpro,.json,.mobscen,.mobtext,.fountain,.txt,.pdf,.docx,.page,.mobql,.sql,.csv,.xlsx,.xls,.zip" multiple class="hidden" onchange="importDashboardMobiusFile(event)">
                <button onclick="document.getElementById('import-mobius-input').click()" class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all" title="Importer une carte (.mobius), un projet (.mobpro), un scénario (.mobscen, .fountain) ou un texte (.mobtext, .txt, .pdf, .docx)">
                    <i class="fa-solid fa-file-arrow-down text-[#5246EE]"></i>
                    <span class="hidden sm:inline">Importer</span>
                </button>
                <button id="create-btn" class="w-48 shrink-0 justify-center whitespace-nowrap bg-[#5246EE] hover:bg-[#4538d8] text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md shadow-[#5246EE]/25 flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-plus text-[10px]"></i><span id="create-btn-text">Nouveau Projet</span>
                </button>
            </div>
        </div>

        <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>

    <!-- WORKSPACE PROJET -->
    <div id="project-workspace" class="hidden flex-1 max-w-7xl w-full mx-auto p-4 sm:p-8 flex flex-col">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-200 dark:border-gray-800 gap-3 flex-wrap">
            <div class="flex items-center gap-3 min-w-0">
                <button id="back-btn" class="w-9 h-9 shrink-0 rounded-xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="min-w-0">
                    <h1 class="text-lg font-bold truncate flex items-center gap-2" id="workspace-title">Projet</h1>
                    <p class="text-xs text-gray-500" id="workspace-subtitle"></p>
                </div>
            </div>
            <div class="relative"><button id="export-btn" data-exbtn class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all">
                <i class="fa-solid fa-download text-red-500"></i><span>Exporter le projet</span><i class="fa-solid fa-chevron-down text-[10px] text-gray-400"></i>
            </button><div id="dash-export-menu" class="hidden absolute right-0 mt-2 z-40 w-64 bg-white dark:bg-gray-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 p-2 space-y-1"><button id="dash-mobpro" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2"><i data-lucide="folder-archive" class="w-4 h-4 text-red-500"></i> Projet (.mobpro) <span class="text-[9px] bg-red-100 dark:bg-red-950 text-red-600 px-1.5 py-0.5 rounded font-bold ml-auto">Natif</span></button><div class="px-3 pt-1 text-[10px] font-bold uppercase tracking-wider text-slate-400">Tabulation</div><button data-exfmt="xlsx" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2"><i data-lucide="file-spreadsheet" class="w-4 h-4 text-slate-400"></i> Export Excel (.xlsx)</button><button data-exfmt="csv" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4 text-slate-400"></i> Export CSV</button><button data-exfmt="json" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2"><i data-lucide="braces" class="w-4 h-4 text-slate-400"></i> Export JSON</button><button data-exfmt="mql" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2"><i data-lucide="terminal" class="w-4 h-4 text-[#5246EE]"></i> Export MQL <span class="text-[9px] bg-purple-100 dark:bg-purple-950 text-purple-600 px-1.5 py-0.5 rounded font-bold ml-auto">Natif</span></button><button data-exfmt="sql" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2"><i data-lucide="database" class="w-4 h-4 text-slate-400"></i> Export SQL</button></div></div>
        </div>

        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div class="flex items-center gap-2 flex-wrap">
                <button data-create="folder" class="tree-create px-3.5 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-xs font-medium flex items-center gap-1.5"><i class="fa-solid fa-folder-plus text-[#5246EE]"></i> Dossier</button>
                <button data-create="txt" class="tree-create px-3.5 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-xs font-medium flex items-center gap-1.5"><i class="fa-solid fa-file-lines text-emerald-500"></i> Fichier .txt</button>
                <button data-create="central" class="tree-create px-3.5 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-xs font-medium flex items-center gap-1.5"><i class="fa-solid fa-database text-violet-500"></i> Centrale</button>
                <button data-create="card" class="tree-create px-3.5 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-xs font-medium flex items-center gap-1.5"><i class="fa-solid fa-note-sticky text-indigo-500"></i> Nouvelle Carte</button>
                <button id="import-btn" class="px-3.5 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-xs font-medium flex items-center gap-1.5"><i class="fa-solid fa-file-arrow-down text-[#5246EE]"></i> Importer</button>
                <input type="file" id="tree-file-input" class="hidden" accept=".txt,.json,.mobius,.fountain,.page,.pdf,.docx,.mobtext,.mobscen,.mobql,.sql,.csv,.xlsx,.zip,.xls" multiple>
            </div>
            <div class="text-[11px] text-gray-400 font-medium" id="selected-folder-indicator">📁 Destination : Racine du projet</div>
        </div>

        <div id="tree" class="bg-white dark:bg-gray-900 border-2 border-transparent ring-1 ring-gray-200 dark:ring-gray-800 rounded-2xl p-4 flex-1 space-y-2 overflow-y-auto transition-all"></div>
    </div>

    <!-- MODALES -->
    <div id="prompt-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <form id="prompt-form" class="bg-white dark:bg-gray-900 rounded-[28px] max-w-sm w-full p-6 shadow-2xl border border-gray-100 dark:border-gray-800 space-y-4">
            <h3 class="font-bold text-sm" id="prompt-title"></h3>
            <input type="text" id="prompt-input" autocomplete="off" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-xs focus:outline-none focus:border-[#5246EE]">
            <div class="flex gap-2 pt-2">
                <button type="button" data-prompt="cancel" class="flex-1 py-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 text-xs font-semibold">Annuler</button>
                <button type="submit" class="flex-1 py-2.5 rounded-xl bg-[#5246EE] text-white text-xs font-semibold shadow-md">Valider</button>
            </div>
        </form>
    </div>

    <div id="confirm-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-900 rounded-[28px] max-w-sm w-full p-6 text-center space-y-4 shadow-2xl border border-gray-100 dark:border-gray-800">
            <div class="w-12 h-12 rounded-2xl bg-amber-50 dark:bg-amber-950/50 text-amber-500 flex items-center justify-center mx-auto text-lg"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <p class="text-xs font-medium" id="confirm-message"></p>
            <div class="flex gap-2 pt-2">
                <button data-confirm="no" class="flex-1 py-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 text-xs font-semibold">Annuler</button>
                <button data-confirm="yes" class="flex-1 py-2.5 rounded-xl bg-red-600 text-white text-xs font-semibold shadow-md">Confirmer</button>
            </div>
        </div>
    </div>

    <div id="create-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-900 rounded-[28px] max-w-md w-full p-6 sm:p-8 shadow-2xl border border-gray-100 dark:border-gray-800 space-y-5 max-h-[92vh] overflow-y-auto">
            <h2 class="text-base font-bold" id="create-modal-title"></h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-500 mb-1 uppercase tracking-wider">Nom</label>
                    <input type="text" id="modal-item-name" maxlength="80" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-xs focus:outline-none focus:border-[#5246EE]">
                </div>

                <label class="flex items-center justify-between bg-gray-50 dark:bg-gray-800/60 p-3.5 rounded-xl border border-gray-200 dark:border-gray-700 cursor-pointer">
                    <div>
                        <div class="text-xs font-semibold">Collaboratif</div>
                        <div class="text-[10px] text-gray-500">Les invités doivent accepter l'invitation</div>
                    </div>
                    <input type="checkbox" id="modal-is-collab" class="w-4 h-4 accent-[#5246EE]">
                </label>

                <div id="collab-box" class="hidden space-y-2">
                    <label class="block text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Inviter par e-mail</label>
                    <div class="flex gap-2">
                        <input type="email" id="modal-collab-email" placeholder="collab@exemple.com" class="flex-1 px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-xs focus:outline-none focus:border-[#5246EE]">
                        <button type="button" id="add-collab-btn" class="bg-gray-200 dark:bg-gray-700 px-4 rounded-xl text-xs font-semibold hover:bg-gray-300 dark:hover:bg-gray-600">Ajouter</button>
                    </div>
                    <div id="collab-badges" class="flex flex-wrap gap-1.5 mt-2"></div>
                </div>

                <label class="flex items-center justify-between bg-gray-50 dark:bg-gray-800/60 p-3.5 rounded-xl border border-gray-200 dark:border-gray-700 cursor-pointer">
                    <div>
                        <div class="text-xs font-semibold">Protéger par mot de passe</div>
                        <div class="text-[10px] text-gray-500">Requis pour ouvrir et supprimer</div>
                    </div>
                    <input type="checkbox" id="modal-has-pwd" class="w-4 h-4 accent-[#5246EE]">
                </label>
                <label id="admin-pwd-row" class="flex items-center justify-between bg-gray-50 dark:bg-gray-800/60 p-3.5 rounded-xl border border-gray-200 dark:border-gray-700 cursor-pointer">
                    <div>
                        <div class="text-xs font-semibold">Les admins peuvent gérer le mot de passe</div>
                        <div class="text-[10px] text-gray-500">Chaque modification devra être validée par vous (notification). Sinon, vous seul pouvez le modifier</div>
                    </div>
                    <input type="checkbox" id="modal-admin-pwd" class="w-4 h-4 accent-[#5246EE]">
                </label>
                <p id="pwd-locked-note" class="hidden text-[10px] text-gray-500"><i class="fa-solid fa-lock mr-1"></i>Seul le propriétaire peut modifier le mot de passe.</p>
                <p id="pwd-approval-note" class="hidden text-[10px] text-amber-600 dark:text-amber-400"><i class="fa-solid fa-shield-halved mr-1"></i>Toute création ou modification du mot de passe sera envoyée au propriétaire pour validation.</p>
                <div id="pwd-box" class="hidden">
                    <input type="password" id="modal-item-pwd" placeholder="••••••••" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-xs focus:outline-none focus:border-[#5246EE]">
                </div>
            </div>
            <div class="flex gap-3 pt-2">
                <button data-create-modal="cancel" class="flex-1 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 text-xs font-semibold hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">Annuler</button>
                <button id="create-modal-ok" data-create-modal="ok" class="flex-1 py-3 rounded-xl bg-[#5246EE] text-white text-xs font-semibold hover:bg-[#4538d8] transition-all shadow-md shadow-[#5246EE]/25">Créer</button>
            </div>
        </div>

    /* ===== MOBIUS-TABULAR (import sql / csv / xlsx / json -> cartes ; même moteur que la page map) ===== */
const MT = (() => {
        const DEFAULT_FIELDS = () => [
            { id: 'f_firstname', key: 'firstname', label: 'Prénom', type: 'line' },
            { id: 'f_lastname', key: 'lastname', label: 'Nom', type: 'line' },

            { id: 'f_location', key: 'location', label: 'Lieu de résidence', type: 'line' }
        ];
        function cardFields(c) { return Array.isArray(c.fields) ? c.fields : DEFAULT_FIELDS(); }
        function fieldVal(node, f) { return f.key ? node[f.key] : (node.custom || {})[f.id]; }
        function slug(s, fallback = 'carte') {
            const r = String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
            return r || fallback;
        }
        function sqlIdent(s, fallback) { const r = slug(s, fallback); return /^\d/.test(r) ? 'c_' + r : r; }
        function buildTables(entries) {
            const usedT = new Set();
            return entries.map(({ card: c, fieldIds }) => {
                let tn = sqlIdent(c.name, 'carte'), base = tn, i = 2;
                while (usedT.has(tn)) tn = base + '_' + i++;
                usedT.add(tn);
                const usedC = new Set(['id']);
                const cols = cardFields(c).filter(f => !fieldIds || fieldIds.has(f.id)).map(f => {
                    let n = sqlIdent(f.label, 'champ'), b = n, k = 2;
                    while (usedC.has(n)) n = b + '_' + k++;
                    usedC.add(n);
                    return { name: n, label: f.label, type: f.type, f };
                });
                const rows = (c.nodes || []).map(node => ({
                    id: node.id, x: node.x, y: node.y,
                    vals: cols.map(col => {
                        const v = fieldVal(node, col.f);
                        if (col.type === 'bool') return v === true;
                        if (v === undefined || v === null || v === '') return null;
                        return col.type === 'number' ? Number(v) : String(v);
                    })
                }));
                return { name: tn, title: c.name || tn, cols, rows, card: c };
            });
        }
        function computeAge(birthdate) {
            if (!birthdate) return '';
            const b = new Date(birthdate), t = new Date();
            if (isNaN(b)) return '';
            let age = t.getFullYear() - b.getFullYear();
            if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) age--;
            return age >= 0 ? age : '';
        }
const currentCard = {};
        const MT_core = (() => {
            const CL = { "'": "'", '"': '"', '«': '»', '“': '”', '‘': '’' };
            const PAL = ['#5246EE', '#ef4444', '#10b981', '#f59e0b', '#3b82f6', '#ec4899', '#14b8a6', '#8b5cf6'];
            const ALIAS = { prenom: 'firstname', first_name: 'firstname', nom: 'lastname', last_name: 'lastname', surnom: 'nickname', date_de_naissance: 'birthdate', lieu_de_residence: 'location' };
            const idn = s => sqlIdent(s, 'x');
            const pretty = s => /[A-Z\s]|[^\x00-\x7f]/.test(s) ? String(s) : String(s).replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
            const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
            const qi = s => '"' + String(s).replace(/"/g, '""') + '"';
            const qs = s => '"' + String(s).replace(/"/g, "'") + '"';
            const lit = v => v == null ? 'NULL' : typeof v === 'boolean' ? (v ? 'TRUE' : 'FALSE') : typeof v === 'number' ? (isFinite(v) ? String(v) : 'NULL') : "'" + String(v).replace(/'/g, "''") + "'";
            const sy = (t, v) => !!t && t.t === 'sym' && t.v === v;
            const tmap = t => /int|num|dec|float|real|doub/i.test(t) ? 'number' : /bool/i.test(t) ? 'bool' : /date|time/i.test(t) ? 'date' : 'line';
            const isCmd = c => c.length > 1 && c[0].t === 'w' && /^(createlink|newlink|link)$/i.test(c[0].v) && sy(c[1], ':');

            // ---------- liens : sens unique (directed) / normal ; fusion de deux sens opposés ----------
        const isDirected = l => l.directed === true;
        const newLinkId = () => 'link-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

        // Ajoute un lien dans `links` en appliquant les règles de fusion.
        // Retourne 'added' | 'merged' | 'exists'.
        //  - A→B puis B→A avec le même type : les deux fusionnent en un lien normal.
        //  - Un lien normal et un lien à sens unique de même type se rejoignent aussi en lien normal.
        function addLinkTo(links, srcId, tgtId, relId, directed) {
            const rel = relId || '';
            const between = links.filter(l => (l.sourceId === srcId && l.targetId === tgtId) || (l.sourceId === tgtId && l.targetId === srcId));
            const sameType = l => (l.relationTypeId || '') === rel;
            // un lien normal et des liens à sens unique peuvent coexister entre les deux mêmes personnes
            if (directed) {
                if (between.some(l => !isDirected(l) && sameType(l))) return 'exists';                 // déjà couvert par un lien normal de ce type
                if (between.some(l => l.sourceId === srcId && isDirected(l) && sameType(l))) return 'exists';
                const opp = between.find(l => l.sourceId === tgtId && isDirected(l) && sameType(l));
                if (opp) { delete opp.directed; return 'merged'; }
                links.push({ id: newLinkId(), sourceId: srcId, targetId: tgtId, relationTypeId: rel, directed: true });
                return 'added';
            }
            if (between.some(l => !isDirected(l) && sameType(l))) return 'exists';
            const same = between.filter(l => isDirected(l) && sameType(l));
            if (same.length) {
                delete same[0].directed;
                same.slice(1).forEach(l => links.splice(links.indexOf(l), 1));
                return 'merged';
            }
            links.push({ id: newLinkId(), sourceId: srcId, targetId: tgtId, relationTypeId: rel });
            return 'added';
        }
        // fusionne deux liens à sens unique opposés de même type (après une modification manuelle)
        function normalizeLinkList(ls) {
            // 1) deux sens uniques opposés de même type -> un lien normal
            for (let i = 0; i < ls.length; i++) {
                const a = ls[i]; if (!isDirected(a)) continue;
                const j = ls.findIndex((b, k) => k !== i && isDirected(b) && b.sourceId === a.targetId && b.targetId === a.sourceId && (b.relationTypeId || '') === (a.relationTypeId || ''));

                }
                else if (ext === 'mobius') r = await importCardFile(file, await file.text());
                else if (ext === 'mobpro') r = await importProjectFile(file, await file.text());
                else if (['mobscen', 'mobtext', 'fountain', 'txt', 'pdf', 'docx', 'page'].includes(ext)) r = await importDocFile(file, ext);
                else { toast(`« ${file.name} » ignoré : formats acceptés : .mobius, .mobpro, .mobscen, .mobtext, .fountain, .txt, .pdf, .docx, .mobql, .sql, .csv, .xlsx, .zip (csv), .json.`, 'info'); continue; }
                if (Array.isArray(r)) results.push(...r); else if (r) results.push(r);
            } catch (err) { console.error(err); toast(`« ${file.name} » refusé : ${err.message}.`, 'error'); }
        }
        if (!results.length) return;
        const last = results[results.length - 1];
        state.tab = last.tab;
        await loadAll();
        const NAMES = { projects: ['projet', 'projets'], cards: ['carte', 'cartes'], scripts: ['scénario', 'scénarios'], texts: ['texte', 'textes'] };
        const parts = Object.keys(NAMES).map(t => [t, results.filter(r => r.tab === t).length]).filter(([, n]) => n).map(([t, n]) => `${n} ${NAMES[t][n > 1 ? 1 : 0]}`);
        toast(parts.join(' et ') + ' importé' + (results.length > 1 ? 's' : '') + ' !', 'success');
        // Un seul fichier carte : on l'ouvre directement (comportement existant)
        if (results.length === 1 && last.tab === 'cards') openCard(last.id);
    }

    function timeAgo(iso) {
        if (!iso) return '';
        const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
        if (s < 60) return "à l'instant";
        if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
        if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;

    }

    async function saveSettings() {
        const { table, id } = state.editing || {};
        const item = state.data[table]?.find(i => i.id === id);
        if (!item) return;
        const name = $('modal-item-name').value.trim();
        if (!name) return toast('Veuillez entrer un nom.', 'error');

        const owner = isOwner(item);
        const pwdOk = canManagePwd(item);
        const isCollab = owner ? $('modal-is-collab').checked : true;
        const hasPwd = pwdOk ? $('modal-has-pwd').checked : !!item.pwd;
        const typedPwd = $('modal-item-pwd').value;
        const pwd = pwdOk ? (hasPwd ? (typedPwd || item.pwd || '') : '') : (item.pwd || '');
        if (hasPwd && !pwd) return toast('Entrez un mot de passe.', 'error');
        // un admin ne change jamais le mot de passe directement : il envoie une demande au propriétaire
        const pwdRequested = !owner && pwdOk && ((hasPwd !== !!item.pwd) || (hasPwd && !!typedPwd));

        const before = collabEntries(item);
        if (!isCollab && before.length && !await askConfirm('Désactiver la collaboration retirera tous les collaborateurs et invitations en attente. Continuer ?')) return;

        const now = new Date().toISOString();
        let collaborators = isCollab
            ? state.tempCollabs.map(email => {

        }
        if (error) return toast('Enregistrement impossible : ' + error.message, 'error');
        let reqSent = false;

            const { error: reqErr } = await sb.rpc('request_pwd_change', { p_table: table, p_id: id, p_new_pwd: hasPwd ? typedPwd : null });
            if (reqErr) toast("Demande de mot de passe impossible : " + reqErr.message, 'error'); else reqSent = true;

    function findItem(list, id) {
        for (const it of list) {
            if (it.id === id) return it;
            if (it.children) { const f = findItem(it.children, id); if (f) return f; }
        }
        return null;
    }
    function removeItem(list, id) {
        return list.filter(it => {
            if (it.id === id) return false;
            if (it.children) it.children = removeItem(it.children, id);
            return true;
        });
    }
    function extractItem(list, id) {
        for (let i = 0; i < list.length; i++) {
            if (list[i].id === id) return list.splice(i, 1)[0];
            if (list[i].children) { const f = extractItem(list[i].children, id); if (f) return f; }
        }
        return null;
    }
    function containsId(item, id) {
        return (item.children || []).some(c => c.id === id || containsId(c, id));

            const primary = buttons.find(b => b.primary);
            const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(undefined); } else if (e.key === 'Enter' && input && primary) { e.preventDefault(); done(primary.value); } };

    // --- Détection de fichiers binaires / images (signatures + octets de contrôle) ---
    function detectBinaryKind(bytes) {
        const sig = (...b) => b.every((v, i) => bytes[i] === v);
        if (sig(0x89, 0x50, 0x4E, 0x47)) return 'une image PNG';
        if (sig(0xFF, 0xD8, 0xFF)) return 'une image JPEG';
        if (sig(0x47, 0x49, 0x46, 0x38)) return 'une image GIF';
        if (sig(0x52, 0x49, 0x46, 0x46)) return 'un fichier RIFF (image WebP / audio / vidéo)';
        if (sig(0x25, 0x50, 0x44, 0x46)) return 'un PDF (renommé)';
        if (sig(0x50, 0x4B, 0x03, 0x04)) return 'une archive ZIP (ex. fichier Pages ou Word)';
        if (sig(0xD0, 0xCF, 0x11, 0xE0)) return 'un ancien document Office (.doc)';
        const head = bytes.subarray(0, 8192);
        if (head[0] === 0xFF && head[1] === 0xFE || head[0] === 0xFE && head[1] === 0xFF) return null; // UTF-16 avec BOM
        let ctrl = 0;
        for (const v of head) { if (v === 0) return 'des données binaires'; if (v < 9 || (v > 13 && v < 32)) ctrl++; }
        return head.length && ctrl / head.length > 0.02 ? 'des données binaires' : null;
    }

    // --- Décodage avec détection d'encodage (UTF-16 BOM, UTF-8, sinon Windows-1252) ---
    function decodeTextBytes(bytes) {
        if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes.subarray(2));
        if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes.subarray(2));
        try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/^\uFEFF/, ''); }
        catch (e) { return new TextDecoder('windows-1252').decode(bytes); }
    }

    async function pdfToText(buf) {
        if (!window.pdfjsLib) throw new Error("lecteur PDF indisponible (connexion ?)");
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
        const pages = [];
        for (let n = 1; n <= pdf.numPages; n++) {
            const content = await (await pdf.getPage(n)).getTextContent();
            let out = '', lastY = null;
            for (const it of content.items) {
                if (it.str === '') { if (it.hasEOL && out && !out.endsWith('\n')) out += '\n'; continue; }
                const y = it.transform ? it.transform[5] : null;
                if (lastY !== null && y !== null && Math.abs(y - lastY) > 2 && out && !out.endsWith('\n')) out += '\n';
                out += it.str;
                if (it.hasEOL && !out.endsWith('\n')) out += '\n';
                if (y !== null) lastY = y;
            }
            pages.push(out.trim());
        }
        return fixPdfLigatures(pages.filter(Boolean).join('\n\n'));
    }

    // Beaucoup de PDF (Keynote, Pages, certaines polices) encodent les ligatures « ti » / « tt »
    // avec un mauvais caractère : « aberra%ons », « len5lle », « vigne.e », « vigne=age ».
    // On les répare quand le caractère est coincé entre des lettres (donc jamais dans « 50% » ou « x=2 »).
    const KEEP_DOT = /^(com|fr|org|net|io|html?|js|css|txt|pdf|docx?|json|md|png|jpe?g|gif|svg|mobius|mobpro|fountain|pages?|xml|csv|zip|be|de|uk|eu|us|ca|ch)$/;
    function fixPdfLigatures(text) {
        let n = 0;
        const bump = (r) => (...a) => { n++; return r(...a); };
        text = text.replace(/⦁/g, '•');
        text = text.replace(/(?<=\p{L})%(?=\p{L})/gu, bump(() => 'ti'));
        text = text.replace(/(?<=\p{Ll})5(?=\p{Ll})/gu, bump(() => 'ti'));
        text = text.replace(/(?<=\p{Ll}{2})=(?=\p{Ll}{2})/gu, bump(() => 'tt'));
        text = text.replace(/(\p{Ll}{2,})\.(\p{Ll}+)/gu, (m, a, b) => KEEP_DOT.test(b) ? m : (n++, a + 'tt' + b));
        return { text, fixes: n };
    }

    async function docxToText(buf) {
        const zip = await JSZip.loadAsync(buf);
        const entry = zip.file('word/document.xml');
        if (!entry) throw new Error("ce n'est pas un document Word valide");
        const xml = new DOMParser().parseFromString(await entry.async('string'), 'application/xml');
        const walk = (node) => {
            let t = '';
            for (const ch of node.childNodes) {
                const n = ch.localName;
                if (n === 't') t += ch.textContent;
                else if (n === 'tab') t += '\t';
                else if (n === 'br' || n === 'cr') t += '\n';
                else if (ch.nodeType === 1) t += walk(ch);
            }
            return t;
        };
        return [...xml.getElementsByTagNameNS('*', 'p')].map(walk).join('\n').replace(/\n{3,}/g, '\n\n').trim();
    }

    // Transforme n'importe quel fichier accepté en texte brut (images et mise en forme ignorées).
    // Lance une Error (message lisible) si le fichier est refusé.
    async function fileToText(file) {
        if (file.size > MAX_INPUT_BYTES) throw new Error('fichier trop volumineux (max 20 Mo)');
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let text, fixes = 0;
        if (/\.pdf$/i.test(file.name)) {
            if (!(bytes[0] === 0x25 && bytes[1] === 0x50)) throw new Error("ce n'est pas un vrai PDF");
            ({ text, fixes } = await pdfToText(buf));
        } else if (/\.docx$/i.test(file.name)) {
            if (!(bytes[0] === 0x50 && bytes[1] === 0x4B)) throw new Error("ce n'est pas un vrai .docx");
            text = await docxToText(buf);
        } else {
            const kind = detectBinaryKind(bytes);
            if (kind) throw new Error(`le fichier contient ${kind}, pas du texte`);
            text = decodeTextBytes(bytes);
        }
        if (!text.trim()) throw new Error('aucun texte trouvé (document scanné ou composé uniquement d\'images ?)');
        if (text.length > MAX_TEXT_CHARS) throw new Error('texte trop long (max 2 millions de caractères)');
        return { text, fixes };
    }

    async function importFiles(files, dest) {
        if (!requireEditTree()) return;
        let t = (dest && typeof dest === 'object') ? dest : { folderId: dest };
        const accepted = files.filter(f => /\.(txt|json|mobius|fountain|page|pdf|docx|mobtext|mobscen|mobql|mql|sql|csv|xlsx|xls|zip)$/i.test(f.name));
        if (accepted.length < files.length) toast('Formats acceptés : .txt, .json, .fountain, .page, .pdf, .docx, .mobius, .mobtext, .mobscen, .mobql, .sql, .csv, .xlsx et .zip (csv).', 'info');
        let added = 0;
        const put = (item) => {
            item.isNewDrop = true;
            insertAtPos(item, t); added++;
            if (t.id && (t.pos === 'before' || t.pos === 'after')) t = { id: item.id, pos: 'after' };   // conserve l'ordre des fichiers déposés
        };
        for (const file of accepted) {
            try {
                if (/\.(mobql|sql|csv|xlsx|xls|zip)$/i.test(file.name) || (/\.json$/i.test(file.name) && await MT.isTabularJson(file))) {
                    // Excel / CSV / SQL / SQL Mobius / JSON tabulaire : une carte par table ou feuille (mêmes règles que la page map)
                    const cs = await MT.fileToCards(file);
                    if (cs.length > 1) { toast(`« ${file.name} » : impossible d'importer un projet dans l'arborescence (${cs.length} cartes détectées).`, 'error'); continue; }
                    cs.forEach(c => put(c));
                    toast(`« ${file.name} » : ${cs.length} carte${cs.length > 1 ? 's' : ''} créée${cs.length > 1 ? 's' : ''}.`, 'success');
                    continue;
                }
                if (/\.(mobtext|mobscen)$/i.test(file.name)) {
                    const d = JSON.parse(await file.text());
                    if (!d || typeof d !== 'object') { toast(`« ${file.name} » n'est pas un fichier Mobius valide.`, 'error'); continue; }
                    put({ id: newItemId(), type: 'txt', name: d.name || file.name.replace(/\.[^.]+$/, ''), content: d.content || '', docType: d.type, doc: d.doc });
                    continue;
                }
                if (/\.mobius$/i.test(file.name)) {
                    const card = parseMobiusCard(await file.text(), file.name);
                    if (!card) { toast(`« ${file.name} » n'est pas une carte Mobius valide.`, 'error'); continue; }
                    put(card);
                } else if (/\.json$/i.test(file.name)) {
                    // JSON : on demande quoi en faire (carte / JSON conservé / texte)
                    const card = parseMobiusCard(await file.text(), file.name);
                    const choice = await askJsonFormat(file.name, !!card);
                    if (choice === 'skip') continue;
                    if (choice === 'map' && card) { put(card); continue; }
                    const { text } = await fileToText(file);
                    put({ id: newItemId(), type: 'txt', name: choice === 'txt' ? file.name.replace(/\.json$/i, '.txt') : file.name, content: text });
                } else {
                    // tous les autres formats sont retranscrits en texte brut (type txt)
                    const { text: content, fixes } = await fileToText(file);
                    if (fixes) toast(`« ${file.name} » : ${fixes} ligature${fixes > 1 ? 's' : ''} (ti / tt) corrigée${fixes > 1 ? 's' : ''}.`, 'info');
                    const name = /\.(pdf|docx)$/i.test(file.name) ? file.name.replace(/\.[^.]+$/, '') + '.txt' : file.name;
                    put({ id: newItemId(), type: 'txt', name, content, isNewDrop: true });
                }
            } catch (err) {
                console.error(err);
                toast(`« ${file.name} » refusé : ${err.message}.`, 'error');
            }
        }
        if (added) { saveTree(); renderTree(); }
    }

    function centralCards(central) {
        const cfg = central.central || {};
        const output = [];
        const collect = (items, descend) => (items || []).forEach(x => {
            if (x.type === 'card') output.push(x);
            if (x.type === 'folder' && descend) collect(x.children, true);
        });
        if (cfg.mode === 'selection') {
            const ids = new Set(cfg.cardIds || []);
            const scan = items => (items||[]).forEach(x => { if(x.type==='card' && ids.has(x.id)) output.push(x); if(x.children) scan(x.children); });
            scan(tree());
        } else if (cfg.mode === 'root') {
            const scan = items => (items||[]).forEach(x => { if(x.type==='card') output.push(x); if(x.children) scan(x.children); });
            scan(tree());
        } else {
            const folder = findItem(tree(), cfg.folderId);
            if(folder) (folder.children||[]).forEach(x => {
                if(x.type==='card') output.push(x);
                if(x.type==='folder' && (cfg.includeSubfolders || (cfg.selectedFolders||[]).includes(x.id))) collect(x.children, true);
            });
        }
        return output;
    }

    /* ---------- Sélection multiple (clic droit maintenu + glisser) et menu clic droit — mêmes fonctions que map / centrale / éditeur ---------- */

    function dashTop(ids) {

                : it ? sep + btn('rename', 'pen', 'Renommer') + btn('up', 'arrow-up', 'Monter') + btn('down', 'arrow-down', 'Descendre') + btn('delete', 'trash', 'Supprimer', 'text-rose-500') : '');

    async function dashRename(id) {
        if (!requireEditTree()) return;
        const it = findItem(tree(), id); if (!it) return;
        const label = { folder: 'du dossier', txt: 'du fichier', card: 'de la carte', pdf: 'du fichier' }[it.type] || "de l'élément";
        const name = (await askPrompt(`Nouveau nom ${label} :`, 'Nom', 'text', it.name))?.trim();
        if (!name || name === it.name) return;
        it.name = name; saveTree(); updateFolderIndicator(); renderTree(); toast('Renommé.', 'success');
    }
    function dashStep(id, dir) {
        if (!requireEditTree()) return;
        const loc = locateItem(tree(), id); if (!loc) return;
        const j = loc.index + dir;
        if (j < 0 || j >= loc.list.length) return;
        [loc.list[loc.index], loc.list[j]] = [loc.list[j], loc.list[loc.index]];

    }
    async function dashDelete(ids) {
        if (!requireEditTree() || treeDeleting) return;
        treeDeleting = true;
        try {
            const items = dashTop(ids).map(id => findItem(tree(), id)).filter(Boolean);
            if (!items.length) return;
            const label = items.length === 1 ? `« ${items[0].name} »` : `${items.length} éléments`;
            if (!await askConfirm(`Supprimer ${label} de l'arborescence ?`)) return;
            items.forEach(it => { state.activeProject.tree = removeItem(tree(), it.id); treeMulti.delete(it.id); });

    }
    async function dashMoveMany(ids, dest) {
        if (!requireEditTree()) return;
        const top = dashTop(ids);
        if (!top.length) return;
        if (dest && dest.id && top.includes(dest.id)) return;
        if (dest && dest.id && top.some(id => containsId(findItem(tree(), id), dest.id))) return toast("Impossible de déplacer un dossier dans lui-même.", 'error');
        const nextFolder = dest ? (dest.pos === 'inside' ? findItem(tree(), dest.id) : (dest.id ? parentFolderOf(tree(), dest.id) : null)) : null;
        const names = new Set();

            const it = findItem(tree(), id); if (!it || it.type !== 'card') return;

        });
        if (names.size && !await treeConfirm(`Déplacer ces éléments ? Certaines cartes pourraient ne plus être liées aux centrales : ${[...names].join(', ')}. Leurs données seront conservées.`)) return;
        const order = []; (function w(l) { l.forEach(i => { order.push(i.id); if (i.children) w(i.children); }); })(tree());
        top.sort((a, b) => order.indexOf(a) - order.indexOf(b));
        const moving = top.map(id => extractItem(tree(), id)).filter(Boolean);
        let t = dest && dest.id ? { id: dest.id, pos: dest.pos } : null;
        moving.forEach(it => { insertAtPos(it, t); if (t && t.pos === 'after') t = { id: it.id, pos: 'after' }; });
        if (dest && dest.pos === 'inside') state.expanded.add(dest.id);
        treeMulti.clear(); saveTree(); renderTree();
    }
    async function dashMenuAction(a) {
        closeDashMenu();
        const { targetId, dest } = treeMenuCtx || {};
        if (a.startsWith('new-')) return dashCreate(a.slice(4), dest);
        if (a === 'import') { if (!requireEditTree()) return; treeImportDest = { folderId: dest }; return $('tree-file-input').click(); }
        if (a === 'centralize') {
            if (!requireEditTree()) return;
            const ids = dashSelCards();
            const name = (await askPrompt('Nom de la centrale :', 'Nom de la centrale', 'text', 'Centrale'))?.trim();
            if (!name) return;
            tree().unshift({ id: newItemId(), type: 'central', name: name.endsWith('.mobius') ? name : name + '.mobius', content: '', isNewDrop: true,
                central: { kind: 'central', mode: 'selection', folderId: null, includeSubfolders: false, selectedFolders: [], groups: [], cardIds: ids } });
            treeMulti.clear(); saveTree(); renderTree(); toast(`Centrale créée (${ids.length} cartes).`, 'success');
            return;
        }
        if (a === 'delete-sel') return dashDelete([...treeMulti]);
        if (!targetId) return;
        if (a === 'rename') return dashRename(targetId);
        if (a === 'up') return dashStep(targetId, -1);
        if (a === 'down') return dashStep(targetId, 1);
        if (a === 'delete') return dashDelete([targetId]);
    }
    menuEl.addEventListener('click', (e) => { const b = e.target.closest('[data-tree-action]'); if (b) dashMenuAction(b.dataset.treeAction); });
    document.addEventListener('mousedown', (e) => { if (!e.target.closest('#tree-context-menu')) closeDashMenu(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDashMenu(); });
    tr.addEventListener('scroll', closeDashMenu);

    /* rectangle de sélection : clic droit maintenu + glisser */
    (function setupDashMarquee() {
        const box = document.createElement('div');
        box.style.cssText = 'position:fixed;z-index:55;pointer-events:none;display:none;border:1.5px solid #5246EE;background:rgba(82,70,238,.14);border-radius:6px';
        document.body.appendChild(box);
        let st = null, raf = 0, px = 0, py = 0;
        const scroller = () => tr.scrollHeight > tr.clientHeight + 2 ? tr : null;
        const sTop = () => scroller() ? tr.scrollTop : window.scrollY;
        const endMq = () => { cancelAnimationFrame(raf); box.style.display = 'none'; st = null; treeRight.down = false; };
        const update = () => {
            if (!st || !st.moved) return;
            const cr = tr.getBoundingClientRect();
            const top0 = Math.max(cr.top, 0), bot0 = Math.min(cr.bottom, window.innerHeight);
            const ay = st.y - (sTop() - st.sy);
            const l = Math.max(cr.left, Math.min(st.x, px)), r = Math.min(cr.right, Math.max(st.x, px));
            const t = Math.max(top0, Math.min(ay, py)), b = Math.min(bot0, Math.max(ay, py));
            box.style.display = 'block';
            box.style.left = l + 'px'; box.style.top = t + 'px';
            box.style.width = Math.max(0, r - l) + 'px'; box.style.height = Math.max(0, b - t) + 'px';
            treeMulti.clear(); st.base.forEach(i => treeMulti.add(i));
            treeRows().forEach(row => {
                const q = row.getBoundingClientRect();
                if (!q.width || !q.height) return;
                if (q.right > l && q.left < r && q.bottom > t && q.top < b) treeMulti.add(treeRowId(row));
            });
            treeMultiPaint();
        };
        const tick = () => {
            if (!st) return;
            if (st.moved) {
                const cr = tr.getBoundingClientRect();
                const top0 = Math.max(cr.top, 0), bot0 = Math.min(cr.bottom, window.innerHeight);
                const d = py < top0 + 28 ? -14 : py > bot0 - 28 ? 14 : 0;
                if (d) { if (scroller()) tr.scrollTop += d; else window.scrollBy(0, d); }
                update();
            }
            raf = requestAnimationFrame(tick);
        };
        tr.addEventListener('mousedown', (e) => {
            if (e.button !== 2 || !canEditTree()) return;
            e.preventDefault();
            const row = e.target.closest('.folder-row, .file-row');
            st = { x: e.clientX, y: e.clientY, sy: sTop(), moved: false, rowId: row ? treeRowId(row) : null, base: (e.ctrlKey || e.metaKey || e.shiftKey) ? new Set(treeMulti) : new Set() };
            px = e.clientX; py = e.clientY; treeRight.down = true;
        });
        window.addEventListener('mousemove', (e) => {
            if (!st) return;
            if (!(e.buttons & 2)) { endMq(); return; }
            px = e.clientX; py = e.clientY;
            if (!st.moved && Math.hypot(px - st.x, py - st.y) > 6) { st.moved = true; closeDashMenu(); cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }

        });
        window.addEventListener('mouseup', (e) => {
            if (!st || e.button !== 2) return;
            const s = st; endMq();
            treeRight.recent = true; setTimeout(() => { treeRight.recent = false; }, 80);
            if (!s.moved) openDashMenu(e.clientX, e.clientY, s.rowId); else treeMultiPaint();
        });
        tr.addEventListener('contextmenu', (e) => {
            if (!canEditTree()) return;
            e.preventDefault();
            if (treeRight.down || treeRight.recent) return;
            const row = e.target.closest('.folder-row, .file-row');
            openDashMenu(e.clientX, e.clientY, row ? treeRowId(row) : null);     // touche « menu contextuel » du clavier
        });
        // appui long (mobile) : même menu
        let lp = null;
        tr.addEventListener('touchstart', (e) => {
            if (!canEditTree() || e.touches.length !== 1) return;
            const t = e.touches[0], row = e.target.closest('.folder-row, .file-row');

        }, { passive: true });

        // Suppr : supprime la sélection ; Échap : désélectionne
        let focusIn = false;
        document.addEventListener('mousedown', (e) => { focusIn = !!e.target.closest('#tree'); }, true);
        document.addEventListener('keydown', (e) => {
            if (!focusIn || !treeMulti.size || !canEditTree()) return;
            const t = e.target, tag = (t.tagName || '').toLowerCase();
            if (tag === 'input' || tag === 'textarea' || tag === 'select' || t.isContentEditable) return;
            if (e.key === 'Escape') { treeMulti.clear(); treeMultiPaint(); }
            else if (e.key === 'Delete') { e.preventDefault(); e.stopImmediatePropagation(); dashDelete([...treeMulti]); }
        }, true);
    })();
    function dashDragImage(e, n) {
        const g = document.createElement('div');
        g.textContent = n + ' éléments';
        g.style.cssText = 'position:fixed;top:-100px;left:-100px;padding:6px 12px;border-radius:12px;background:#5246EE;color:#fff;font:600 12px sans-serif';
        document.body.appendChild(g);
        try { e.dataTransfer.setDragImage(g, 10, 10); } catch (_) {}
        setTimeout(() => g.remove(), 0);
    }

    /* ---------- Export .mobpro (contenu de la colonne tree) ---------- */
    $('export-btn').addEventListener('click', () => $('dash-export-menu').classList.toggle('hidden'));
    $('dash-mobpro').addEventListener('click', async () => { $('dash-export-menu').classList.add('hidden');
        const p = state.activeProject;
        if (p.pwd) {
            const v = await askPrompt('Mot de passe requis pour télécharger :', 'Mot de passe', 'password');
            if (v === null) return;
            if (v !== p.pwd) return toast('Mot de passe incorrect.', 'error');
        }
        const safe = (s) => String(s).replace(/[\\/:*?"<>|]/g, '_');

        const fmtSize = (b) => b < 1024 ? `${b} octets` : b < 1048576 ? `${(b / 1024).toFixed(1).replace('.', ',')} Ko` : `${(b / 1048576).toFixed(2).replace('.', ',')} Mo`;
        if (!await treeConfirm(`Télécharger « ${fileName} » ?\nTaille du fichier : ${fmtSize(blob.size)}`)) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        toast('Projet exporté au format .mobpro !', 'success');
    });

    /* ---------- Démarrage ---------- */
    const params = new URLSearchParams(window.location.search);
    const openId = params.get('openProjectId');
    const tabParam = params.get('tab');
    if (tabParam && TAB_META[tabParam]) { state.tab = tabParam; window.history.replaceState({}, document.title, window.location.pathname); }
    await loadAll();
    if (openId) {
        window.history.replaceState({}, document.title, window.location.pathname);
        state.tab = 'projects';
        openProject(openId);
    }
});

  const usedT = new Set();
  return entries.map(({ card: c, fieldIds }) => {
   let tn = sqlIdent(c.name, 'carte'), base = tn, i = 2;
   while (usedT.has(tn)) tn = base + '_' + i++;
   usedT.add(tn);
   const usedC = new Set(['id']);
   const cols = cardFields(c).filter(f => !fieldIds || fieldIds.has(f.id)).map(f => {
    let n = sqlIdent(f.label, 'champ'), b = n, k = 2;
    while (usedC.has(n)) n = b + '_' + k++;
    usedC.add(n);
    return { name: n, label: f.label, type: f.type, f };
   });
   const rows = (c.nodes || []).map(node => ({
    id: node.id, x: node.x, y: node.y,
    vals: cols.map(col => {
     const v = fieldVal(node, col.f);
     if (col.type === 'bool') return v === true;
     if (v === undefined || v === null || v === '') return null;
     return col.type === 'number' ? Number(v) : String(v);
    })
   }));
   return { name: tn, title: c.name || tn, cols, rows, card: c };
  });
 }
 const csvCell = v => { const s = v === null || v === undefined ? '' : String(v); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
 const sqlVal = v => v === null ? 'NULL' : typeof v === 'boolean' ? (v ? 'TRUE' : 'FALSE') : typeof v === 'number' ? (isFinite(v) ? String(v) : 'NULL') : "'" + String(v).replace(/'/g, "''") + "'";

 async function exportTable(format, entries, project, cap) {
  const dl = (b, n) => cap ? (cap.blob = b, cap.name = n) : dlBlob(b, n);
  const tables = buildTables(entries);
  const base = entries.length > 1 ? slug(project.name || 'projet', 'projet') : tables[0].name;
  if (format === 'json') {
   const out = { tables: tables.map(t => ({ table: t.name, title: t.title, relationTypes: (t.card && t.card.relationTypes) || [], links: (t.card && t.card.links) || [], columns: [{ name: 'id', label: 'id', type: 'text' }, ...t.cols.map(c => ({ name: c.name, label: c.label, type: c.type === 'line' ? 'text' : c.type }))], rows: t.rows.map(r => ({ id: r.id, _x: r.x, _y: r.y, ...Object.fromEntries(t.cols.map((c, i) => [c.name, r.vals[i]])) })) })) };
   dl(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }), base + '.json');
  } else if (format === 'mql') {
   const M = window.MT || (typeof MT !== 'undefined' ? MT : null);
   if (!M || !M.emit) { toast('Moteur MQL indisponible.'); return; }
   dl(new Blob([M.emit(tables, { mobius: true, head: '-- MQL (Mobius Query Language) : SQL compatible + commandes de relations Mobius' })], { type: 'text/plain;charset=utf-8' }), base + '.mobql');
  } else if (format === 'sql') {
   const ty = { line: 'TEXT', text: 'TEXT', number: 'NUMERIC', bool: 'BOOLEAN', date: 'DATE' };
   const sql = ['-- Export Mobius : une carte = une table', ...tables.map(t =>
    `\nCREATE TABLE "${t.name}" (\n  "id" TEXT PRIMARY KEY` + t.cols.map(c => `,\n  "${c.name}" ${ty[c.type]}`).join('') + `\n);` +
    t.rows.map(r => `\nINSERT INTO "${t.name}" ("id"${t.cols.map(c => `, "${c.name}"`).join('')}) VALUES (${sqlVal(r.id)}${r.vals.map(v => ', ' + sqlVal(v)).join('')});`).join(''))].join('\n') + '\n';
   const relations = window.mobiusRelationSQL ? window.mobiusRelationSQL(tables.map(t => ({ card: t.card, table: t.name }))) : '';
   dl(new Blob([sql + (relations ? '\n-- Relations avec clés étrangères\n' + relations + '\n' : '')], { type: 'application/sql' }), base + '.sql');
  } else if (format === 'csv') {
   const csv = t => '\ufeff' + [['id', ...t.cols.map(c => c.label)], ...t.rows.map(r => [r.id, ...r.vals])].map(row => row.map(csvCell).join(';')).join('\r\n');
   if (tables.length === 1) dl(new Blob([csv(tables[0])], { type: 'text/csv;charset=utf-8' }), base + '.csv');
   else {
    if (typeof JSZip === 'undefined') { toast('Bibliothèque ZIP non chargée.'); return; }
    const zip = new JSZip(); tables.forEach(t => zip.file(t.name + '.csv', csv(t)));
    dl(await zip.generateAsync({ type: 'blob' }), base + '_csv.zip');
   }
  } else if (format === 'xlsx') {
   if (typeof XLSX === 'undefined') { toast('Bibliothèque Excel non chargée.'); return; }
   const wb = XLSX.utils.book_new(), used = new Set();
   tables.forEach(t => {
    let sn = String(t.title).replace(/[\[\]:*?\/\\]/g, ' ').trim().slice(0, 28) || t.name, b = sn, k = 2;
    while (used.has(sn.toLowerCase())) sn = b.slice(0, 26) + '_' + k++;
    used.add(sn.toLowerCase());
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['id', ...t.cols.map(c => c.label)], ...t.rows.map(r => [r.id, ...r.vals.map(v => v === null ? '' : v)])]), sn);
   });
   dl(new Blob([XLSX.write(wb, { type: 'array', bookType: 'xlsx' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), base + '.xlsx');
  }
  if (!cap) toast(`Export ${format.toUpperCase()} terminé (${tables.length} table${tables.length > 1 ? 's' : ''}).`);
 }

 function treeHtml(items) {
  return (items || []).map(it => {
   const nm = esc(it.name);
   if (it.type === 'folder') return `<div><div class="flex items-center gap-1.5 p-2 text-slate-400 font-semibold cursor-not-allowed" title="Dossier (non exportable)"><i data-lucide="folder" class="w-3.5 h-3.5 shrink-0"></i><span class="truncate">${nm}</span></div><div class="pl-3 ml-2 border-l border-slate-100 dark:border-slate-800 space-y-1">${treeHtml(it.children)}</div></div>`;
   if (it.type === 'card') {
    const on = EX.sel.has(it.id);
    return `<label class="flex items-center gap-2 p-2 rounded-xl cursor-pointer ${on ? 'bg-[#5246EE]/10 text-[#5246EE] font-semibold' : 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200'}"><input type="checkbox" data-act="card" data-id="${esc(it.id)}" ${on ? 'checked' : ''} class="w-4 h-4 accent-[#5246EE] shrink-0"><i data-lucide="sticky-note" class="w-3.5 h-3.5 shrink-0 text-indigo-500"></i><span class="truncate flex-1">${nm}</span></label>`;
   }
   return `<div class="flex items-center gap-1.5 p-2 text-slate-300 dark:text-slate-600 cursor-not-allowed" title="Non exportable en tabulation"><i data-lucide="file-text" class="w-3.5 h-3.5 shrink-0 ml-6"></i><span class="truncate">${nm}</span></div>`;
  }).join('');
 }

 function render() {
  if (!EX) return;
  let ov = document.getElementById('export-page');
  if (!ov) {
   ov = document.createElement('div');
   ov.id = 'export-page';
   ov.className = 'fixed inset-0 z-[90] bg-white dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col text-xs';
   ov.addEventListener('click', onClick);
   document.body.appendChild(ov);
  }
  const sc = [...ov.querySelectorAll('[data-sc]')].map(e => e.scrollTop);
  const F = EX_FORMATS[EX.fmt];
  const selIds = [...EX.cards.keys()].filter(id => EX.sel.has(id));
  const tabs = Object.entries(EX_FORMATS).map(([k, f]) => `<button data-act="fmt" data-fmt="${k}" class="px-4 py-2 rounded-xl font-semibold flex items-center gap-2 transition ${k === EX.fmt ? 'bg-[#5246EE] text-white shadow' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'}"><i data-lucide="${f.icon}" class="w-4 h-4"></i>${f.label}</button>`).join('');
  const fields = selIds.length ? selIds.map(id => {
   const c = EX.cards.get(id), set = EX.fl[id];
   return `<div class="rounded-2xl border border-slate-200 dark:border-slate-800 p-3 space-y-2">
    <div class="flex items-center justify-between gap-2"><div class="font-bold truncate">${esc(c.name)} <span class="font-normal text-slate-400">· ${set.size}/${cardFields(c).length} champs</span></div>
    <div class="flex gap-3 text-[10px] shrink-0"><button data-act="fall" data-id="${esc(id)}" class="text-[#5246EE] hover:underline">Tout</button><button data-act="fnone" data-id="${esc(id)}" class="text-slate-400 hover:underline">Aucun</button></div></div>
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-1.5">${cardFields(c).map(f => `<label class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-900 cursor-pointer"><input type="checkbox" data-act="field" data-id="${esc(id)}" data-fid="${esc(f.id)}" ${set.has(f.id) ? 'checked' : ''} class="w-4 h-4 accent-[#5246EE] shrink-0"><span class="truncate">${esc(f.label)}</span><span class="text-[9px] text-slate-400 ml-auto shrink-0">${FIELD_TYPES[f.type] || ''}</span></label>`).join('') || '<span class="text-slate-400">Cette carte n\'a plus aucun champ (seule la colonne id sera exportée).</span>'}</div></div>`;
  }).join('') : '<div class="text-center text-slate-400 py-10">Coche au moins une carte à gauche.</div>';
  const nRows = selIds.reduce((n, id) => n + (EX.cards.get(id).nodes || []).length, 0);
  ov.innerHTML = `
   <div class="flex items-center justify-between gap-3 px-5 py-3 border-b border-slate-200 dark:border-slate-800">
    <div class="flex items-center gap-2 font-bold text-sm"><i data-lucide="table" class="w-4 h-4 text-emerald-500"></i> Exporter en tabulation</div>
    <button data-act="close" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 hover:text-slate-800"><i data-lucide="x" class="w-4 h-4 pointer-events-none"></i></button>
   </div>
   <div class="px-5 pt-4 flex flex-wrap gap-2">${tabs}</div>
   <div class="flex-1 min-h-0 flex flex-col md:flex-row gap-4 p-5">
    <aside class="md:w-72 shrink-0 max-h-48 md:max-h-none flex flex-col rounded-2xl border border-slate-200 dark:border-slate-800 min-h-0">
     <div class="flex items-center justify-between px-3 py-2.5 border-b border-slate-100 dark:border-slate-800"><span class="font-bold uppercase tracking-wider text-[10px] text-slate-500">Cartes du projet</span><span class="flex gap-3 text-[10px]"><button data-act="cards-all" class="text-[#5246EE] hover:underline">Tout</button><button data-act="cards-none" class="text-slate-400 hover:underline">Aucune</button></span></div>
     <div data-sc class="flex-1 overflow-y-auto p-2 space-y-1">${treeHtml(EX.tree) || '<div class="text-center text-slate-400 py-6">Arborescence vide.</div>'}</div>
    </aside>
    <section data-sc class="flex-1 min-w-0 overflow-y-auto space-y-4">
     <div class="rounded-2xl bg-slate-50 dark:bg-slate-900 p-4 space-y-1.5">
      <div class="font-bold text-sm flex items-center gap-2"><i data-lucide="${F.icon}" class="w-4 h-4 text-[#5246EE]"></i> ${F.label} <span class="text-slate-400 font-normal">${F.ext}</span></div>
      <p class="text-slate-600 dark:text-slate-300">${F.desc}</p>
      <p class="text-slate-500"><span class="font-semibold">Utilité :</span> ${F.use}</p>
     </div>
     <div class="font-bold uppercase tracking-wider text-[10px] text-slate-500">Champs à enregistrer</div>
     ${fields}
    </section>
   </div>
   <div class="px-5 py-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-3">
    <span class="text-slate-400">${selIds.length} carte${selIds.length > 1 ? 's' : ''} · ${nRows} ligne${nRows > 1 ? 's' : ''}<span id="ex-size">${exSizeText()}</span></span>
    <button data-act="go" ${selIds.length ? '' : 'disabled'} class="px-5 py-2.5 rounded-xl bg-[#5246EE] hover:bg-[#4538d8] disabled:opacity-40 text-white font-semibold flex items-center gap-2"><i data-lucide="download" class="w-4 h-4"></i> Télécharger ${F.ext}</button>
   </div>`;
  [...ov.querySelectorAll('[data-sc]')].forEach((e, i) => { if (sc[i]) e.scrollTop = sc[i]; });
        exSizeUpdate();
  icons();
 }

        /* ---- poids du fichier affiché dans le pied de la page d'export ---- */
        const exFmtSize = b => b < 1024 ? `${b} octets` : b < 1048576 ? `${(b / 1024).toFixed(1).replace('.', ',')} Ko` : `${(b / 1048576).toFixed(2).replace('.', ',')} Mo`;
        const exSz = { key: '', text: '', timer: null };
        const exSizeKey = () => EX.fmt + '|' + [...EX.cards.keys()].filter(id => EX.sel.has(id)).map(id => id + ':' + [...(EX.fl[id] || [])].join(',')).join(';');
        function exSizeText() { if (!EX || ![...EX.cards.keys()].some(id => EX.sel.has(id))) return ''; return exSizeKey() === exSz.key ? exSz.text : ' · calcul…'; }
        function exSizeUpdate() {
            if (!EX || exSizeKey() === exSz.key) return;
            const key = exSizeKey(); clearTimeout(exSz.timer);
            exSz.timer = setTimeout(async () => {
                if (!EX || exSizeKey() !== key) return;
                const entries = [...EX.cards.keys()].filter(id => EX.sel.has(id)).map(id => ({ card: EX.cards.get(id), fieldIds: EX.fl[id] }));
                let text = '';
                if (entries.length) { const cap = {}; try { await exportTable(EX.fmt, entries, EX.project, cap); if (cap.blob) text = ' · ' + exFmtSize(cap.blob.size); } catch (e) { text = ''; } }
                if (!EX || exSizeKey() !== key) return;
                exSz.key = key; exSz.text = text;
                const el = document.getElementById('ex-size'); if (el) el.textContent = text;
            }, 120);
        }

 function close() { const ov = document.getElementById('export-page'); if (ov) ov.remove(); EX = null; }
 document.addEventListener('keydown', e => { if (e.key === 'Escape' && EX && !document.querySelector('.fixed.z-\\[100\\]')) close(); });

 function onClick(e) {
  const t = e.target.closest('[data-act]'); if (!t || !EX) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (a === 'close') { close(); return; }
  if (a === 'go') {
   const entries = [...EX.cards.keys()].filter(i => EX.sel.has(i)).map(i => ({ card: EX.cards.get(i), fieldIds: EX.fl[i] }));
   if (entries.length) exportTable(EX.fmt, entries, EX.project);
   return;
  }
  if (a === 'fmt') EX.fmt = t.dataset.fmt;
  else if (a === 'card') { if (t.checked) EX.sel.add(id); else EX.sel.delete(id); }
  else if (a === 'cards-all') EX.sel = new Set(EX.cards.keys());
  else if (a === 'cards-none') EX.sel = new Set();
  else if (a === 'field') { if (t.checked) EX.fl[id].add(t.dataset.fid); else EX.fl[id].delete(t.dataset.fid); }
  else if (a === 'fall') EX.fl[id] = new Set(cardFields(EX.cards.get(id)).map(f => f.id));
  else if (a === 'fnone') EX.fl[id] = new Set();
  render();
 }

 async function open(project, fmt) {
  if (!project) return;
  if (project.pwd) {
   const r = await askPwd();
   if (r === null) return;
   if (r !== project.pwd) { toast('Mot de passe incorrect.'); return; }
  }
  const cards = new Map();
  (function walk(list) { (list || []).forEach(it => { if (it.type === 'card') cards.set(it.id, it); if (it.children) walk(it.children); }); })(project.tree);
  EX = { fmt: EX_FORMATS[fmt] ? fmt : 'mql', project, tree: project.tree || [], cards, sel: new Set([...cards.keys()]), fl: {} };
  cards.forEach((c, id) => { EX.fl[id] = new Set(cardFields(c).map(f => f.id)); });
  render();
 }

 // menus « Exporter le projet » : un clic sur un format ouvre la page de sélection
 const MENUS = ['editor-project-export', 'dash-export-menu', 'proj-export-menu'];
 document.addEventListener('click', e => {
  const b = e.target.closest('[data-exfmt]');
  if (b) {
   MENUS.forEach(m => { const el = document.getElementById(m); if (el) el.classList.add('hidden'); });
   open(window.__mobiusExportProject && window.__mobiusExportProject(), b.dataset.exfmt);
   return;
  }
  if (!e.target.closest('[data-exbtn]')) MENUS.forEach(m => { const el = document.getElementById(m); if (el && !e.target.closest('#' + m)) el.classList.add('hidden'); });
 });
 return { open, close };
})();

document.addEventListener("DOMContentLoaded",()=>{if(window.lucide)lucide.createIcons()});

<script>
/* Export SQL relationnel Mobius : préserve tous les liens avec des tables de jonction.
   Les cardinalités n'étant pas déclarées, ne présume jamais d'une relation plusieurs-vers-un. */
window.mobiusRelationSQL = function(cardTables) {
 const qi = s => '"'+String(s).replace(/"/g,'""')+'"';
 const lit = v => v == null ? 'NULL' : "'"+String(v).replace(/'/g,"''")+"'";
 const entries = cardTables.filter(x=>x.card && x.table);
 const byId = new Map(entries.map(x=>[String(x.card.id),x]));
 const ids = new Map(entries.map(x=>[String(x.card.id),new Set((x.card.nodes||[]).map(n=>String(n.id)))]));
 const groups = new Map(), seen = new Set();
 const add = (a,an,b,bn,kind,rel,directed) => {
   a=String(a);b=String(b);an=String(an);bn=String(bn);
   if(!byId.has(a)||!byId.has(b)||!ids.get(a).has(an)||!ids.get(b).has(bn))return;
   // Canonical ordering for symmetric cross-links; preserve direction on internal links.
   if(a!==b && a>b){[a,b]=[b,a];[an,bn]=[bn,an];}
   const key=[a,b].join('|'), edge=[a,an,b,bn,kind,rel,directed].join('\u001f');
   if(seen.has(edge))return;seen.add(edge);
   if(!groups.has(key))groups.set(key,{a,b,edges:[]});
   groups.get(key).edges.push({an,bn,kind,rel,directed});
 };
 for(const {card} of entries){
   for(const n of card.nodes||[])for(const l of n.crossLinks||[])add(card.id,n.id,l.cardId,l.nodeId,'interLink','',false);
   for(const l of card.links||[]){
     const rt=(card.relationTypes||[]).find(t=>String(t.id)===String(l.relationTypeId));
     add(card.id,l.sourceId,card.id,l.targetId,'link',rt?.name||'',!!l.directed);
   }
 }
 const used = new Set(entries.map(x=>x.table));const out=[];
 for(const {a,b,edges} of groups.values()){
   const left=byId.get(a).table,right=byId.get(b).table;
   let base=('mobius_links_'+left+(a===b?'_internal':'_'+right)).replace(/[^a-zA-Z0-9_]/g,'_');
   let table=base,i=2;while(used.has(table))table=base+'_'+i++;used.add(table);
   out.push('-- Relations Mobius : '+left+' ↔ '+right);
   out.push('CREATE TABLE '+qi(table)+' (\n  "source_id" TEXT NOT NULL,\n  "target_id" TEXT NOT NULL,\n  "relation_type" TEXT NOT NULL,\n  "relation_name" TEXT,\n  "directed" BOOLEAN NOT NULL,\n  FOREIGN KEY ("source_id") REFERENCES '+qi(left)+'("id"),\n  FOREIGN KEY ("target_id") REFERENCES '+qi(right)+'("id")\n);');
   for(const e of edges)out.push('INSERT INTO '+qi(table)+' ("source_id", "target_id", "relation_type", "relation_name", "directed") VALUES ('+[lit(e.an),lit(e.bn),lit(e.kind),lit(e.rel),e.directed?'TRUE':'FALSE'].join(', ')+');');
 }
 return out.join('\n');
};
</script>
