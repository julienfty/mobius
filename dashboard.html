<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mobius</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {
                colors: { brand: { DEFAULT: '#5246EE', hover: '#4538d8', light: '#766df2', subtle: '#f4f3ff' } },
                fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'] }
            } }
        }
    </script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; transition: background-color .3s, color .3s; }
        .glass-card { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-drop { animation: fadeInScale .25s cubic-bezier(.16,1,.3,1) forwards; }
        .animate-menu { animation: slideDown .18s ease-out forwards; }
        .animate-toast { animation: toastIn .25s ease-out forwards; }
        @media (max-width: 768px) { input, select, textarea { font-size: 16px !important; } }
    </style>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 flex flex-col selection:bg-[#5246EE] selection:text-white">

    <!-- NAVBAR -->
    <header class="w-full border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 glass-card sticky top-0 z-30 px-4 sm:px-8 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" id="brand">
            <img src="logo_mobius_nobg.png" alt="MOBIUS" class="w-8 h-8 object-contain rounded-xl">
            <span class="font-bold tracking-tight text-base sm:text-lg">MOBIUS <span class="text-[10px] px-2 py-0.5 rounded-full bg-[#5246EE]/10 text-[#5246EE] font-semibold uppercase tracking-wider">Standard</span></span>
        </div>

        <div class="flex items-center gap-2.5 sm:gap-3">
            <!-- NOTIFICATIONS -->
            <div class="relative">
                <button id="notif-btn" class="relative w-9 h-9 rounded-xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all" aria-label="Notifications">
                    <i class="fa-solid fa-bell"></i>
                    <span id="notif-badge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center ring-2 ring-white dark:ring-gray-900">0</span>
                </button>
                <div id="notif-panel" class="hidden absolute right-0 mt-2 w-[min(92vw,22rem)] bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl shadow-2xl overflow-hidden animate-menu">
                    <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between">
                        <span class="text-xs font-bold">Notifications</span>
                        <span class="text-[10px] text-gray-400" id="notif-count-label"></span>
                    </div>
                    <div id="notif-list" class="max-h-96 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-800"></div>
                </div>
            </div>

            <button id="theme-btn" class="w-9 h-9 rounded-xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
            </button>

            <div id="profile-btn" class="flex items-center gap-2.5 bg-gray-100 dark:bg-gray-800/80 hover:bg-gray-200 dark:hover:bg-gray-700 px-3 py-1.5 rounded-2xl cursor-pointer transition-all">
                <div class="w-7 h-7 rounded-full bg-[#5246EE] text-white flex items-center justify-center text-xs font-bold" id="nav-user-initial">U</div>
                <div class="hidden sm:block text-left leading-tight">
                    <div class="text-xs font-semibold" id="nav-user-name">Chargement...</div>
                    <div class="text-[10px] text-gray-500 dark:text-gray-400" id="nav-user-email">...</div>
                </div>
            </div>
        </div>
    </header>

    <!-- DASHBOARD -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-8 flex flex-col" id="main-view">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
            <div class="bg-gray-200/70 dark:bg-gray-800 p-1 rounded-2xl flex w-full sm:w-auto">
                <button data-tab="projects" class="tab-btn flex-1 sm:flex-none px-5 py-2 rounded-xl text-xs font-semibold transition-all">Projets & Dossiers</button>
                <button data-tab="cards" class="tab-btn flex-1 sm:flex-none px-5 py-2 rounded-xl text-xs font-semibold transition-all">Cartes Libres</button>
            </div>

            <div class="flex items-center gap-2.5 w-full sm:w-auto justify-between sm:justify-end flex-wrap">

                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-[10px] text-gray-400"></i>
                    <input id="search-input" type="search" placeholder="Rechercher..." class="w-full sm:w-44 pl-8 pr-3 py-2 bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-xs focus:outline-none focus:border-[#5246EE]">
                </div>
                <div class="bg-gray-200/70 dark:bg-gray-800 p-1 rounded-xl flex items-center">

                    <button data-view="list" class="view-btn w-8 h-8 rounded-lg text-xs flex items-center justify-center transition-all"><i class="fa-solid fa-list"></i></button>

                    <option value="chrono">Plus récents</option>
                </select>

                <input type="file" id="import-mobius-input" accept=".mobius,.json" class="hidden" onchange="importDashboardMobiusFile(event)">
                <button onclick="document.getElementById('import-mobius-input').click()" class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all" title="Importer une carte .mobius">

                    <span class="hidden sm:inline">Importer</span>

                <button id="create-btn" class="bg-[#5246EE] hover:bg-[#4538d8] text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md shadow-[#5246EE]/25 flex items-center gap-2 transition-all">

    <!-- WORKSPACE PROJET -->

        </div>

        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div class="flex items-center gap-2 flex-wrap">
                <button data-create="folder" class="tree-create px-3.5 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-xs font-medium flex items-center gap-1.5"><i class="fa-solid fa-folder-plus text-[#5246EE]"></i> Dossier</button>
                <button data-create="txt" class="tree-create px-3.5 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-xs font-medium flex items-center gap-1.5"><i class="fa-solid fa-file-lines text-emerald-500"></i> Fichier .txt</button>
                <button data-create="card" class="tree-create px-3.5 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-xs font-medium flex items-center gap-1.5"><i class="fa-solid fa-note-sticky text-indigo-500"></i> Nouvelle Carte</button>
                <button id="import-btn" class="px-3.5 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-xs font-medium flex items-center gap-1.5"><i class="fa-solid fa-file-arrow-down text-[#5246EE]"></i> Importer</button>

            </div>
            <div class="text-[11px] text-gray-400 font-medium" id="selected-folder-indicator">📁 Destination : Racine du projet</div>

        <div id="tree" class="bg-white dark:bg-gray-900 border-2 border-transparent ring-1 ring-gray-200 dark:ring-gray-800 rounded-2xl p-4 flex-1 space-y-2 overflow-y-auto transition-all"></div>

    <!-- MODALES -->

    <div id="confirm-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">

            <div class="w-12 h-12 rounded-2xl bg-amber-50 dark:bg-amber-950/50 text-amber-500 flex items-center justify-center mx-auto text-lg"><i class="fa-solid fa-triangle-exclamation"></i></div>

    <div id="create-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-900 rounded-[28px] max-w-md w-full p-6 sm:p-8 shadow-2xl border border-gray-100 dark:border-gray-800 space-y-5 max-h-[92vh] overflow-y-auto">
            <h2 class="text-base font-bold" id="create-modal-title"></h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-500 mb-1 uppercase tracking-wider">Nom</label>
                    <input type="text" id="modal-item-name" maxlength="80" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-xs focus:outline-none focus:border-[#5246EE]">
                </div>

                <label class="flex items-center justify-between bg-gray-50 dark:bg-gray-800/60 p-3.5 rounded-xl border border-gray-200 dark:border-gray-700 cursor-pointer">
                    <div>
                        <div class="text-xs font-semibold">Collaboratif</div>
                        <div class="text-[10px] text-gray-500">Les invités doivent accepter l'invitation</div>
                    </div>
                    <input type="checkbox" id="modal-is-collab" class="w-4 h-4 accent-[#5246EE]">

                <label class="flex items-center justify-between bg-gray-50 dark:bg-gray-800/60 p-3.5 rounded-xl border border-gray-200 dark:border-gray-700 cursor-pointer">

                        <div class="text-xs font-semibold">Protéger par mot de passe</div>

                <button data-create-modal="ok" class="flex-1 py-3 rounded-xl bg-[#5246EE] text-white text-xs font-semibold hover:bg-[#4538d8] transition-all shadow-md shadow-[#5246EE]/25">Créer</button>
            </div>

    <div id="profile-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-900 rounded-[28px] max-w-sm w-full p-6 text-center space-y-4 shadow-2xl border border-gray-100 dark:border-gray-800">
            <div class="w-16 h-16 rounded-full bg-[#5246EE] text-white text-xl font-bold flex items-center justify-center mx-auto" id="profile-initial">U</div>
            <div>
                <h3 class="font-bold text-base" id="profile-name"></h3>
                <p class="text-xs text-gray-500" id="profile-email"></p>
            </div>
            <button id="logout-btn" class="w-full py-3 rounded-xl bg-red-50 dark:bg-red-950/30 hover:bg-red-100 text-red-600 text-xs font-semibold transition-all border border-red-200/60 dark:border-red-900/40 flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Se déconnecter
            </button>
            <button data-close="profile-modal" class="text-xs text-gray-400 hover:underline">Fermer</button>
        </div>
    </div>

    <div id="toasts" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2"></div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const SUPABASE_URL = 'https://nfvnayuqrmlldtixzdpx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_EwONSAsqSfu8_SocZ7wZBA_rVODWqSF';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);

    /* ---------- Helpers ---------- */
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const norm = (e) => String(e || '').trim().toLowerCase();
    const isEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
    const TABLE_LABEL = { projects: 'projet', cards: 'carte libre' };

    function toast(msg, type = 'info') {
        const colors = { info: 'bg-gray-900 text-white', success: 'bg-emerald-600 text-white', error: 'bg-red-600 text-white' };
        const el = document.createElement('div');
        el.className = `animate-toast ${colors[type]} text-xs font-medium px-4 py-3 rounded-xl shadow-lg max-w-xs`;
        el.textContent = msg;
        $('toasts').appendChild(el);
        setTimeout(() => el.remove(), 3500);
    }
    const showModal = (id) => { $(id).classList.remove('hidden'); $(id).classList.add('flex'); };
    const hideModal = (id) => { $(id).classList.add('hidden'); $(id).classList.remove('flex'); };

    /* ---------- Session ---------- */
    const { data: { session } } = await sb.auth.getSession();
    if (!session?.user) { window.location.href = 'index.html'; return; }
    const user = session.user;
    const myEmail = norm(user.email);
    const meta = user.user_metadata || {};
    const fullName = (meta.first_name || meta.last_name) ? `${meta.first_name || ''} ${meta.last_name || ''}`.trim() : user.email;
    $('nav-user-name').textContent = fullName;
    $('nav-user-email').textContent = user.email;
    $('nav-user-initial').textContent = fullName.charAt(0).toUpperCase();

    /* ---------- État ---------- */
    const state = {
        tab: 'projects', view: localStorage.getItem('viewMode') || 'grid',
        data: { projects: [], cards: [] },      // éléments visibles (possédés + invitation acceptée)
        invitations: [],                         // { table, item, from }
        activeProject: null, selectedFolderId: null, expanded: new Set(),
        tempCollabs: [], draggedId: null
    };

    /* ---------- Modèle collaborateurs ----------
       collaborators (jsonb) = [{ email, status: 'pending' | 'accepted', invited_by, invited_at }]
       Les anciennes valeurs (simple string) sont traitées comme "accepted". */
    function collabEntries(item) {
        const raw = Array.isArray(item.collaborators) ? item.collaborators : [];
        return raw.map(c => typeof c === 'string'
            ? { email: norm(c), status: 'accepted' }
            : { ...c, email: norm(c.email), status: c.status || 'accepted' });
    }
    const isOwner = (item) => item.owner_id === user.id || norm(item.owner_email) === myEmail;
    const myEntry = (item) => collabEntries(item).find(c => c.email === myEmail);
    const hasCollab = (item) => collabEntries(item).some(c => c.status === 'accepted');
    const pendingCount = (item) => collabEntries(item).filter(c => c.status === 'pending').length;

    /* ---------- Chargement ---------- */
    async function fetchTable(table) {
        const queries = [
            sb.from(table).select('*').eq('owner_id', user.id),
            sb.from(table).select('*').contains('collaborators', JSON.stringify([{ email: myEmail }])),
            sb.from(table).select('*').contains('collaborators', JSON.stringify([myEmail]))
        ];
        const results = await Promise.all(queries);
        const map = new Map();
        results.forEach((r, i) => {
            if (r.error) { console.warn(`[${table}] requête ${i}`, r.error.message); return; }
            (r.data || []).forEach(row => map.set(row.id, row));
        });
        return [...map.values()];
    }

    async function loadAll() {
        const [projects, cards] = await Promise.all([fetchTable('projects'), fetchTable('cards')]);
        state.data.projects = [];
        state.data.cards = [];
        state.invitations = [];

        [['projects', projects], ['cards', cards]].forEach(([table, rows]) => {
            rows.forEach(item => {
                const entry = myEntry(item);
                if (!isOwner(item) && entry?.status === 'pending') {
                    state.invitations.push({ table, item, from: entry.invited_by || item.owner_email, at: entry.invited_at });
                } else if (isOwner(item) || entry?.status === 'accepted') {
                    state.data[table].push(item);
                }
            });
        });
        renderNotifications();
        renderDashboard();
    }

    /* ---------- Rendu dashboard ---------- */
    function applyTabStyles() {
        document.querySelectorAll('.tab-btn').forEach(b => {
            const active = b.dataset.tab === state.tab;
            b.className = `tab-btn flex-1 sm:flex-none px-5 py-2 rounded-xl text-xs font-semibold transition-all ${active ? 'bg-white dark:bg-gray-900 shadow-sm' : 'text-gray-500 dark:text-gray-400'}`;
        });
        document.querySelectorAll('.view-btn').forEach(b => {
            const active = b.dataset.view === state.view;
            b.className = `view-btn w-8 h-8 rounded-lg text-xs flex items-center justify-center transition-all ${active ? 'bg-white dark:bg-gray-900 shadow-sm' : 'text-gray-500 dark:text-gray-400'}`;
        });
        $('create-btn-text').textContent = state.tab === 'projects' ? 'Nouveau Projet' : 'Nouvelle Carte Libre';
    }

    function renderDashboard() {
        applyTabStyles();
        const container = $('items-grid');
        const q = $('search-input').value.trim().toLowerCase();
        const sort = $('sort-select').value;
        const items = [...state.data[state.tab]]
            .filter(i => !q || i.name.toLowerCase().includes(q))
            .sort((a, b) => sort === 'alpha' ? a.name.localeCompare(b.name) : new Date(b.created_at) - new Date(a.created_at));

    /* ---------- Importation fichier .mobius depuis le dashboard ---------- */
    window.importDashboardMobiusFile = function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const cardData = JSON.parse(e.target.result);
                
                if (!cardData.nodes || !cardData.links) {
                    alert("Ce fichier ne correspond pas à un format de carte Mobius valide.");
                    return;
                }

                // Génération d'un ID unique textuel (compatible avec le format de la table cards)
                const cardId = 'id_' + Date.now();

                const newCardRecord = {
                    id: cardId,
                    name: cardData.name || file.name.replace(/\.[^/.]+$/, ""),
                    owner_email: user.email,
                    owner_id: user.id,
                    nodes: cardData.nodes || [],
                    links: cardData.links || [],
                    relationTypes: cardData.relationTypes || [],
                    collaborators: []
                };

                const { error } = await sb.from('cards').insert([newCardRecord]);
                if (error) {
                    console.error("Erreur d'insertion :", error);
                    alert("Erreur lors de l'enregistrement de la carte : " + error.message);
                    return;
                }

                toast("Carte .mobius importée avec succès !", "success");
                
                // Basculer automatiquement sur l'onglet "Cartes Libres" et recharger
                state.tab = 'cards';
                await loadAll();

                // Ouvrir directement la carte importée
                openCard(cardId);
            } catch (err) {
                console.error("Erreur de lecture JSON :", err);
                alert("Impossible de lire le fichier .mobius.");
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    async function deleteItem(id) {
        const table = state.tab;
        const item = state.data[table].find(i => i.id === id);
        if (!item) return;

        if (item.pwd) {
            const p = await askPrompt('Mot de passe requis :', 'Mot de passe', 'password');
            if (p === null) return;
            if (p !== item.pwd) return toast('Mot de passe incorrect.', 'error');
        }

        if (isOwner(item)) {
            if (!await askConfirm('Supprimer définitivement cet élément pour tous les membres ?')) return;
            const { error } = await sb.from(table).delete().eq('id', id);
            if (error) return toast('Suppression impossible : ' + error.message, 'error');
            toast('Élément supprimé.', 'success');
        } else {
            if (!await askConfirm(`Quitter ce ${TABLE_LABEL[table]} ? Il disparaîtra de votre dashboard.`)) return;
            const { error } = await sb.rpc('leave_collab', { p_table: table, p_id: id });
            if (error) return toast('Impossible de quitter : ' + error.message, 'error');
            toast('Vous avez quitté la collaboration.', 'success');

        loadAll();
    }

    function timeAgo(iso) {
        if (!iso) return '';
        const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
        if (s < 60) return "à l'instant";
        if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
        if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
        return `il y a ${Math.floor(s / 86400)} j`;
    }

    /* =========================================================
       WORKSPACE PROJET (arborescence)
       ========================================================= */
    const tree = () => state.activeProject.tree;

    function findItem(list, id) {
        for (const it of list) {
            if (it.id === id) return it;
            if (it.children) { const f = findItem(it.children, id); if (f) return f; }
        }
        return null;
    }
    function removeItem(list, id) {
        return list.filter(it => {
            if (it.id === id) return false;
            if (it.children) it.children = removeItem(it.children, id);
            return true;
        });
    }
    function extractItem(list, id) {
        for (let i = 0; i < list.length; i++) {
            if (list[i].id === id) return list.splice(i, 1)[0];
            if (list[i].children) { const f = extractItem(list[i].children, id); if (f) return f; }
        }
        return null;
    }
    function containsId(item, id) {
        return (item.children || []).some(c => c.id === id || containsId(c, id));
    }

    let saveTimer = null;
    function saveTree() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
            const { error } = await sb.from('projects').update({ tree: state.activeProject.tree }).eq('id', state.activeProject.id);
            if (error) toast('Sauvegarde impossible : ' + error.message, 'error');
        }, 250);
    }

    async function openProject(id) {
        const p = state.data.projects.find(x => x.id === id);
        if (!p) return;
        if (p.pwd && !isOwner(p)) {
            const v = await askPrompt('Ce projet est protégé. Entrez le mot de passe :', 'Mot de passe', 'password');
            if (v === null) return;
            if (v !== p.pwd) return toast('Mot de passe incorrect.', 'error');
        }
        const { data } = await sb.from('projects').select('*').eq('id', id).maybeSingle();
        state.activeProject = data || p;
        if (!Array.isArray(state.activeProject.tree)) state.activeProject.tree = [];
        state.selectedFolderId = null;
        state.expanded.clear();

        $('main-view').classList.add('hidden');$('project-workspace').classList.remove('hidden');
        const collab = hasCollab(state.activeProject) || !isOwner(state.activeProject);
        $('workspace-title').innerHTML = `${esc(state.activeProject.name)} ${collab ? '<i class="fa-solid fa-user-group text-emerald-500 text-xs" title="Collaboratif"></i>' : ''}`;
        const members = collabEntries(state.activeProject).filter(c => c.status === 'accepted').length;
        $('workspace-subtitle').textContent = collab ? `Collaboratif · ${members + 1} membre${members ? 's' : ''}` : 'Sélectionnez un dossier pour y ajouter des éléments';
        updateFolderIndicator();
        renderTree();
    }

    function updateFolderIndicator() {
        const f = state.selectedFolderId && findItem(tree(), state.selectedFolderId);
        $('selected-folder-indicator').textContent = f ? `📁 Destination : Dossier [ ${f.name} ]` : '📁 Destination : Racine du projet';
    }

    function insertInto(newItem, folderId) {
        if (!folderId) { tree().push(newItem); return; }
        const f = findItem(tree(), folderId);
        if (f && f.type === 'folder') { (f.children ||= []).push(newItem); state.expanded.add(folderId); }
        else tree().push(newItem);
    }

    document.querySelectorAll('.tree-create').forEach(b => b.addEventListener('click', async () => {
        const type = b.dataset.create;
        const label = { folder: 'dossier', txt: 'fichier .txt', card: 'carte' }[type];
        const name = (await askPrompt(`Nom du ${label} :`, `Nom du ${label}`))?.trim();
        if (!name) return;
        const item = { id: 'id_' + Date.now(), type, name, content: type === 'txt' ? '' : '' };
        if (type === 'folder') item.children = [];
        item.isNewDrop = true;
        insertInto(item, state.selectedFolderId);
        saveTree(); renderTree();
    }));

    $('import-btn').addEventListener('click', () => $('tree-file-input').click());$('tree-file-input').addEventListener('change', (e) => { importFiles([...e.target.files], state.selectedFolderId); e.target.value = ''; });

    async function importFiles(files, folderId) {
        const accepted = files.filter(f => /\.(txt|json)$/i.test(f.name));
        if (accepted.length < files.length) toast('Seuls les fichiers .txt et .json sont acceptés.', 'info');
        for (const file of accepted) {
            const content = await file.text();
            insertInto({ id: 'id_' + Date.now() + Math.random().toString(36).slice(2, 7), type: 'txt', name: file.name, content, isNewDrop: true }, folderId);
        }
        if (accepted.length) { saveTree(); renderTree(); }
    }

    function renderTree() {
        const c = $('tree');
        if (!tree().length) {
            c.innerHTML = `<div class="text-center py-12 text-gray-400 text-xs">Arborescence vide. Utilisez les boutons ci-dessus ou glissez-déposez des fichiers .txt ici.</div>`;
            return;
        }
        c.innerHTML = '';
        renderLevel(tree(), c);
    }

    function renderLevel(items, container) {
        const sorted = [...items].sort((a, b) => (a.type === 'folder' ? 0 : 1) - (b.type === 'folder' ? 0 : 1) || a.name.localeCompare(b.name));
        sorted.forEach(item => {
            const el = document.createElement('div');
            el.className = `space-y-1 ${item.isNewDrop ? 'animate-drop' : ''}`;
            delete item.isNewDrop;
            el.draggable = true;
            el.dataset.id = item.id;

            if (item.type === 'folder') {
                const selected = state.selectedFolderId === item.id;
                const open = state.expanded.has(item.id);
                el.innerHTML = `
                    <div class="folder-row flex items-center justify-between p-2.5 rounded-xl border text-xs cursor-pointer transition-all ${selected ? 'bg-[#5246EE]/10 border-[#5246EE] text-[#5246EE] font-semibold' : 'bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700/60'}" data-folder="${esc(item.id)}">
                        <div class="flex items-center gap-2.5 flex-1 min-w-0">
                            <i class="fa-solid fa-chevron-right text-[10px] text-gray-400 transition-transform ${open ? 'rotate-90' : ''}" data-toggle="${esc(item.id)}"></i>
                            <i class="fa-solid fa-folder text-[#5246EE]"></i>
                            <span class="truncate">${esc(item.name)}</span>
                            <span class="text-[10px] text-gray-400">${(item.children || []).length || ''}</span>
                        </div>
                        <button data-remove="${esc(item.id)}" class="text-red-500 hover:text-red-700 px-2" title="Supprimer"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="pl-6 space-y-1 mt-1 border-l-2 border-gray-100 dark:border-gray-800 ${open ? '' : 'hidden'}" data-children="${esc(item.id)}"></div>`;
                container.appendChild(el);
                if (item.children?.length) renderLevel(item.children, el.querySelector('[data-children]'));
            } else {
                const icon = item.type === 'txt' ? 'fa-file-lines text-emerald-500' : 'fa-note-sticky text-indigo-500';
                el.innerHTML = `
                    <div class="file-row flex items-center justify-between p-2.5 bg-gray-50/60 dark:bg-gray-800/60 rounded-xl border border-gray-200/60 dark:border-gray-700/60 text-xs hover:bg-gray-100 dark:hover:bg-gray-800 transition-all cursor-pointer" data-file="${esc(item.id)}">
                        <div class="flex items-center gap-2.5 flex-1 min-w-0">
                            <i class="fa-solid ${icon}"></i>
                            <span class="font-medium truncate">${esc(item.name)}</span>
                            ${item.type === 'card' ? '<span class="text-[9px] bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 px-1.5 py-0.5 rounded font-semibold">Carte</span>' : ''}
                        </div>
                        <button data-remove="${esc(item.id)}" class="text-red-500 hover:text-red-700 px-2" title="Supprimer"><i class="fa-solid fa-xmark"></i></button>
                    </div>`;
                container.appendChild(el);
            }
        });
    }

    $('tree').addEventListener('click', async (e) => {
        const rm = e.target.closest('[data-remove]');
        if (rm) {
            e.stopPropagation();
            if (!await askConfirm("Supprimer cet élément de l'arborescence ?")) return;
            if (state.selectedFolderId === rm.dataset.remove) state.selectedFolderId = null;
            state.activeProject.tree = removeItem(tree(), rm.dataset.remove);
            saveTree(); updateFolderIndicator(); renderTree();
            return;
        }
        const tg = e.target.closest('[data-toggle]');
        if (tg) {
            e.stopPropagation();
            const id = tg.dataset.toggle;
            state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
            return renderTree();
        }
        const fo = e.target.closest('[data-folder]');
        if (fo) {
            const id = fo.dataset.folder;
            if (state.selectedFolderId === id) { state.selectedFolderId = null; state.expanded.delete(id); }
            else { state.selectedFolderId = id; state.expanded.add(id); }
            updateFolderIndicator(); return renderTree();
        }
        const fi = e.target.closest('[data-file]');
        if (fi) {
            const it = findItem(tree(), fi.dataset.file);
            if (!it) return;
            window.location.href = it.type === 'card'
                ? `map.html?cardId=${encodeURIComponent(it.id)}`
                : `editor.html?projectId=${encodeURIComponent(state.activeProject.id)}&fileId=${encodeURIComponent(it.id)}`;
        }
    });

    const dropOn = 'ring-2 ring-[#5246EE]/40 bg-[#5246EE]/5 dark:ring-green-400/40 dark:bg-green-500/10';
    const clearDrop = (el) => el?.classList.remove(...dropOn.split(' '));
    const tr = $('tree');

    tr.addEventListener('dragstart', (e) => {
        const el = e.target.closest('[data-id]');
        if (!el) return;
        e.stopPropagation();
        state.draggedId = el.dataset.id;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', el.dataset.id);
    });
    tr.addEventListener('dragover', (e) => {
        e.preventDefault();
        const row = e.target.closest('.folder-row');
        tr.querySelectorAll('.folder-row').forEach(clearDrop); clearDrop(tr);
        (row || tr).classList.add(...dropOn.split(' '));
    });
    tr.addEventListener('dragleave', (e) => { if (!tr.contains(e.relatedTarget)) { clearDrop(tr); tr.querySelectorAll('.folder-row').forEach(clearDrop); } });
    tr.addEventListener('drop', async (e) => {
        e.preventDefault();
        const row = e.target.closest('.folder-row');
        const targetId = row ? row.dataset.folder : null;
        clearDrop(tr); tr.querySelectorAll('.folder-row').forEach(clearDrop);

        if (e.dataTransfer.files?.length) return importFiles([...e.dataTransfer.files], targetId);

        const id = state.draggedId; state.draggedId = null;
        if (!id || id === targetId) return;
        const moving = findItem(tree(), id);
        if (!moving) return;
        if (targetId && containsId(moving, targetId)) return toast("Impossible de déplacer un dossier dans lui-même.", 'error');

        extractItem(tree(), id);
        insertInto(moving, targetId);
        saveTree(); renderTree();
    });

    /* ---------- Export ZIP ---------- */
    $('export-btn').addEventListener('click', async () => {
        const p = state.activeProject;
        if (p.pwd) {
            const v = await askPrompt('Mot de passe requis pour télécharger :', 'Mot de passe', 'password');
            if (v === null) return;
            if (v !== p.pwd) return toast('Mot de passe incorrect.', 'error');
        }
        const zip = new JSZip();
        const safe = (s) => String(s).replace(/[\\/:*?"<>|]/g, '_');
        const walk = (items, folder) => items.forEach(it => {
            if (it.type === 'folder') walk(it.children || [], folder.folder(safe(it.name)));
            else if (it.type === 'txt') folder.file(safe(it.name), it.content || '');
            else folder.file(safe(it.name) + '.card.json', JSON.stringify({ id: it.id, name: it.name }, null, 2));
        });
        walk(p.tree || [], zip);
        zip.file('project_manifest.json', JSON.stringify({ id: p.id, name: p.name, owner_email: p.owner_email, exported_at: new Date().toISOString(), tree: p.tree }, null, 2));
        const blob = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${safe(p.name).toLowerCase().replace(/\s+/g, '_')}_mobius.zip`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    /* ---------- Démarrage ---------- */
    const params = new URLSearchParams(window.location.search);
    const openId = params.get('openProjectId');
    await loadAll();
    if (openId) {
        window.history.replaceState({}, document.title, window.location.pathname);
        state.tab = 'projects';
        openProject(openId);
    }
});
</script>
</body>
</html>
