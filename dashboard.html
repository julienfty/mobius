<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mobius</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {
                colors: { brand: { DEFAULT: '#5246EE', hover: '#4538d8', light: '#766df2', subtle: '#f4f3ff' } },
                fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'] }
            } }
        }
    </script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; transition: background-color .3s, color .3s; }
        .glass-card { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-drop { animation: fadeInScale .25s cubic-bezier(.16,1,.3,1) forwards; }
        .animate-menu { animation: slideDown .18s ease-out forwards; }
        .animate-toast { animation: toastIn .25s ease-out forwards; }
        @media (max-width: 768px) { input, select, textarea { font-size: 16px !important; } }
    </style>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 flex flex-col selection:bg-[#5246EE] selection:text-white">

    <!-- NAVBAR -->
    <header class="w-full border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 glass-card sticky top-0 z-30 px-4 sm:px-8 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" id="brand">
            <img src="logo_mobius_nobg.png" alt="MOBIUS" class="w-8 h-8 object-contain rounded-xl">
            <span class="font-bold tracking-tight text-base sm:text-lg">MOBIUS <span class="text-[10px] px-2 py-0.5 rounded-full bg-[#5246EE]/10 text-[#5246EE] font-semibold uppercase tracking-wider">Standard</span></span>
        </div>

        <div class="flex items-center gap-2.5 sm:gap-3">
            <!-- NOTIFICATIONS (mobile : panneau calé sur la largeur de l'écran ; ≥ sm : sous la cloche) -->
            <div class="sm:relative">
                <button id="notif-btn" class="relative w-9 h-9 rounded-xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all" aria-label="Notifications">
                    <i class="fa-solid fa-bell"></i>
                    <span id="notif-badge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center ring-2 ring-white dark:ring-gray-900">0</span>
                </button>
                <div id="notif-panel" class="hidden absolute left-3 right-3 top-full mt-2 sm:left-auto sm:right-0 sm:top-auto sm:w-[22rem] bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl shadow-2xl overflow-hidden animate-menu">
                    <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between">
                        <span class="text-xs font-bold">Notifications</span>
                        <span class="text-[10px] text-gray-400" id="notif-count-label"></span>
                    </div>
                    <div id="notif-list" class="max-h-[60vh] sm:max-h-96 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-800"></div>
                </div>
            </div>

            <button id="theme-btn" class="w-9 h-9 rounded-xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
            </button>

            <div id="profile-btn" class="flex items-center gap-2.5 bg-gray-100 dark:bg-gray-800/80 hover:bg-gray-200 dark:hover:bg-gray-700 px-3 py-1.5 rounded-2xl cursor-pointer transition-all">

    <!-- DASHBOARD -->

    <div id="profile-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">

    <div id="toasts" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2"></div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const SUPABASE_URL = 'https://nfvnayuqrmlldtixzdpx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_EwONSAsqSfu8_SocZ7wZBA_rVODWqSF';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);

    /* ---------- Helpers ---------- */
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const norm = (e) => String(e || '').trim().toLowerCase();
    const isEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
    const TABLE_LABEL = { projects: 'projet', cards: 'carte libre' };

    function toast(msg, type = 'info') {
        const colors = { info: 'bg-gray-900 text-white', success: 'bg-emerald-600 text-white', error: 'bg-red-600 text-white' };
        const el = document.createElement('div');
        el.className = `animate-toast ${colors[type]} text-xs font-medium px-4 py-3 rounded-xl shadow-lg max-w-xs`;
        el.textContent = msg;
        $('toasts').appendChild(el);
        setTimeout(() => el.remove(), 3500);
    }
    const showModal = (id) => { $(id).classList.remove('hidden'); $(id).classList.add('flex'); };
    const hideModal = (id) => { $(id).classList.add('hidden'); $(id).classList.remove('flex'); };

    /* ---------- Session ---------- */
    const { data: { session } } = await sb.auth.getSession();
    if (!session?.user) { window.location.href = 'index.html'; return; }
    const user = session.user;
    const myEmail = norm(user.email);
    const meta = user.user_metadata || {};
    const fullName = (meta.first_name || meta.last_name) ? `${meta.first_name || ''} ${meta.last_name || ''}`.trim() : user.email;
    $('nav-user-name').textContent = fullName;
    $('nav-user-email').textContent = user.email;
    $('nav-user-initial').textContent = fullName.charAt(0).toUpperCase();

    /* ---------- État ---------- */
    const state = {
        tab: 'projects', view: localStorage.getItem('viewMode') || 'grid',
        data: { projects: [], cards: [] },      // éléments visibles (possédés + invitation acceptée)
        invitations: [],                         // { table, item, from }
        activeProject: null, selectedFolderId: null, expanded: new Set(),
        tempCollabs: [], draggedId: null
    };

    /* ---------- Modèle collaborateurs ----------
       collaborators (jsonb) = [{ email, status: 'pending' | 'accepted', invited_by, invited_at }]
       Les anciennes valeurs (simple string) sont traitées comme "accepted". */
    function collabEntries(item) {
        const raw = Array.isArray(item.collaborators) ? item.collaborators : [];
        return raw.map(c => typeof c === 'string'
            ? { email: norm(c), status: 'accepted' }
            : { ...c, email: norm(c.email), status: c.status || 'accepted' });
    }
    const isOwner = (item) => item.owner_id === user.id || norm(item.owner_email) === myEmail;
    const myEntry = (item) => collabEntries(item).find(c => c.email === myEmail);
    const ROLE_LABELS = { viewer: 'Observateur', editor: 'Peut modifier', admin: 'Admin' };
    // rôle de l'utilisateur sur un élément : owner | admin | editor | viewer
    // (un collaborateur sans champ role, ex. invité avant l'ajout des rôles, est « editor »)
    const roleOf = (item) => {
        if (isOwner(item)) return 'owner';
        const e = myEntry(item);
        return e && e.status === 'accepted' ? (e.role || 'editor') : 'viewer';
    };
    const isAdminOf = (item) => ['owner', 'admin'].includes(roleOf(item));
    const canEditItem = (item) => ['owner', 'admin', 'editor'].includes(roleOf(item));
    // le mot de passe : propriétaire, ou admin si le propriétaire l'a autorisé (colonne admins_manage_pwd)
    const canManagePwd = (item) => isOwner(item) || (roleOf(item) === 'admin' && !!item.admins_manage_pwd);
    const hasCollab = (item) => collabEntries(item).some(c => c.status === 'accepted');
    const pendingCount = (item) => collabEntries(item).filter(c => c.status === 'pending').length;

    /* ---------- Chargement ---------- */
    async function fetchTable(table) {
        const queries = [
            sb.from(table).select('*').eq('owner_id', user.id),
            sb.from(table).select('*').contains('collaborators', JSON.stringify([{ email: myEmail }])),
            sb.from(table).select('*').contains('collaborators', JSON.stringify([myEmail]))
        ];
        const results = await Promise.all(queries);
        const map = new Map();
        results.forEach((r, i) => {
            if (r.error) { console.warn(`[${table}] requête ${i}`, r.error.message); return; }
            (r.data || []).forEach(row => map.set(row.id, row));
        });
        return [...map.values()];
    }

    async function loadAll() {
        const [projects, cards] = await Promise.all([fetchTable('projects'), fetchTable('cards')]);
        state.data.projects = [];
        state.data.cards = [];
        state.invitations = [];

        [['projects', projects], ['cards', cards]].forEach(([table, rows]) => {
            rows.forEach(item => {
                const entry = myEntry(item);
                if (!isOwner(item) && entry?.status === 'pending') {
                    state.invitations.push({ table, item, from: entry.invited_by || item.owner_email, at: entry.invited_at });
                } else if (isOwner(item) || entry?.status === 'accepted') {
                    state.data[table].push(item);
                }
            });
        });
        renderNotifications();
        renderDashboard();
    }

    /* ---------- Importation fichier .mobius ---------- */
    // Lit le JSON d'un .mobius et renvoie l'objet carte (même format que dans tree / cards.info),
    // avec un nouvel id « item_... » : une importation crée toujours une NOUVELLE carte.
    function parseMobiusCard(text, fileName) {
        let data;
        try { data = JSON.parse(text); } catch (e) { return null; }
        if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.links)) return null;
        return {
            id: 'item_' + Date.now() + Math.random().toString(36).slice(2, 7),
            name: data.name || String(fileName || 'Carte importée').replace(/\.[^/.]+$/, ''),
            type: 'card',
            links: data.links,
            nodes: data.nodes,
            content: data.content || '',
            relationTypes: Array.isArray(data.relationTypes) ? data.relationTypes : []
        };
    }

    // .mobius -> nouvelle carte libre (table cards, colonne info)
    async function importCardFile(file, text) {
        const info = parseMobiusCard(text, file.name);
        if (!info) { toast(`« ${file.name} » n'est pas une carte Mobius valide.`, 'error'); return null; }
        const id = 'id_' + Date.now() + Math.random().toString(36).slice(2, 5);
        const { error } = await sb.from('cards').insert([{
            id, name: info.name, owner_email: user.email, owner_id: user.id,
            is_collab: false, collaborators: [], info
        }]);
        if (error) { console.error(error); toast("Erreur d'enregistrement de la carte : " + error.message, 'error'); return null; }
        return { tab: 'cards', id };
    }

    // .mobpro -> nouveau projet dont la colonne tree reçoit le contenu du fichier
    let idCounter = 0;
    const freshId = () => 'item_' + Date.now() + '_' + (++idCounter);
    // Nouveaux ids pour tous les éléments de l'arbre : évite les doublons avec le projet d'origine
    // (map.html retrouve la carte par son id dans tous les projets)
    function regenTreeIds(items) {
        return items.map(it => {
            const copy = { ...it, id: freshId() };
            if (Array.isArray(it.children)) copy.children = regenTreeIds(it.children);
            return copy;
        });
    }
    function parseMobpro(text) {
        let data;
        try { data = JSON.parse(text); } catch (e) { return null; }
        if (data && !Array.isArray(data) && Array.isArray(data.tree)) data = data.tree;
        if (!Array.isArray(data)) return null;
        const valid = (it) => it && typeof it === 'object' && typeof it.name === 'string' && ['folder', 'txt', 'card', 'pdf'].includes(it.type)
            && (it.type !== 'folder' || !it.children || (Array.isArray(it.children) && it.children.every(valid)));
        return data.every(valid) ? data : null;
    }
    async function importProjectFile(file, text) {
        const tree = parseMobpro(text);
        if (!tree) { toast(`« ${file.name} » n'est pas un projet Mobius valide.`, 'error'); return null; }
        const id = 'id_' + Date.now() + Math.random().toString(36).slice(2, 5);
        const { error } = await sb.from('projects').insert([{
            id, name: file.name.replace(/\.[^/.]+$/, '') || 'Projet importé',
            pwd: null, owner_email: user.email, owner_id: user.id,
            is_collab: false, collaborators: [], tree: regenTreeIds(tree)
        }]);
        if (error) { console.error(error); toast("Erreur d'enregistrement du projet : " + error.message, 'error'); return null; }
        return { tab: 'projects', id };
    }

    // Point d'entrée commun (bouton « Importer » et glisser-déposer de la page principale) :
    // reconnaît .mobius / .mobpro et bascule sur l'onglet correspondant à la fin.
    async function importDashboardFiles(files) {
        const results = [];
        for (const file of files) {
            const ext = (file.name.split('.').pop() || '').toLowerCase();
            if (ext !== 'mobius' && ext !== 'mobpro') { toast(`« ${file.name} » ignoré : seuls .mobius et .mobpro sont acceptés.`, 'info'); continue; }
            const text = await file.text();
            const r = ext === 'mobpro' ? await importProjectFile(file, text) : await importCardFile(file, text);
            if (r) results.push(r);
        }
        if (!results.length) return;
        const last = results[results.length - 1];
        state.tab = last.tab;
        await loadAll();
        const nCards = results.filter(r => r.tab === 'cards').length;
        const nProj = results.length - nCards;
        toast([nProj && `${nProj} projet${nProj > 1 ? 's' : ''}`, nCards && `${nCards} carte${nCards > 1 ? 's' : ''}`].filter(Boolean).join(' et ') + ' importé' + (results.length > 1 ? 's' : '') + ' !', 'success');
        // Un seul fichier carte : on l'ouvre directement (comportement existant)
        if (results.length === 1 && last.tab === 'cards') openCard(last.id);
    }

    window.importDashboardMobiusFile = function(event) {
        const files = [...event.target.files];
        event.target.value = '';
        if (files.length) importDashboardFiles(files);
    };

    // Glisser-déposer sur la page principale
    (() => {
        const mv = $('main-view');
        const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
        const ring = ['ring-2', 'ring-[#5246EE]/40', 'rounded-2xl'];
        mv.addEventListener('dragover', (e) => { if (!hasFiles(e)) return; e.preventDefault(); mv.classList.add(...ring); });
        mv.addEventListener('dragleave', (e) => { if (!mv.contains(e.relatedTarget)) mv.classList.remove(...ring); });
        mv.addEventListener('drop', (e) => {
            if (!hasFiles(e)) return;
            e.preventDefault();
            mv.classList.remove(...ring);
            importDashboardFiles([...e.dataTransfer.files]);
        });
    })();

    /* ---------- Prompt / Confirm (promesses) ---------- */
    let promptResolve = null, confirmResolve = null;
    function askPrompt(title, placeholder = '', type = 'text', initial = '') {
        return new Promise(res => {
            promptResolve = res;
            $('prompt-title').textContent = title;
            const input = $('prompt-input');
            input.type = type; input.value = initial; input.placeholder = placeholder;
            showModal('prompt-modal');
            setTimeout(() => { input.focus(); if (initial) input.select(); }, 40);
        });
    }
    function closePrompt(ok) {
        hideModal('prompt-modal');
        const v = $('prompt-input').value;
        if (promptResolve) promptResolve(ok ? v : null);
        promptResolve = null;
    }
    $('prompt-form').addEventListener('submit', (e) => { e.preventDefault(); closePrompt(true); });
    document.querySelector('[data-prompt="cancel"]').addEventListener('click', () => closePrompt(false));

    function askConfirm(message) {
        return new Promise(res => { confirmResolve = res; $('confirm-message').textContent = message; showModal('confirm-modal'); });
    }
    document.querySelectorAll('[data-confirm]').forEach(b => b.addEventListener('click', () => {

    /* ---------- Suppression / sortie ---------- */
    async function deleteItem(id) {
        const table = state.tab;
        const item = state.data[table].find(i => i.id === id);
        if (!item) return;

        if (item.pwd) {
            const p = await askPrompt('Mot de passe requis :', 'Mot de passe', 'password');
            if (p === null) return;
            if (p !== item.pwd) return toast('Mot de passe incorrect.', 'error');
        }

        if (isOwner(item)) {
            if (!await askConfirm('Supprimer définitivement cet élément pour tous les membres ?')) return;
            const { error } = await sb.from(table).delete().eq('id', id);
            if (error) return toast('Suppression impossible : ' + error.message, 'error');
            toast('Élément supprimé.', 'success');
        } else {
            if (!await askConfirm(`Quitter ce ${TABLE_LABEL[table]} ? Il disparaîtra de votre dashboard.`)) return;
            const { error } = await sb.rpc('leave_collab', { p_table: table, p_id: id });
            if (error) return toast('Impossible de quitter : ' + error.message, 'error');
            toast('Vous avez quitté la collaboration.', 'success');
        }
        loadAll();
    }

    function openCard(id) { window.location.href = `map.html?cardId=${encodeURIComponent(id)}`; }

    /* ---------- Notifications ---------- */
    function timeAgo(iso) {
        if (!iso) return '';
        const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
        if (s < 60) return "à l'instant";
        if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
        if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
        return `il y a ${Math.floor(s / 86400)} j`;
    }

    $('notif-list').addEventListener('click', async (e) => {

    $('notif-btn').addEventListener('click', (e) => { e.stopPropagation();$('notif-panel').classList.toggle('hidden'); });

    /* ---------- Création ---------- */
    function openCreateModal() {

        ['modal-is-collab', 'modal-has-pwd', 'modal-item-pwd'].forEach(id => $(id).disabled = false);

    /* ---------- Paramètres d'un projet / d'une carte libre (nom, collaboration, sécurité) ---------- */
    async function openSettingsModal(id) {
        const table = state.tab;
        const item = state.data[table].find(i => i.id === id);
        if (!item) return;
        if (!isAdminOf(item)) return toast('Seuls le propriétaire et les admins peuvent modifier les paramètres.', 'error');
        if (item.pwd) {
            const p = await askPrompt('Mot de passe requis :', 'Mot de passe', 'password');
            if (p === null) return;
            if (p !== item.pwd) return toast('Mot de passe incorrect.', 'error');
        }
        const entries = collabEntries(item);
        state.editing = { table, id };
        state.collabMeta = new Map(entries.map(c => [c.email, c]));
        state.collabRoles = new Map(entries.map(c => [c.email, c.role || 'editor']));
        state.tempCollabs = entries.map(c => c.email);
        $('modal-item-name').value = item.name || '';
        $('modal-collab-email').value = '';
        $('modal-is-collab').checked = !!item.is_collab || entries.length > 0;
        $('collab-box').classList.toggle('hidden', !$('modal-is-collab').checked);
        $('modal-has-pwd').checked = !!item.pwd;
        $('pwd-box').classList.toggle('hidden', !item.pwd);
        $('modal-item-pwd').value = '';
        $('modal-item-pwd').placeholder = item.pwd ? 'Laisser vide pour garder le mot de passe actuel' : '••••••••';
        // permissions : seul le propriétaire active/désactive la collaboration et règle l'autorisation des admins ;
        // le mot de passe n'est modifiable par un admin que si le propriétaire l'a autorisé
        const owner = isOwner(item);
        $('modal-is-collab').disabled = !owner;
        $('admin-pwd-row').classList.toggle('hidden', !owner);
        $('modal-admin-pwd').checked = !!item.admins_manage_pwd;
        const pwdOk = canManagePwd(item);
        ['modal-has-pwd', 'modal-item-pwd'].forEach(id => $(id).disabled = !pwdOk);
        $('pwd-locked-note').classList.toggle('hidden', pwdOk);
        renderCollabBadges();
        $('create-modal-title').textContent = table === 'projects' ? 'Paramètres du projet' : 'Paramètres de la carte libre';
        $('create-modal-ok').textContent = 'Enregistrer';
        showModal('create-modal');
        setTimeout(() => $('modal-item-name').focus(), 40);
    }

    async function saveSettings() {
        const { table, id } = state.editing || {};
        const item = state.data[table]?.find(i => i.id === id);
        if (!item) return;
        const name = $('modal-item-name').value.trim();
        if (!name) return toast('Veuillez entrer un nom.', 'error');

        const owner = isOwner(item);
        const pwdOk = canManagePwd(item);
        const isCollab = owner ? $('modal-is-collab').checked : true;
        const hasPwd = pwdOk ? $('modal-has-pwd').checked : !!item.pwd;
        const pwd = pwdOk ? (hasPwd ? ($('modal-item-pwd').value || item.pwd || '') : '') : (item.pwd || '');
        if (hasPwd && !pwd) return toast('Entrez un mot de passe.', 'error');

        const before = collabEntries(item);
        if (!isCollab && before.length && !await askConfirm('Désactiver la collaboration retirera tous les collaborateurs et invitations en attente. Continuer ?')) return;

        const now = new Date().toISOString();
        const collaborators = isCollab
            ? state.tempCollabs.map(email => {
                const meta = state.collabMeta.get(email);
                const role = state.collabRoles.get(email) || meta?.role || 'editor';
                return meta ? { ...meta, role } : { email, role, status: 'pending', invited_by: user.email, invited_at: now };
            })
            : [];
        const invited = collaborators.filter(c => !state.collabMeta.has(c.email)).length;

    const tree = () => state.activeProject.tree;

    function findItem(list, id) {
        for (const it of list) {
            if (it.id === id) return it;
            if (it.children) { const f = findItem(it.children, id); if (f) return f; }
        }
        return null;
    }
    function removeItem(list, id) {
        return list.filter(it => {
            if (it.id === id) return false;
            if (it.children) it.children = removeItem(it.children, id);
            return true;
        });
    }
    function extractItem(list, id) {
        for (let i = 0; i < list.length; i++) {
            if (list[i].id === id) return list.splice(i, 1)[0];
            if (list[i].children) { const f = extractItem(list[i].children, id); if (f) return f; }
        }
        return null;
    }
    function containsId(item, id) {
        return (item.children || []).some(c => c.id === id || containsId(c, id));
    }

    // --- Détection de fichiers binaires / images (signatures + octets de contrôle) ---
    function detectBinaryKind(bytes) {
        const sig = (...b) => b.every((v, i) => bytes[i] === v);
        if (sig(0x89, 0x50, 0x4E, 0x47)) return 'une image PNG';
        if (sig(0xFF, 0xD8, 0xFF)) return 'une image JPEG';
        if (sig(0x47, 0x49, 0x46, 0x38)) return 'une image GIF';
        if (sig(0x52, 0x49, 0x46, 0x46)) return 'un fichier RIFF (image WebP / audio / vidéo)';
        if (sig(0x25, 0x50, 0x44, 0x46)) return 'un PDF (renommé)';
        if (sig(0x50, 0x4B, 0x03, 0x04)) return 'une archive ZIP (ex. fichier Pages ou Word)';
        if (sig(0xD0, 0xCF, 0x11, 0xE0)) return 'un ancien document Office (.doc)';
        const head = bytes.subarray(0, 8192);
        if (head[0] === 0xFF && head[1] === 0xFE || head[0] === 0xFE && head[1] === 0xFF) return null; // UTF-16 avec BOM
        let ctrl = 0;
        for (const v of head) { if (v === 0) return 'des données binaires'; if (v < 9 || (v > 13 && v < 32)) ctrl++; }
        return head.length && ctrl / head.length > 0.02 ? 'des données binaires' : null;
    }

    // --- Décodage avec détection d'encodage (UTF-16 BOM, UTF-8, sinon Windows-1252) ---
    function decodeTextBytes(bytes) {
        if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes.subarray(2));
        if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes.subarray(2));
        try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/^\uFEFF/, ''); }
        catch (e) { return new TextDecoder('windows-1252').decode(bytes); }
    }

    async function pdfToText(buf) {
        if (!window.pdfjsLib) throw new Error("lecteur PDF indisponible (connexion ?)");
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
        const pages = [];
        for (let n = 1; n <= pdf.numPages; n++) {
            const content = await (await pdf.getPage(n)).getTextContent();
            let out = '', lastY = null;
            for (const it of content.items) {
                if (it.str === '') { if (it.hasEOL && out && !out.endsWith('\n')) out += '\n'; continue; }
                const y = it.transform ? it.transform[5] : null;
                if (lastY !== null && y !== null && Math.abs(y - lastY) > 2 && out && !out.endsWith('\n')) out += '\n';
                out += it.str;
                if (it.hasEOL && !out.endsWith('\n')) out += '\n';
                if (y !== null) lastY = y;
            }
            pages.push(out.trim());
        }
        return fixPdfLigatures(pages.filter(Boolean).join('\n\n'));
    }

    // Beaucoup de PDF (Keynote, Pages, certaines polices) encodent les ligatures « ti » / « tt »
    // avec un mauvais caractère : « aberra%ons », « len5lle », « vigne.e », « vigne=age ».
    // On les répare quand le caractère est coincé entre des lettres (donc jamais dans « 50% » ou « x=2 »).
    const KEEP_DOT = /^(com|fr|org|net|io|html?|js|css|txt|pdf|docx?|json|md|png|jpe?g|gif|svg|mobius|mobpro|fountain|pages?|xml|csv|zip|be|de|uk|eu|us|ca|ch)$/;
    function fixPdfLigatures(text) {
        let n = 0;
        const bump = (r) => (...a) => { n++; return r(...a); };
        text = text.replace(/⦁/g, '•');
        text = text.replace(/(?<=\p{L})%(?=\p{L})/gu, bump(() => 'ti'));
        text = text.replace(/(?<=\p{Ll})5(?=\p{Ll})/gu, bump(() => 'ti'));
        text = text.replace(/(?<=\p{Ll}{2})=(?=\p{Ll}{2})/gu, bump(() => 'tt'));
        text = text.replace(/(\p{Ll}{2,})\.(\p{Ll}+)/gu, (m, a, b) => KEEP_DOT.test(b) ? m : (n++, a + 'tt' + b));
        return { text, fixes: n };
    }

    async function docxToText(buf) {
        const zip = await JSZip.loadAsync(buf);
        const entry = zip.file('word/document.xml');
        if (!entry) throw new Error("ce n'est pas un document Word valide");
        const xml = new DOMParser().parseFromString(await entry.async('string'), 'application/xml');
        const walk = (node) => {
            let t = '';
            for (const ch of node.childNodes) {
                const n = ch.localName;
                if (n === 't') t += ch.textContent;
                else if (n === 'tab') t += '\t';
                else if (n === 'br' || n === 'cr') t += '\n';
                else if (ch.nodeType === 1) t += walk(ch);
            }
            return t;
        };
        return [...xml.getElementsByTagNameNS('*', 'p')].map(walk).join('\n').replace(/\n{3,}/g, '\n\n').trim();
    }

    // Transforme n'importe quel fichier accepté en texte brut (images et mise en forme ignorées).
    // Lance une Error (message lisible) si le fichier est refusé.
    async function fileToText(file) {
        if (file.size > MAX_INPUT_BYTES) throw new Error('fichier trop volumineux (max 20 Mo)');
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let text, fixes = 0;
        if (/\.pdf$/i.test(file.name)) {
            if (!(bytes[0] === 0x25 && bytes[1] === 0x50)) throw new Error("ce n'est pas un vrai PDF");
            ({ text, fixes } = await pdfToText(buf));
        } else if (/\.docx$/i.test(file.name)) {
            if (!(bytes[0] === 0x50 && bytes[1] === 0x4B)) throw new Error("ce n'est pas un vrai .docx");
            text = await docxToText(buf);
        } else {
            const kind = detectBinaryKind(bytes);
            if (kind) throw new Error(`le fichier contient ${kind}, pas du texte`);
            text = decodeTextBytes(bytes);
        }
        if (!text.trim()) throw new Error('aucun texte trouvé (document scanné ou composé uniquement d\'images ?)');
        if (text.length > MAX_TEXT_CHARS) throw new Error('texte trop long (max 2 millions de caractères)');
        return { text, fixes };
    }

    async function importFiles(files, folderId) {
        if (!requireEditTree()) return;
        const accepted = files.filter(f => /\.(txt|json|mobius|fountain|page|pdf|docx)$/i.test(f.name));
        if (accepted.length < files.length) toast('Formats acceptés : .txt, .json, .fountain, .page, .pdf, .docx et .mobius.', 'info');
        let added = 0;
        for (const file of accepted) {
            if (/\.mobius$/i.test(file.name)) {
                // .mobius : nouvelle carte dans l'arborescence (même format que cards.info)
                const card = parseMobiusCard(await file.text(), file.name);
                if (!card) { toast(`« ${file.name} » n'est pas une carte Mobius valide.`, 'error'); continue; }
                card.isNewDrop = true;
                insertInto(card, folderId);
            } else {
                // tous les autres formats sont retranscrits en texte brut (type txt)
                try {
                    const { text: content, fixes } = await fileToText(file);
                    if (fixes) toast(`« ${file.name} » : ${fixes} ligature${fixes > 1 ? 's' : ''} (ti / tt) corrigée${fixes > 1 ? 's' : ''}.`, 'info');
                    const name = /\.(pdf|docx)$/i.test(file.name) ? file.name.replace(/\.[^.]+$/, '') + '.txt' : file.name;
                    insertInto({ id: newItemId(), type: 'txt', name, content, isNewDrop: true }, folderId);
                } catch (err) {
                    console.error(err);
                    toast(`« ${file.name} » refusé : ${err.message}.`, 'error');
                    continue;
                }
            }
            added++;
        }
        if (added) { saveTree(); renderTree(); }
    }

    function renderTree() {
        const c = $('tree');
        if (!tree().length) {
            c.innerHTML = `<div class="text-center py-12 text-gray-400 text-xs">Arborescence vide. Utilisez les boutons ci-dessus ou glissez-déposez des fichiers (.txt, .fountain, .page, .pdf, .docx, .mobius) ici.</div>`;
            return;

    }

    function renderLevel(items, container) {
        const sorted = [...items].sort((a, b) => (a.type === 'folder' ? 0 : 1) - (b.type === 'folder' ? 0 : 1) || a.name.localeCompare(b.name));
        sorted.forEach(item => {
            const el = document.createElement('div');
            el.className = `space-y-1 ${item.isNewDrop ? 'animate-drop' : ''}`;
            delete item.isNewDrop;
            el.draggable = canEditTree();

            if (item.type === 'folder') {
                const selected = state.selectedFolderId === item.id;
                const open = state.expanded.has(item.id);
                el.innerHTML = `
                    <div class="folder-row flex items-center justify-between p-2.5 rounded-xl border text-xs cursor-pointer transition-all ${selected ? 'bg-[#5246EE]/10 border-[#5246EE] text-[#5246EE] font-semibold' : 'bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700/60'}" data-folder="${esc(item.id)}">
                        <div class="flex items-center gap-2.5 flex-1 min-w-0">
                            <i class="fa-solid fa-chevron-right text-[10px] text-gray-400 transition-transform ${open ? 'rotate-90' : ''}" data-toggle="${esc(item.id)}"></i>
                            <i class="fa-solid fa-folder text-[#5246EE]"></i>
                            <span class="truncate">${esc(item.name)}</span>
                            <span class="text-[10px] text-gray-400">${(item.children || []).length || ''}</span>
                        </div>
                        ${canEditTree() ? `<div class="flex items-center shrink-0"><button data-rename="${esc(item.id)}" class="text-gray-400 hover:text-[#5246EE] px-2" title="Renommer"><i class="fa-solid fa-pen text-[10px]"></i></button><button data-remove="${esc(item.id)}" class="text-red-500 hover:text-red-700 px-2" title="Supprimer"><i class="fa-solid fa-xmark"></i></button></div>` : ''}
                    </div>
                    <div class="pl-6 space-y-1 mt-1 border-l-2 border-gray-100 dark:border-gray-800 ${open ? '' : 'hidden'}" data-children="${esc(item.id)}"></div>`;
                container.appendChild(el);
                if (item.children?.length) renderLevel(item.children, el.querySelector('[data-children]'));
            } else {
                const icon = item.type === 'txt' ? 'fa-file-lines text-emerald-500' : item.type === 'pdf' ? 'fa-file-pdf text-red-500' : 'fa-note-sticky text-indigo-500';
                el.innerHTML = `
                    <div class="file-row flex items-center justify-between p-2.5 bg-gray-50/60 dark:bg-gray-800/60 rounded-xl border border-gray-200/60 dark:border-gray-700/60 text-xs hover:bg-gray-100 dark:hover:bg-gray-800 transition-all cursor-pointer" data-file="${esc(item.id)}">
                        <div class="flex items-center gap-2.5 flex-1 min-w-0">
                            <i class="fa-solid ${icon}"></i>
                            <span class="font-medium truncate">${esc(item.name)}</span>
                            ${item.type === 'card' ? '<span class="text-[9px] bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 px-1.5 py-0.5 rounded font-semibold">Carte</span>' : ''}
                        </div>
                        ${canEditTree() ? `<div class="flex items-center shrink-0"><button data-rename="${esc(item.id)}" class="text-gray-400 hover:text-[#5246EE] px-2" title="Renommer"><i class="fa-solid fa-pen text-[10px]"></i></button><button data-remove="${esc(item.id)}" class="text-red-500 hover:text-red-700 px-2" title="Supprimer"><i class="fa-solid fa-xmark"></i></button></div>` : ''}
                    </div>`;
                container.appendChild(el);
            }
        });
    }

    $('tree').addEventListener('click', async (e) => {

            saveTree(); updateFolderIndicator(); renderTree();
            toast('Renommé.', 'success');
            return;
        }
        const rm = e.target.closest('[data-remove]');
        if (rm) {
            e.stopPropagation();
            if (!requireEditTree()) return;
            if (!await askConfirm("Supprimer cet élément de l'arborescence ?")) return;
            if (state.selectedFolderId === rm.dataset.remove) state.selectedFolderId = null;
            state.activeProject.tree = removeItem(tree(), rm.dataset.remove);
            saveTree(); updateFolderIndicator(); renderTree();
            return;
        }
        const tg = e.target.closest('[data-toggle]');
        if (tg) {
            e.stopPropagation();
            const id = tg.dataset.toggle;
            state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
            return renderTree();
        }
        const fo = e.target.closest('[data-folder]');
        if (fo) {
            const id = fo.dataset.folder;
            if (state.selectedFolderId === id) { state.selectedFolderId = null; state.expanded.delete(id); }
            else { state.selectedFolderId = id; state.expanded.add(id); }
            updateFolderIndicator(); return renderTree();
        }
        const fi = e.target.closest('[data-file]');
        if (fi) {
            const it = findItem(tree(), fi.dataset.file);
            if (!it) return;
            window.location.href = it.type === 'card'
                ? `map.html?cardId=${encodeURIComponent(it.id)}`
                : `editor.html?projectId=${encodeURIComponent(state.activeProject.id)}&fileId=${encodeURIComponent(it.id)}`;
        }
    });

    const dropOn = 'ring-2 ring-[#5246EE]/40 bg-[#5246EE]/5 dark:ring-green-400/40 dark:bg-green-500/10';
    const clearDrop = (el) => el?.classList.remove(...dropOn.split(' '));
    const tr = $('tree');

    tr.addEventListener('dragstart', (e) => {
        const el = e.target.closest('[data-id]');
        if (!el) return;
        e.stopPropagation();
        state.draggedId = el.dataset.id;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', el.dataset.id);
    });
    tr.addEventListener('dragover', (e) => {
        e.preventDefault();
        const row = e.target.closest('.folder-row');
        tr.querySelectorAll('.folder-row').forEach(clearDrop); clearDrop(tr);
        (row || tr).classList.add(...dropOn.split(' '));
    });
    tr.addEventListener('dragleave', (e) => { if (!tr.contains(e.relatedTarget)) { clearDrop(tr); tr.querySelectorAll('.folder-row').forEach(clearDrop); } });
    tr.addEventListener('drop', async (e) => {
        e.preventDefault();
        if (!requireEditTree()) return;
        const row = e.target.closest('.folder-row');
        const targetId = row ? row.dataset.folder : null;
        clearDrop(tr); tr.querySelectorAll('.folder-row').forEach(clearDrop);

        if (e.dataTransfer.files?.length) return importFiles([...e.dataTransfer.files], targetId);

        const id = state.draggedId; state.draggedId = null;
        if (!id || id === targetId) return;
        const moving = findItem(tree(), id);
        if (!moving) return;
        if (targetId && containsId(moving, targetId)) return toast("Impossible de déplacer un dossier dans lui-même.", 'error');

        extractItem(tree(), id);
        insertInto(moving, targetId);
        saveTree(); renderTree();
    });

    /* ---------- Export .mobpro (contenu de la colonne tree) ---------- */
    $('export-btn').addEventListener('click', async () => {
        const p = state.activeProject;
        if (p.pwd) {
            const v = await askPrompt('Mot de passe requis pour télécharger :', 'Mot de passe', 'password');
            if (v === null) return;
            if (v !== p.pwd) return toast('Mot de passe incorrect.', 'error');
        }
        const safe = (s) => String(s).replace(/[\\/:*?"<>|]/g, '_');
        const blob = new Blob([JSON.stringify(p.tree || [], null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${safe(p.name).toLowerCase().replace(/\s+/g, '_')}.mobpro`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        toast('Projet exporté au format .mobpro !', 'success');
    });

    /* ---------- Démarrage ---------- */
    const params = new URLSearchParams(window.location.search);
    const openId = params.get('openProjectId');
    await loadAll();
    if (openId) {
        window.history.replaceState({}, document.title, window.location.pathname);
        state.tab = 'projects';
        openProject(openId);
    }
});
</script>
</body>
</html>
