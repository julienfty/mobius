<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Éditeur de Carte - Kumu Clone</title>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Vis.js Network CDN -->
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0d1322;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 60px;
      background-color: #1a2338;
      border-bottom: 1px solid #2e3a59;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-back {
      background: transparent;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-back:hover {
      background-color: #24304f;
      color: #fff;
    }

    .map-title {
      font-size: 18px;
      font-weight: 700;
      color: #7075f2;
    }

    .btn-secondary {
      background-color: #24304f;
      color: #f8fafc;
      border: 1px solid #2e3a59;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background-color: #2e3a59;
    }

    .main-container {
      flex: 1;
      display: flex;
      position: relative;
    }

    #network-canvas {
      flex: 1;
      height: 100%;
      background-color: #0d1322;
      overflow: hidden;
    }

    /* PANNEAU LATÉRAL */
    .sidebar {
      width: 360px;
      background-color: #1a2338;
      border-left: 1px solid #2e3a59;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .sidebar h3 {
      font-size: 18px;
      color: #7075f2;
      margin-bottom: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }

    .form-group input, .form-group textarea, .form-group select {
      background-color: #0d1322;
      border: 1px solid #2e3a59;
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: #5846f6;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .btn-save {
      background-color: #5846f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      width: 100%;
      margin-top: 4px;
      margin-bottom: 12px;
      transition: background-color 0.2s;
    }

    .btn-save:hover {
      background-color: #4338ca;
    }

    /* SECTION LIENS DANS L'INSPECTEUR */
    .links-section {
      border-top: 1px solid #2e3a59;
      padding-top: 16px;
      margin-top: 8px;
    }

    .links-header {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 12px;
    }

    .link-item {
      background-color: #0d1322;
      border: 1px solid #2e3a59;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .link-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .btn-delete-link {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 16px;
    }

    .btn-add-link-trigger {
      width: 100%;
      background-color: #24304f;
      color: #7075f2;
      border: 1px dashed #7075f2;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }

    .btn-add-link-trigger:hover {
      background-color: #2e3a59;
    }

    .btn-danger {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      margin-top: 16px;
    }

    /* LÉGENDE */
    .legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background-color: #0d1322;
      border: 1px solid #2e3a59;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .legend-label {
      font-size: 13px;
      color: #cbd5e1;
    }

    /* MENU CONTEXTUEL CLIC DROIT */
    #context-menu {
      position: absolute;
      display: none;
      background-color: #1a2338;
      border: 1px solid #2e3a59;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      overflow: hidden;
    }

    .context-item {
      padding: 10px 16px;
      font-size: 13px;
      color: #f8fafc;
      cursor: pointer;
      transition: background-color 0.1s;
    }

    .context-item:hover {
      background-color: #5846f6;
    }

    /* MODALES */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(13, 19, 34, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: #1a2338;
      border: 1px solid #2e3a59;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 28px;
    }

    .link-mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background-color: #0d1322;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #2e3a59;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      font-size: 12px;
      border: none;
      background: none;
      color: #94a3b8;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab-btn.active {
      background-color: #5846f6;
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="btn-back" onclick="window.location.href='dashboard.html'">← Dashboard</button>
      <span id="map-title" class="map-title">Chargement...</span>
    </div>

    <div>
      <button class="btn-secondary" onclick="openCollabModal()">Collaborateurs</button>
    </div>
  </header>

  <div class="main-container">
    <div id="network-canvas"></div>

    <div class="sidebar" id="sidebar">
      <div id="sidebar-content">
        <!-- Rempli dynamique en JS -->
      </div>
    </div>
  </div>

  <div id="context-menu">
    <div class="context-item" onclick="createNodeFromContext()">+ Ajouter une personne ici</div>
  </div>

  <div id="modal-collab" class="modal-overlay">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
        <h2 style="font-size: 18px;">Gérer les collaborateurs</h2>
        <button style="background:none; border:none; color:#94a3b8; cursor:pointer;" onclick="closeCollabModal()">&times;</button>
      </div>

      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <input type="email" id="collab-email-input" placeholder="Adresse email..." style="flex:1; padding: 8px; background:#0d1322; border:1px solid #2e3a59; border-radius:6px; color:#fff;" />
        <button class="btn-secondary" onclick="addCollaborator()">Ajouter</button>
      </div>

      <div id="collab-list"></div>
    </div>
  </div>

  <div id="modal-link" class="modal-overlay">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
        <h3 style="font-size: 18px; color: #7075f2; margin: 0;">Ajouter un lien</h3>
        <button style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size: 18px;" onclick="closeLinkModal()">&times;</button>
      </div>

      <div class="link-mode-tabs">
        <button id="tab-btn-existing" class="tab-btn active" onclick="switchLinkMode('existing')">Type existant</button>
        <button id="tab-btn-new" class="tab-btn" onclick="switchLinkMode('new')">Nouveau type</button>
      </div>

      <div id="view-link-existing">
        <div class="form-group">
          <label>Type de relation existant</label>
          <select id="pop-link-existing-select"></select>
        </div>

        <div class="form-group">
          <label>Relier à la personne</label>
          <select id="pop-link-target-existing"></select>
        </div>
      </div>

      <div id="view-link-new" style="display:none;">
        <div class="form-group">
          <label>Nom du type de lien</label>
          <input type="text" id="pop-link-new-name" placeholder="Ex: Frère, Suspect, Collègue..." />
        </div>

        <div class="form-group">
          <label>Couleur du lien</label>
          <input type="color" id="pop-link-new-color" value="#5846f6" style="height:38px; padding:2px; cursor:pointer; width:100%; border-radius:6px;" />
        </div>

        <div class="form-group">
          <label>Relier à la personne</label>
          <select id="pop-link-target-new"></select>
        </div>
      </div>

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn-secondary" onclick="closeLinkModal()" style="flex:1;">Annuler</button>
        <button onclick="confirmAddNewLink()" style="flex:1; background:#5846f6; color:#fff; border:none; padding:10px; border-radius:8px; font-weight:600; cursor:pointer;">Créer le lien</button>
      </div>
    </div>
  </div>
<script>
    window.addEventListener('error', function (event) {
      if (event.message && (event.message.includes('ResizeObserver') || event.message.includes('undelivered notifications'))) {
        event.stopImmediatePropagation();
        event.preventDefault();
      }
    }, true);

    const SUPABASE_URL = 'https://nlrizxxrpbgwkcmgwxqg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_t9XOimwLkG-a0mXIuwSw4w_B-fTU97f';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const mapId = new URLSearchParams(window.location.search).get('id');
    let currentUser = null;
    let network = null;
    let nodesDataSet = new vis.DataSet([]);
    let edgesDataSet = new vis.DataSet([]);
    let linkTypesCache = [];

    let selectedNodeId = null;
    let rightClickPosition = { x: 0, y: 0 };
    let activeLinkMode = 'existing';

    async function init() {
      if (!mapId) { window.location.href = 'dashboard.html'; return; }

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;

      const { data: map, error } = await supabaseClient.from('maps').select('*').eq('id', mapId).single();
      if (error || !map) { window.location.href = 'dashboard.html'; return; }

      const titleEl = document.getElementById('map-title');
      if (titleEl) titleEl.textContent = map.name;

      initNetwork();
      await loadGraphData();
    }

    function initNetwork() {
      const container = document.getElementById('network-canvas');
      const data = { nodes: nodesDataSet, edges: edgesDataSet };
      
      const options = {
        autoResize: true,
        height: '100%',
        width: '100%',
        nodes: {
          shape: 'box',
          margin: 12,
          borderWidth: 2,
          borderWidthSelected: 2,
          shapeProperties: {
            borderRadius: 8
          },
          font: { 
            color: '#ffffff', 
            size: 13, 
            face: 'system-ui, sans-serif'
          },
          color: { 
            background: '#182035', 
            border: '#2a365c', 
            highlight: { 
              background: '#182035', 
              border: '#5846f6'
            },
            hover: {
              background: '#182035',
              border: '#5846f6'
            }
          }
        },
        edges: {
          width: 2,
          selectionWidth: 3,
          smooth: { type: 'continuous' },
          font: { 
            color: '#f8fafc', 
            size: 11, 
            align: 'top', 
            background: '#0d1322', 
            strokeWidth: 0 
          }
        },
        interaction: {
          hover: true,
          selectConnectedEdges: false
        },
        physics: {
          enabled: false
        }
      };

      network = new vis.Network(container, data, options);

      network.on("click", (params) => {
        hideContextMenu();
        if (params.nodes.length > 0) {
          openInspector(params.nodes[0]);
        } else {
          selectedNodeId = null;
          renderLegend();
        }
      });

      network.on("oncontext", (params) => {
        params.event.preventDefault();
        const nodeId = network.getNodeAt(params.pointer.DOM);

        if (nodeId) {
          hideContextMenu();
          network.selectNodes([nodeId]);
          openInspector(nodeId);
        } else {
          rightClickPosition = network.DOMtoCanvas(params.pointer.DOM);
          showContextMenu(params.event.clientX, params.event.clientY);
        }
      });
    }

    const contextMenu = document.getElementById('context-menu');
    function showContextMenu(x, y) {
      if (contextMenu) {
        contextMenu.style.display = 'block';
        contextMenu.style.left = `${x}px`;
        contextMenu.style.top = `${y}px`;
      }
    }
    function hideContextMenu() {
      if (contextMenu) contextMenu.style.display = 'none';
    }

    async function createNodeFromContext() {
      hideContextMenu();

      const posX = Math.round(rightClickPosition.x);
      const posY = Math.round(rightClickPosition.y);

      const { data, error } = await supabaseClient
        .from('entities')
        .insert([{
          map_id: mapId,
          first_name: 'Nouvelle',
          last_name: 'Personne',
          x_pos: posX,
          y_pos: posY
        }])
        .select()
        .single();

      if (error) {
        alert("Erreur lors de la création : " + error.message);
        return;
      }

      if (data) {
        const labelText = `${data.first_name || ''} ${data.last_name || ''}`.trim() || 'Personne';

        nodesDataSet.add({
          id: data.id,
          label: labelText,
          shape: 'box',
          x: Number(data.x_pos),
          y: Number(data.y_pos),
          physics: false,
          fixed: { x: true, y: true },
          color: {
            background: '#1a2338',
            border: '#2e3a59',
            highlight: { background: '#1a2338', border: '#5846f6' },
            hover: { background: '#1a2338', border: '#5846f6' }
          },
          font: { color: '#f8fafc', size: 13 },
          details: data
        });

        selectedNodeId = data.id;

        network.redraw();
        network.selectNodes([data.id]);
        openInspector(data.id);
      }
    }

    async function loadGraphData() {
      const { data: entities, error: entitiesError } = await supabaseClient
        .from('entities')
        .select('*')
        .eq('map_id', mapId);

      if (entitiesError) {
        console.error("Erreur chargement entities :", entitiesError);
        return;
      }

      const { data: types, error: typesError } = await supabaseClient
        .from('link_types')
        .select('*')
        .eq('map_id', mapId);

      if (typesError) {
        console.error("Erreur chargement link_types :", typesError);
      }

      linkTypesCache = types || [];

      const { data: connections, error: connectionsError } = await supabaseClient
        .from('connections')
        .select('*, link_types(*)')
        .eq('map_id', mapId);

      if (connectionsError) {
        console.error("Erreur chargement connections :", connectionsError);
      }

      nodesDataSet.clear();
      if (entities) {
        nodesDataSet.add(
          entities.map(e => {
            const labelText = `${e.first_name || ''} ${e.last_name || ''}`.trim() || 'Personne';

            return {
              id: e.id,
              label: labelText,
              shape: 'box',
              x: e.x_pos !== null ? Number(e.x_pos) : undefined,
              y: e.y_pos !== null ? Number(e.y_pos) : undefined,
              physics: false,
              fixed: { x: true, y: true },
              color: {
                background: '#1a2338',
                border: '#2e3a59',
                highlight: { background: '#1a2338', border: '#5846f6' },
                hover: { background: '#1a2338', border: '#5846f6' }
              },
              font: { color: '#f8fafc', size: 13 },
              details: e
            };
          })
        );
      }

      edgesDataSet.clear();
      if (connections) {
        edgesDataSet.add(
          connections.map(c => {
            const linkType = c.link_types || {};

            return {
              id: c.id,
              from: c.from_entity_id,
              to: c.to_entity_id,
              label: linkType.label || '',
              link_type_id: c.link_type_id,
              color: {
                color: linkType.color || '#5846f6',
                highlight: linkType.color || '#5846f6'
              }
            };
          })
        );
      }

      network.redraw();
      renderLegend();
    }

    async function openInspector(nodeId) {
      selectedNodeId = nodeId;
      const node = nodesDataSet.get(nodeId);
      if (!node) { renderLegend(); return; }

      const d = node.details || {};
      const sidebarContent = document.getElementById('sidebar-content');

      const nodeEdges = edgesDataSet.get().filter(e => e.from === nodeId || e.to === nodeId);
      let linksHtml = '';
      nodeEdges.forEach(e => {
        const targetId = e.from === nodeId ? e.to : e.from;
        const targetNode = nodesDataSet.get(targetId);
        const edgeColor = typeof e.color === 'object' ? e.color.color : (e.color || '#5846f6');
        linksHtml += `
          <div class="link-item">
            <div class="link-info">
              <span class="color-dot" style="background-color: ${edgeColor};"></span>
              <span><strong>${e.label || 'Lien'}</strong> → ${targetNode ? targetNode.label : 'Inconnu'}</span>
            </div>
            <button class="btn-delete-link" onclick="deleteLink('${e.id}')">&times;</button>
          </div>
        `;
      });

      sidebarContent.innerHTML = `
        <h3>Inspecteur</h3>
        
        <div class="form-row">
          <div class="form-group" style="flex:1;">
            <label>Prénom</label>
            <input type="text" id="inp-first-name" value="${d.first_name || ''}" />
          </div>
          <div class="form-group" style="flex:1;">
            <label>Nom</label>
            <input type="text" id="inp-last-name" value="${d.last_name || ''}" />
          </div>
        </div>

        <div class="form-group">
          <label>Surnom</label>
          <input type="text" id="inp-nickname" value="${d.nickname || ''}" />
        </div>

        <div class="form-group">
          <label>Commentaire</label>
          <textarea id="inp-comment" rows="3">${d.comment || ''}</textarea>
        </div>

        <button class="btn-save" onclick="saveNodeDetails()">Enregistrer la personne</button>

        <div class="links-section">
          <div class="links-header">Liens de cette personne (${nodeEdges.length})</div>
          ${linksHtml}

          <button class="btn-add-link-trigger" onclick="openLinkModal()">
            + Ajouter un lien
          </button>
        </div>

        <button class="btn-danger" onclick="deletePerson('${nodeId}')">Supprimer la personne</button>
      `;
    }

    async function saveNodeDetails() {
      if (!selectedNodeId) return;

      const firstName = document.getElementById('inp-first-name')?.value.trim() || '';
      const lastName = document.getElementById('inp-last-name')?.value.trim() || '';
      const nickname = document.getElementById('inp-nickname')?.value.trim() || '';
      const comment = document.getElementById('inp-comment')?.value.trim() || '';

      const newLabel = `${firstName} ${lastName}`.trim() || 'Sans nom';

      const node = nodesDataSet.get(selectedNodeId);
      if (!node) {
        console.error("Nœud introuvable :", selectedNodeId);
        return;
      }

      const updatedDetails = {
        ...node.details,
        first_name: firstName,
        last_name: lastName,
        nickname: nickname,
        comment: comment
      };

      nodesDataSet.update({
        id: selectedNodeId,
        label: newLabel,
        details: updatedDetails
      });

      network.redraw();

      const { error } = await supabaseClient
        .from('entities')
        .update({
          first_name: firstName,
          last_name: lastName,
          nickname: nickname,
          comment: comment
        })
        .eq('id', selectedNodeId);

      if (error) {
        console.error("Erreur Supabase :", error);
        alert("Erreur lors de l'enregistrement : " + error.message);
        return;
      }

      const updatedNode = nodesDataSet.get(selectedNodeId);
      console.log("Nœud après sauvegarde :", updatedNode);

      alert("Modifications enregistrées !");
    }

    function switchLinkMode(mode) {
      activeLinkMode = mode;
      const btnExisting = document.getElementById('tab-btn-existing');
      const btnNew = document.getElementById('tab-btn-new');
      const viewExisting = document.getElementById('view-link-existing');
      const viewNew = document.getElementById('view-link-new');

      if (mode === 'existing') {
        if (btnExisting) btnExisting.classList.add('active');
        if (btnNew) btnNew.classList.remove('active');
        if (viewExisting) viewExisting.style.display = 'block';
        if (viewNew) viewNew.style.display = 'none';
      } else {
        if (btnNew) btnNew.classList.add('active');
        if (btnExisting) btnExisting.classList.remove('active');
        if (viewNew) viewNew.style.display = 'block';
        if (viewExisting) viewExisting.style.display = 'none';
      }
    }

    function openLinkModal() {
      if (!selectedNodeId) return;

      const otherNodes = nodesDataSet.get().filter(n => n.id !== selectedNodeId);
      const targetSelectExisting = document.getElementById('pop-link-target-existing');
      const targetSelectNew = document.getElementById('pop-link-target-new');

      let targetOptionsHtml = '<option value="">Choisir la personne...</option>';
      otherNodes.forEach(n => {
        targetOptionsHtml += `<option value="${n.id}">${n.label}</option>`;
      });

      if (targetSelectExisting) targetSelectExisting.innerHTML = targetOptionsHtml;
      if (targetSelectNew) targetSelectNew.innerHTML = targetOptionsHtml;

      const existingSelect = document.getElementById('pop-link-existing-select');
      if (existingSelect) {
        existingSelect.innerHTML = '';

        if (linkTypesCache.length === 0) {
          existingSelect.innerHTML = '<option value="">Aucun type existant - Créez-en un</option>';
          switchLinkMode('new');
        } else {
          linkTypesCache.forEach(t => {
            existingSelect.innerHTML += `<option value="${t.id}">${t.label}</option>`;
          });
          switchLinkMode('existing');
        }
      }

      const modalLink = document.getElementById('modal-link');
      if (modalLink) modalLink.classList.add('active');
    }

    function closeLinkModal() {
      const modalLink = document.getElementById('modal-link');
      if (modalLink) modalLink.classList.remove('active');
    }

    async function confirmAddNewLink() {
      let targetId = null;
      let linkTypeId = null;

      if (activeLinkMode === 'existing') {
        linkTypeId = document.getElementById('pop-link-existing-select').value;
        targetId = document.getElementById('pop-link-target-existing').value;

        if (!linkTypeId) { alert("Aucun type de lien sélectionné."); return; }
        if (!targetId) { alert("Veuillez choisir la personne à relier."); return; }

      } else {
        const label = document.getElementById('pop-link-new-name').value.trim();
        const color = document.getElementById('pop-link-new-color').value;
        targetId = document.getElementById('pop-link-target-new').value;

        if (!label) { alert("Saisissez un nom pour le type de lien."); return; }
        if (!targetId) { alert("Veuillez choisir la personne à relier."); return; }

        const { data: newType, error: typeErr } = await supabaseClient
          .from('link_types')
          .insert([{ map_id: mapId, label: label, color: color }])
          .select()
          .single();

        if (typeErr) { alert("Erreur type lien : " + typeErr.message); return; }
        linkTypeId = newType.id;
        linkTypesCache.push(newType);
      }

      const { data, error } = await supabaseClient
        .from('connections')
        .insert([{
          map_id: mapId,
          from_entity_id: selectedNodeId,
          to_entity_id: targetId,
          link_type_id: linkTypeId
        }])
        .select('*, link_types(*)')
        .single();

      if (error) {
        alert("Erreur lors de la création du lien : " + error.message);
        return;
      }

      if (data) {
        const lType = data.link_types || {};
        const color = lType.color || '#5846f6';
        edgesDataSet.add({
          id: data.id,
          from: data.from_entity_id,
          to: data.to_entity_id,
          label: lType.label || '',
          link_type_id: data.link_type_id,
          color: { color: color, highlight: color }
        });

        closeLinkModal();
        openInspector(selectedNodeId);
        renderLegend();
      }
    }

    async function deleteLink(linkId) {
      edgesDataSet.remove(linkId);
      const { error } = await supabaseClient.from('connections').delete().eq('id', linkId);
      if (error) console.error("Erreur suppression connexion BDD :", error.message);

      if (selectedNodeId) {
        openInspector(selectedNodeId);
      }
      renderLegend();
    }

    async function deletePerson(nodeId) {
      nodesDataSet.remove(nodeId);
      const { error } = await supabaseClient.from('entities').delete().eq('id', nodeId);
      if (error) console.error("Erreur suppression entité BDD :", error.message);

      selectedNodeId = null;
      renderLegend();
    }

    function renderLegend() {
      const sidebarContent = document.getElementById('sidebar-content');
      if (!sidebarContent) return;

      let legendHtml = '';
      if (linkTypesCache.length === 0) {
        legendHtml = '<p style="font-size: 13px; color: #64748b;">Aucun type de lien pour le moment.</p>';
      } else {
        linkTypesCache.forEach(t => {
          legendHtml += `
            <div class="legend-item">
              <span class="color-dot" style="background-color: ${t.color}; width: 14px; height: 14px;"></span>
              <span class="legend-label">${t.label}</span>
            </div>
          `;
        });
      }

      sidebarContent.innerHTML = `
        <h3>Légende</h3>
        ${legendHtml}
      `;
    }

    function openCollabModal() {
      const modal = document.getElementById('modal-collab');
      if (modal) modal.classList.add('active');
      loadCollaborators();
    }

    function closeCollabModal() {
      const modal = document.getElementById('modal-collab');
      if (modal) modal.classList.remove('active');
    }

    async function loadCollaborators() {
      const collabList = document.getElementById('collab-list');
      if (!collabList) return;

      const { data: collabs, error } = await supabaseClient
        .from('map_collaborators')
        .select('*')
        .eq('map_id', mapId);

      if (error) {
        collabList.innerHTML = `<p style="font-size:12px; color:#ef4444;">Erreur : ${error.message}</p>`;
        return;
      }

      if (!collabs || collabs.length === 0) {
        collabList.innerHTML = '<p style="font-size:13px; color:#64748b;">Aucun collaborateur pour l\'instant.</p>';
        return;
      }

      let html = '';
      collabs.forEach(c => {
        html += `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #2e3a59;">
            <span style="font-size:13px; color:#fff;">${c.user_email || c.user_id}</span>
            <button class="btn-delete-link" onclick="removeCollaborator('${c.id}')">&times;</button>
          </div>
        `;
      });
      collabList.innerHTML = html;
    }

    async function addCollaborator() {
      const emailInput = document.getElementById('collab-email-input');
      const email = emailInput ? emailInput.value.trim() : '';
      if (!email) return;

      const { error } = await supabaseClient
        .from('map_collaborators')
        .insert([{ map_id: mapId, user_email: email }]);

      if (error) {
        alert("Erreur lors de l'ajout : " + error.message);
      } else {
        if (emailInput) emailInput.value = '';
        loadCollaborators();
      }
    }

    async function removeCollaborator(collabId) {
      const { error } = await supabaseClient
        .from('map_collaborators')
        .delete()
        .eq('id', collabId);

      if (error) {
        alert("Erreur lors de la suppression : " + error.message);
      } else {
        loadCollaborators();
      }
    }

    init();
</script>
</body>
</html>
