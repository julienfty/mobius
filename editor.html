<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Éditeur de Fichier - Mobius</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E✍️%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Import de fichiers dans l'arborescence (mêmes outils que la page map) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>.tree-row{user-select:none}.tree-drop-before{box-shadow:0 -2px 0 0 #5246EE}.tree-drop-after{box-shadow:0 2px 0 0 #5246EE}.tree-drop-inside{background:rgba(82,70,238,.12);box-shadow:inset 0 0 0 2px rgba(82,70,238,.5)}</style>

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#5246EE',
                            hover: '#4538d8',
                            light: '#766df2',
                            subtle: '#f4f3ff'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(100,100,100,0.2); border-radius: 4px; }
    </style>
    <style>.hdrbtn{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;color:#475569;flex-shrink:0}.dark .hdrbtn{background:#1e293b;color:#cbd5e1}
.ed-in{width:100%;padding:.6rem .8rem;border-radius:.75rem;border:1px solid #e2e8f0;background:transparent;font-size:.875rem;outline:none}.ed-in:focus{border-color:#5246EE}.dark .ed-in{border-color:#334155}
.ed-pick{width:15rem;padding:1.5rem 1rem;border-radius:1rem;border:1px solid #e2e8f0;background:#fff;display:flex;flex-direction:column;align-items:center;gap:.5rem;font-size:.75rem;color:#64748b;transition:.15s}.ed-pick:hover{border-color:#5246EE;transform:translateY(-2px)}.ed-pick b{font-size:.95rem;color:#0f172a}.dark .ed-pick{background:#0f172a;border-color:#334155}.dark .ed-pick b{color:#f1f5f9}
.ed-page{white-space:pre-wrap;min-height:1056px;background:#fff;color:#0f172a;border:1px solid #e2e8f0;border-radius:1rem;padding:48px 56px;outline:none;box-shadow:0 1px 3px rgba(0,0,0,.06);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 1055px,rgba(82,70,238,.45) 1055px,rgba(82,70,238,.45) 1056px);line-height:1.6;word-break:break-word}.dark .ed-page{background-color:#0f172a;color:#e2e8f0;border-color:#1e293b}
@media(max-width:640px){.ed-page{padding:28px 20px}}
.script{font-family:'Courier Prime','American Typewriter','Courier New',monospace;font-size:14px}
[data-s=title]{font-size:2.4em;font-weight:800;text-align:center;margin:.3em 0}[data-s=h1]{font-size:1.9em;font-weight:700;margin:.6em 0 .2em}[data-s=h2]{font-size:1.5em;font-weight:700;margin:.5em 0 .2em}[data-s=h3]{font-size:1.2em;font-weight:700;margin:.4em 0 .1em}[data-s=sub]{font-size:1.15em;color:#64748b;font-style:italic;margin:.2em 0}[data-s=box]{border:1px solid #c7c3fb;background:rgba(82,70,238,.07);border-radius:.75rem;padding:.6em .9em;margin:.5em 0}
.script [data-s=title],.script [data-s=sub]{text-align:center}
[data-s=act]{text-align:center;font-weight:700;text-transform:uppercase;text-decoration:underline;margin:2em 0 1em}[data-s=scene]{font-weight:700;text-transform:uppercase;margin:1.6em 0 .6em}[data-s=desc]{font-style:italic;margin:.6em 0}[data-s=char]{text-transform:uppercase;margin:1em 0 0 37%}[data-s=dial]{margin:0 15% 0 20%}[data-s=paren]{margin:0 25% 0 28%;font-style:italic}[data-s=action]{margin:.6em 0}
[data-bubble]{background:rgba(250,204,21,.3);border-bottom:2px dotted #eab308;cursor:pointer}[data-bubble]::after{content:'💬';font-size:.7em;margin-left:2px}
.show-by [data-by]{box-shadow:inset 3px 0 0 var(--c,#5246EE);padding-left:8px}
.ed-tools{display:none;width:13rem;flex-direction:column;gap:.2rem;padding:.75rem;border-left:1px solid #e2e8f0;background:#fff;overflow-y:auto;flex-shrink:0}.dark .ed-tools{background:#0f172a;border-color:#1e293b}
@media(min-width:768px) and (orientation:landscape){.ed-tools{display:flex}}
.tb{padding:.45rem .6rem;border-radius:.6rem;font-size:.75rem;text-align:left;color:#475569;display:flex;gap:.5rem;align-items:center}.tb:hover{background:#f1f5f9}.dark .tb{color:#cbd5e1}.dark .tb:hover{background:#1e293b}
.ed-bub,.ed-prop,#ed-menu{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:.75rem;box-shadow:0 10px 30px rgba(0,0,0,.15);font-size:.85rem}.dark .ed-bub,.dark .ed-prop,.dark #ed-menu{background:#0f172a;border-color:#334155;color:#e2e8f0}
.ed-prop{box-shadow:none;border-style:dashed;border-color:#5246EE}.ed-mini{min-height:3rem;outline:none;white-space:pre-wrap}
#ed-menu{position:fixed;z-index:60;width:13rem;padding:.4rem;font-size:.75rem}#ed-menu .tb{width:100%}#ed-menu hr{margin:.3rem 0;border-color:#e2e8f0}
.vote{padding:.3rem .6rem;border-radius:.6rem;border:1px solid #e2e8f0}.vote.on{background:#5246EE;color:#fff;border-color:#5246EE}
</style>
    <style>.ed-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,48rem) minmax(16rem,1fr);column-gap:1.25rem;align-items:stretch}
.ed-row .ed-page{grid-column:2;position:relative}.ed-side{grid-column:3;position:relative;max-width:18rem}
.ed-row.stack{grid-template-columns:minmax(0,48rem);justify-content:center}.ed-row.stack .ed-page,.ed-row.stack .ed-side{grid-column:1}.ed-row.stack .ed-side{max-width:none}
.hl{background:#fde047;color:#0f172a;border-radius:2px}
.ed-fab{display:flex}@media(min-width:768px) and (orientation:landscape){.ed-fab{display:none}}
@media not all and (min-width:768px) and (orientation:landscape){#ed-scroll{padding-top:3.75rem!important}}
.ed-tools{gap:.5rem;width:12.5rem;background:#fbfbfd}.dark .ed-tools{background:#0b1120}
.sec{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin-top:.6rem}
.seg{flex:1;height:30px;border-radius:8px;background:#eef0f4;color:#475569;font-size:12px;transition:.12s}.seg:hover{background:#e2e5ec}.seg.on{background:#5246EE;color:#fff}.dark .seg{background:#1e293b;color:#cbd5e1}.dark .seg.on{background:#5246EE;color:#fff}
.dd{width:100%;display:flex;justify-content:space-between;align-items:center;padding:.45rem .7rem;border-radius:.6rem;background:#eef0f4;font-size:.78rem}.dark .dd{background:#1e293b}
.dd-menu{position:absolute;left:0;right:0;top:110%;z-index:5;background:#fff;border:1px solid #e2e8f0;border-radius:.75rem;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:.25rem}.dark .dd-menu{background:#0f172a;border-color:#334155}
.dd-menu button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:.4rem .6rem;font-size:.78rem;border-radius:.5rem;text-align:left}.dd-menu button:hover{background:#eef0f4}.dark .dd-menu button:hover{background:#1e293b}
.stepper{display:flex;flex-direction:column;align-items:center;width:3.4rem;border-radius:.75rem;background:#eef0f4;padding:.15rem}.dark .stepper{background:#1e293b}
.stepper button{height:24px;width:100%;font-size:10px;color:#64748b}.stepper button:hover{color:#5246EE}
.stepper input{width:100%;text-align:center;background:transparent;font-size:.85rem;font-weight:600;outline:none;-moz-appearance:textfield}.stepper input::-webkit-inner-spin-button{display:none}
.ed-chip{font-size:.72rem;padding:.35rem .7rem;border-radius:999px;border:1px dashed #5246EE;background:#fff;color:#5246EE}.dark .ed-chip{background:#0f172a}
</style>
    <style>[data-a=left]{text-align:left}[data-a=center]{text-align:center}[data-a=right]{text-align:right}[data-a=justify]{text-align:justify}
.ed-page:not(.script) [data-i]{margin-left:calc(var(--i,0)*2rem)}
.segbar{display:flex;background:#eef0f4;border-radius:10px;padding:2px;gap:2px}.dark .segbar{background:#1e293b}
.segbar .seg{background:transparent;border-radius:8px}.segbar .seg:hover{background:rgba(0,0,0,.06)}.segbar .seg.on{background:#5246EE;color:#fff}.dark .segbar .seg:hover{background:rgba(255,255,255,.08)}</style>
<style>
.pm-row{display:flex;gap:.4rem;align-items:center;margin-bottom:.5rem;flex-wrap:wrap}
.pm-sel{flex:1;min-width:0;padding:.3rem .5rem;border-radius:.6rem;border:1px solid #e2e8f0;background:transparent;font-size:.72rem;color:inherit;outline:none}.pm-sel:focus{border-color:#5246EE}.pm-sel option{color:#0f172a}
.dark .pm-sel{border-color:#334155}.dark .pm-sel option{background:#0f172a;color:#e2e8f0}
.pm-num{width:4rem;padding:.3rem .5rem;border-radius:.6rem;border:1px solid #e2e8f0;background:transparent;font-size:.72rem;outline:none}.dark .pm-num{border-color:#334155}
.pm-seg{display:flex;border-radius:.6rem;background:#eef0f4;padding:2px;gap:2px;flex-shrink:0}.dark .pm-seg{background:#1e293b}
.pm-seg button{padding:.25rem .55rem;font-size:.7rem;border-radius:.5rem;color:#64748b}.pm-seg button.on{background:#5246EE;color:#fff}
.ed-prop .ed-mini{max-height:22rem;overflow-y:auto;min-height:5rem}
.side-item.ed-full{position:fixed!important;z-index:50;margin:0!important;display:flex;flex-direction:column;box-sizing:border-box;border-radius:0;overflow:hidden;box-shadow:none;border-style:solid}
.side-item.ed-full .ed-mini{flex:1 1 auto;min-height:0;max-height:none!important;overflow-y:auto;font-size:15px}
</style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col antialiased selection:bg-[#5246EE] selection:text-white">

    <!-- HEADER (même structure que la page map : retour + fil d'Ariane cliquable) -->
    <header id="top-header" class="w-full border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md sticky top-0 z-40 px-4 py-3 flex items-center justify-between gap-2 shadow-xs">
        <div class="flex items-center gap-3 overflow-hidden">
            <button onclick="goBack()" class="w-9 h-9 shrink-0 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all" title="Quitter le fichier">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div id="breadcrumb-container" class="flex items-center gap-1.5 text-xs font-semibold overflow-x-auto whitespace-nowrap cursor-pointer py-1 px-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-all" onclick="toggleTreeSidebar()">
                <span class="text-slate-400">Chargement...</span>
            </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
            <span id="role-badge" class="hidden sm:inline-flex px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-slate-100 dark:bg-slate-800 text-slate-500"></span>
            <button id="ed-authors-btn" onclick="toggleAuthors()" title="Voir qui a écrit quoi" class="hdrbtn hidden"><i class="fa-solid fa-user-pen"></i></button>
            <div class="relative">
                <button onclick="toggleCollaboratorsDropdown()" class="px-3 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-medium rounded-xl flex items-center space-x-2 transition">
                    <i data-lucide="users" class="w-3.5 h-3.5 text-[#5246EE]"></i>
                    <span id="collab-count-label" class="hidden sm:inline">Collaborateurs (1)</span>
                    <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
                </button>
                <div id="collab-dropdown" class="hidden absolute right-0 mt-2 w-[24rem] max-w-[92vw] bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 p-4 z-50">
                    <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3">Gestion des collaborateurs</h4>
                    <div id="collaborators-list" class="space-y-2 max-h-56 overflow-y-auto mb-3"></div>
                    <div id="collab-add-section" class="pt-2 border-t border-slate-100 dark:border-slate-800">
                        <div class="flex space-x-2">
                            <input type="email" id="new-collab-email" placeholder="email@membre.com" class="flex-1 min-w-0 px-3 py-1.5 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-[#5246EE]">
                            <select id="new-collab-role" class="px-2 py-1.5 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none">
                                <option value="viewer">Observateur</option>
                                <option value="editor" selected>Peut modifier</option>
                                <option value="admin">Admin</option>
                            </select>
                            <button onclick="addCollaborator()" class="px-3 py-1.5 bg-[#5246EE] hover:bg-[#4538d8] text-white text-xs font-medium rounded-lg">Ajouter</button>
                        </div>
                    </div>
                </div>
            </div>
            <button id="ed-export-btn" onclick="exportDoc()" title="Exporter (.mobtext / .mobscen)" class="hdrbtn hidden"><i class="fa-solid fa-file-export"></i></button>
            <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
            </button>
            <button id="save-btn" onclick="saveFile()" class="bg-[#5246EE] hover:bg-[#4538d8] text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md shadow-[#5246EE]/25 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-floppy-disk"></i>
                <span class="hidden sm:inline">Enregistrer</span>
            </button>
        </div>
    </header>

    <!-- ZONE PRINCIPALE : ARBORESCENCE + ÉDITEUR -->
    <div class="flex-1 flex overflow-hidden relative min-h-0">
        <aside id="tree-sidebar" class="hidden md:flex flex-col w-full md:w-72 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 z-20 shadow-md">
            <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <h3 class="font-bold text-xs uppercase tracking-wider text-slate-500">Arborescence du Projet</h3>
                <button onclick="closeTreeSidebar()" title="Replier l'arborescence" class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div id="tree-toolbar" class="hidden px-3 py-2 border-b border-slate-200 dark:border-slate-800">
                <div class="flex flex-wrap gap-1.5">
                    <button data-tree-create="folder" title="Nouveau dossier" class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-[11px] font-medium flex items-center gap-1"><i data-lucide="folder-plus" class="w-3.5 h-3.5 text-[#5246EE]"></i>Dossier</button>
                    <button data-tree-create="txt" title="Nouveau fichier .txt" class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-[11px] font-medium flex items-center gap-1"><i data-lucide="file-text" class="w-3.5 h-3.5 text-emerald-500"></i>.txt</button>
                    <button data-tree-create="card" title="Nouvelle carte" class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-[11px] font-medium flex items-center gap-1"><i data-lucide="sticky-note" class="w-3.5 h-3.5 text-indigo-500"></i>Carte</button>
                    <button id="tree-import-btn" title="Importer un fichier" class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-[11px] font-medium flex items-center gap-1"><i data-lucide="file-up" class="w-3.5 h-3.5 text-[#5246EE]"></i>Importer</button>
                </div>
                <div id="tree-dest" class="mt-1.5 text-[10px] text-slate-400 truncate"></div>
                <input type="file" id="tree-file-input" class="hidden" accept=".txt,.json,.mobius,.fountain,.page,.pdf,.docx,.mobtext,.mobscen" multiple>
            </div>
            <div id="tree-sidebar-content" class="flex-1 p-3 overflow-y-auto space-y-1 text-xs"></div>
            <div class="p-3 border-t border-slate-200 dark:border-slate-800">
                <button onclick="downloadProject()" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 flex items-center justify-center gap-2 transition"><i data-lucide="download" class="w-4 h-4 text-red-500"></i> Télécharger le projet (.mobpro)</button>
            </div>
        </aside>


        <main class="flex-1 min-w-0 flex overflow-hidden relative">
  <div id="ed-choose" style="display:none;flex-direction:column" class="flex-1 items-center justify-center gap-6 p-6 overflow-y-auto">
    <h2 class="text-lg font-bold">Que veux-tu écrire ?</h2>
    <div class="flex flex-wrap gap-4 justify-center">
      <button class="ed-pick" onclick="pickType('text')"><i class="fa-solid fa-align-left text-2xl text-[#5246EE]"></i><b>Texte</b><span>Mise en forme, titres, bulles</span></button>
      <button class="ed-pick" onclick="pickType('script')"><i class="fa-solid fa-film text-2xl text-[#5246EE]"></i><b>Scénario</b><span>Format scénario, propositions, votes</span></button>
    </div>
  </div>
  <div id="ed-title" style="display:none" class="flex-1 items-center justify-center p-6">
    <div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-3">
      <h2 class="font-bold">Page de titre</h2>
      <input id="ed-t-title" class="ed-in" placeholder="Titre"><input id="ed-t-author" class="ed-in" placeholder="Auteur">
      <button onclick="submitTitle()" class="w-full bg-[#5246EE] text-white rounded-xl py-2.5 text-xs font-semibold">Commencer à écrire</button>
    </div>
  </div>
  <div id="ed-work" style="display:none" class="flex-1 min-w-0 overflow-hidden relative">
    <div id="ed-fab" class="ed-fab absolute top-3 left-3 z-[45] items-center gap-2">
      <button id="fab-undo" onclick="undoAction()" title="Retour arrière" aria-label="Retour arrière" class="flex items-center justify-center px-3 py-2 rounded-2xl text-xs font-semibold shadow-lg border bg-white/95 dark:bg-slate-900/95 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 backdrop-blur-md transition-all"><i data-lucide="undo-2" class="w-4 h-4"></i></button>
      <button id="fab-redo" onclick="redoAction()" title="Retour avant" aria-label="Retour avant" class="flex items-center justify-center px-3 py-2 rounded-2xl text-xs font-semibold shadow-lg border bg-white/95 dark:bg-slate-900/95 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 backdrop-blur-md transition-all"><i data-lucide="redo-2" class="w-4 h-4"></i></button>
    </div>
    <div id="ed-scroll" class="flex-1 min-w-0 overflow-y-auto p-4 sm:p-8" onscroll="pageNo()">
      <div class="max-w-6xl mx-auto">
        <div class="flex justify-between text-[11px] text-slate-400 mb-2"><span id="ed-pageno"></span><span id="ed-legend" class="flex gap-2"></span></div>
        <div class="ed-row"><div id="ed-page" class="ed-page" contenteditable="true" spellcheck="false"></div><div id="ed-side" class="ed-side"></div></div>
      </div>
    </div>
    <aside id="ed-tools" class="ed-tools"></aside>
  </div>
</main>
    </div>

    <!-- MENU CONTEXTUEL DE L'ARBORESCENCE -->
    <div id="tree-context-menu" class="hidden fixed bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 py-2 z-50 text-xs w-56"></div>

    <div id="toast-notification" class="hidden fixed bottom-6 right-6 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-2xl z-50 flex items-center space-x-3 transition transform translate-y-2 opacity-0 pointer-events-none">

    function dlg({ title, message = '', input = null, buttons, row = false }) {

            if (input) { inp.classList.remove('hidden'); inp.type = input.type || 'text'; inp.placeholder = input.placeholder || ''; inp.value = input.value || ''; }
            const done = (value) => { ov.remove(); document.removeEventListener('keydown', onKey, true); resolve(value === undefined ? null : { value, text: inp.value }); };
            const primary = buttons.find(b => b.primary);
            const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(undefined); } else if (e.key === 'Enter' && input && primary) { e.preventDefault(); done(primary.value); } };
            buttons.forEach(b => {

                btn.addEventListener('click', () => done(b.value));

        });

    // --- Détection de fichiers binaires / images (signatures + octets de contrôle) ---
    function detectBinaryKind(bytes) {
        const sig = (...b) => b.every((v, i) => bytes[i] === v);
        if (sig(0x89, 0x50, 0x4E, 0x47)) return 'une image PNG';
        if (sig(0xFF, 0xD8, 0xFF)) return 'une image JPEG';
        if (sig(0x47, 0x49, 0x46, 0x38)) return 'une image GIF';
        if (sig(0x52, 0x49, 0x46, 0x46)) return 'un fichier RIFF (image WebP / audio / vidéo)';
        if (sig(0x25, 0x50, 0x44, 0x46)) return 'un PDF (renommé)';
        if (sig(0x50, 0x4B, 0x03, 0x04)) return 'une archive ZIP (ex. fichier Pages ou Word)';
        if (sig(0xD0, 0xCF, 0x11, 0xE0)) return 'un ancien document Office (.doc)';
        const head = bytes.subarray(0, 8192);
        if (head[0] === 0xFF && head[1] === 0xFE || head[0] === 0xFE && head[1] === 0xFF) return null; // UTF-16 avec BOM
        let ctrl = 0;
        for (const v of head) { if (v === 0) return 'des données binaires'; if (v < 9 || (v > 13 && v < 32)) ctrl++; }
        return head.length && ctrl / head.length > 0.02 ? 'des données binaires' : null;
    }

    // --- Décodage avec détection d'encodage (UTF-16 BOM, UTF-8, sinon Windows-1252) ---
    function decodeTextBytes(bytes) {
        if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes.subarray(2));
        if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes.subarray(2));
        try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/^\uFEFF/, ''); }
        catch (e) { return new TextDecoder('windows-1252').decode(bytes); }
    }

    async function pdfToText(buf) {
        if (!window.pdfjsLib) throw new Error("lecteur PDF indisponible (connexion ?)");
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
        const pages = [];
        for (let n = 1; n <= pdf.numPages; n++) {
            const content = await (await pdf.getPage(n)).getTextContent();
            let out = '', lastY = null;
            for (const it of content.items) {
                if (it.str === '') { if (it.hasEOL && out && !out.endsWith('\n')) out += '\n'; continue; }
                const y = it.transform ? it.transform[5] : null;
                if (lastY !== null && y !== null && Math.abs(y - lastY) > 2 && out && !out.endsWith('\n')) out += '\n';
                out += it.str;
                if (it.hasEOL && !out.endsWith('\n')) out += '\n';
                if (y !== null) lastY = y;
            }
            pages.push(out.trim());
        }
        return fixPdfLigatures(pages.filter(Boolean).join('\n\n'));
    }

    // Beaucoup de PDF (Keynote, Pages, certaines polices) encodent les ligatures « ti » / « tt »
    // avec un mauvais caractère : « aberra%ons », « len5lle », « vigne.e », « vigne=age ».
    // On les répare quand le caractère est coincé entre des lettres (donc jamais dans « 50% » ou « x=2 »).
    const KEEP_DOT = /^(com|fr|org|net|io|html?|js|css|txt|pdf|docx?|json|md|png|jpe?g|gif|svg|mobius|mobpro|fountain|pages?|xml|csv|zip|be|de|uk|eu|us|ca|ch)$/;
    function fixPdfLigatures(text) {
        let n = 0;
        const bump = (r) => (...a) => { n++; return r(...a); };
        text = text.replace(/⦁/g, '•');
        text = text.replace(/(?<=\p{L})%(?=\p{L})/gu, bump(() => 'ti'));
        text = text.replace(/(?<=\p{Ll})5(?=\p{Ll})/gu, bump(() => 'ti'));
        text = text.replace(/(?<=\p{Ll}{2})=(?=\p{Ll}{2})/gu, bump(() => 'tt'));
        text = text.replace(/(\p{Ll}{2,})\.(\p{Ll}+)/gu, (m, a, b) => KEEP_DOT.test(b) ? m : (n++, a + 'tt' + b));
        return { text, fixes: n };
    }

    async function docxToText(buf) {
        const zip = await JSZip.loadAsync(buf);
        const entry = zip.file('word/document.xml');
        if (!entry) throw new Error("ce n'est pas un document Word valide");
        const xml = new DOMParser().parseFromString(await entry.async('string'), 'application/xml');
        const walk = (node) => {
            let t = '';
            for (const ch of node.childNodes) {
                const n = ch.localName;
                if (n === 't') t += ch.textContent;
                else if (n === 'tab') t += '\t';
                else if (n === 'br' || n === 'cr') t += '\n';
                else if (ch.nodeType === 1) t += walk(ch);
            }
            return t;
        };
        return [...xml.getElementsByTagNameNS('*', 'p')].map(walk).join('\n').replace(/\n{3,}/g, '\n\n').trim();
    }

    // Transforme n'importe quel fichier accepté en texte brut (images et mise en forme ignorées).
    // Lance une Error (message lisible) si le fichier est refusé.
    async function fileToText(file) {
        if (file.size > MAX_INPUT_BYTES) throw new Error('fichier trop volumineux (max 20 Mo)');
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let text, fixes = 0;
        if (/\.pdf$/i.test(file.name)) {
            if (!(bytes[0] === 0x25 && bytes[1] === 0x50)) throw new Error("ce n'est pas un vrai PDF");
            ({ text, fixes } = await pdfToText(buf));
        } else if (/\.docx$/i.test(file.name)) {
            if (!(bytes[0] === 0x50 && bytes[1] === 0x4B)) throw new Error("ce n'est pas un vrai .docx");
            text = await docxToText(buf);
        } else {
            const kind = detectBinaryKind(bytes);
            if (kind) throw new Error(`le fichier contient ${kind}, pas du texte`);
            text = decodeTextBytes(bytes);
        }
        if (!text.trim()) throw new Error('aucun texte trouvé (document scanné ou composé uniquement d\'images ?)');
        if (text.length > MAX_TEXT_CHARS) throw new Error('texte trop long (max 2 millions de caractères)');
        return { text, fixes };
    }

                if (list[i].children) { const f = locateTreeItem(list[i].children, id); if (f) return f; }
            }
            return null;
        }
        function treeParentOf(list, id, parent = null) {
            for (const it of list) {
                if (it.id === id) return parent;
                if (it.children) { const f = treeParentOf(it.children, id, it); if (f !== undefined) return f; }
            }
            return undefined;

        // t : { folderId } (dans un dossier, à la fin) | { id, pos: 'before'|'after'|'inside' } | null (racine)
        function treeInsert(item, t) {
            const root = projectData.tree;

            if (t.folderId !== undefined) {
                const f = t.folderId && findTreeItem(root, t.folderId);
                if (f && f.type === 'folder') { (f.children ||= []).push(item); treeExpanded.add(f.id); } else root.push(item);
                return;
            }
            const loc = t.id && locateTreeItem(root, t.id);
            if (!loc) { root.push(item); return; }
            if (t.pos === 'inside' && loc.item.type === 'folder') { (loc.item.children ||= []).push(item); treeExpanded.add(loc.item.id); return; }
            loc.list.splice(loc.index + (t.pos === 'before' ? 0 : 1), 0, item);

            if (loc.item.id === cardId || treeContainsId(loc.item, cardId)) { showToast("Impossible de supprimer la carte actuellement ouverte (ni son dossier)."); return; }

            if (treeSelectedId === id || !findTreeItem(projectData.tree, treeSelectedId)) treeSelectedId = null;
            treeStoreUI(); refreshTree();
        }

        function treeMoveStep(id, dir) {
            if (!requireEdit()) return;
            const loc = locateTreeItem(projectData.tree, id); if (!loc) return;
            const j = loc.index + dir;
            if (j < 0 || j >= loc.list.length) return;

        }

        function treeMoveTo(id, t) {

            const loc = locateTreeItem(root, id); if (!loc) return;
            if (t.id === id) return;
            if (t.id && treeContainsId(loc.item, t.id)) { showToast("Impossible de déplacer un dossier dans lui-même."); return; }

        /* ---------- Import (mêmes formats / conversions que le dashboard) ---------- */
        async function treeImport(files, dest) {
            if (!requireEdit()) return;
            const accepted = files.filter(f => /\.(txt|json|mobius|fountain|page|pdf|docx|mobtext|mobscen)$/i.test(f.name));
            if (accepted.length < files.length) showToast('Formats acceptés : .txt, .json, .fountain, .page, .pdf, .docx et .mobius.');
            let t = dest, added = 0;
            const put = (item) => {
                treeInsert(item, t); added++;
                if (t && t.id && (t.pos === 'before' || t.pos === 'after')) t = { id: item.id, pos: 'after' };   // conserve l'ordre des fichiers déposés
            };
            for (const file of accepted) {
                try {
                    if (/\.(mobtext|mobscen)$/i.test(file.name)) {
                        const d = JSON.parse(await file.text());
                        put({ id: newItemId(), type: 'txt', name: d.name || file.name.replace(/\.[^.]+$/, ''), content: d.content || '', docType: d.type, doc: d.doc }); continue;
                    }
                    if (/\.mobius$/i.test(file.name)) {
                        const card = parseMobiusCard(await file.text(), file.name);
                        if (!card) { showToast(`« ${file.name} » n'est pas une carte Mobius valide.`); continue; }
                        put(card);
                    } else if (/\.json$/i.test(file.name)) {
                        const raw = await file.text();
                        const card = parseMobiusCard(raw, file.name);
                        const choice = await askJsonFormat(file.name, !!card);
                        if (choice === 'skip') continue;
                        if (choice === 'map' && card) { put(card); continue; }
                        const { text } = await fileToText(file);
                        put({ id: newItemId(), type: 'txt', name: choice === 'txt' ? file.name.replace(/\.json$/i, '.txt') : file.name, content: text });
                    } else {
                        const { text: content, fixes } = await fileToText(file);
                        if (fixes) showToast(`« ${file.name} » : ${fixes} ligature(s) (ti / tt) corrigée(s).`);
                        const name = /\.(pdf|docx)$/i.test(file.name) ? file.name.replace(/\.[^.]+$/, '') + '.txt' : file.name;
                        put({ id: newItemId(), type: 'txt', name, content });
                    }
                } catch (err) { console.error(err); showToast(`« ${file.name} » refusé : ${err.message}.`); }
            }
            if (added) refreshTree();
        }

            let lpTimer = null;

            }, { passive: true });

            // glisser-déposer : réordonner / déplacer / importer des fichiers du système
            c.addEventListener('dragstart', (e) => {

            c.addEventListener('dragover', (e) => {

                const id = treeDragId; treeDragId = null;
                if (id) treeMoveTo(id, t.id ? { id: t.id, pos: t.pos } : { id: null });
            });
        }

/* --- Fountain : conserve la mise en page du fichier d'origine (stocké en .txt) --- */
const SCENE_RE=/^(INT|EXT|EST|INT\.?\/EXT|EXT\.?\/INT|I\/E)[. ]/i;
function looksFountain(t,n){return /\.fountain$/i.test(n||'')||/^\s*(title|author|credit|draft date)\s*:/im.test(t.slice(0,400))||(t.match(/^(INT|EXT|EST|I\/E)[. ]/gim)||[]).length>=2;}
function parseFountain(t){
  const L=t.replace(/\r/g,'').split('\n'),meta={},K=/^(title|authors?|credit|source|draft date|date|contact|copyright|notes)\s*:\s*(.*)$/i;let i=0,k=null;
  while(i<L.length&&(K.test(L[i])||(k&&/^\s+\S/.test(L[i])))){const m=L[i].match(K);if(m){k=m[1].toLowerCase();meta[k]=m[2];}else meta[k]+=' '+L[i].trim();i++;}
  const out=[];let dlg=false;
  if(meta.title)out.push(blk('title',escapeHtml(meta.title)));
  if(meta.author||meta.authors)out.push(blk('sub','de '+escapeHtml(meta.author||meta.authors)));
  for(;i<L.length;i++){
    const l=L[i].trim();let m;
    if(!l){dlg=false;continue;}
    if(/^(\[\[.*\]\]|={3,})$/.test(l))continue;
    const nm=l.replace(/\s*\(.*\)\s*$/,'');
    if((m=l.match(/^#+\s*(.*)$/))){out.push(blk('act',escapeHtml(m[1])));dlg=false;}
    else if(SCENE_RE.test(l)||/^\.[^.]/.test(l)){out.push(blk('scene',escapeHtml(l.replace(/^\./,''))));dlg=false;}
    else if(dlg&&/^\(.*\)$/.test(l))out.push(blk('paren',escapeHtml(l)));
    else if(dlg)out.push(blk('dial',escapeHtml(l)));
    else if((l[0]==='@'||(nm===nm.toUpperCase()&&/[A-ZÀ-Ý]/.test(nm)&&!/^[>!]/.test(l)))&&L[i+1]&&L[i+1].trim()&&(i===0||!L[i-1].trim())){out.push(blk('char',escapeHtml(l.replace(/^@/,''))));dlg=true;}
    else out.push(blk('action',escapeHtml(l.replace(/^!/,''))));
  }
  return {meta,html:out.join('')};
}

let lastSel=null,hist={u:[],r:[],base:null,t:0};
const selRoot=r=>{const n=r.commonAncestorContainer,el=n.nodeType===1?n:n.parentElement;return el&&el.closest&&el.closest('[contenteditable=true]');};
window.addEventListener('error',e=>{try{showToast('Erreur : '+e.message);}catch(x){}});

// Sélection à utiliser : la vraie, sinon la dernière connue, sinon la fin de la page (aucun clic nécessaire avant d'utiliser un outil)
function getRange(){
  const s=getSelection();
  if(s.rangeCount&&selRoot(s.getRangeAt(0)))return s.getRangeAt(0);
  if(lastSel&&document.contains(lastSel.commonAncestorContainer)&&selRoot(lastSel))return lastSel;
  const last=[...edPage().children].filter(e=>e.dataset.s).pop(),r=document.createRange();
  if(last){r.selectNodeContents(last);r.collapse(false);}else r.selectNodeContents(edPage());
  return r;
}
function restoreSel(){   // renvoie la sélection à utiliser ; ne touche à la vraie sélection que si elle est sortie de l'éditeur
  const s=getSelection();
  if(s.rangeCount&&selRoot(s.getRangeAt(0))){lastSel=s.getRangeAt(0).cloneRange();return s.getRangeAt(0);}
  const r=getRange().cloneRange(),root=selRoot(r);
  if(root)root.focus({preventScroll:true});
  s.removeAllRanges();s.addRange(r);lastSel=r.cloneRange();return r;
}
// Le navigateur peut créer un paragraphe sans notre attribut data-s (retour à la ligne, collage…) : on le répare
function normalizeRoot(root){

  +`<div class="ed-mini script" contenteditable="${ed}">${p.html}</div><div class="flex items-center gap-2 mt-3 text-xs flex-wrap"><button class="vote ${mine===1?'on':''}" onclick="vote('${id}',1)">👍 Oui ${y}</button><button class="vote ${mine===0?'on':''}" onclick="vote('${id}',0)">👎 Non ${n}</button></div>${canEdit()?`<button class="w-full mt-3 py-2 rounded-xl bg-[#5246EE] text-white text-xs font-semibold" onclick="resolveProp('${id}',true)">✓ Valider et ajouter au scénario</button>`:''}`;
  miniEditor(el,p);return el;
}
function renderSide(){
  miniCur=null;if(!openNote)noteFull=false;
  const side=E('ed-side');if(!side||!docReady)return;side.innerHTML='';const items=[];
  if(openNote&&openNote.k==='b'){
    const d=doc.bubbles[openNote.id],sp=edPage().querySelector(`[data-bubble="${openNote.id}"]`);
    if(d&&sp)items.push({top:sp.offsetTop,el:bubbleCard(openNote.id,d)});else openNote=null;
  }
  if(docType==='script')Object.entries(doc.proposals||{}).forEach(([id,p])=>{
    const a=(p.mode==='edit')?sceneHead(p):q(p.after);
    items.push({top:a?a.offsetTop:Math.max(0,edPage().scrollHeight-80),el:propCard(id,p,openNote&&openNote.k==='p'&&openNote.id===id)});
  });
  items.sort((a,b)=>a.top-b.top);
  side.parentElement.classList.toggle('stack',E('ed-scroll').clientWidth<1140);
  items.forEach(it=>{it.el._top=it.top;side.appendChild(it.el);});
  layoutSide();
  E('ed-scroll').style.overflow=(noteFull&&openNote)?'hidden':'';
}
function layoutSide(){   // empile les cartes sans qu'elles se chevauchent (rappelé quand une carte change de taille)
  const side=E('ed-side');if(!side)return;const wide=E('ed-scroll').clientWidth>=1140;let y=0;
  const fr=E('ed-work').getBoundingClientRect();
  [...side.children].forEach(el=>{
    if(el.classList.contains('ed-full')){Object.assign(el.style,{position:'fixed',left:fr.left+'px',top:fr.top+'px',width:fr.width+'px',height:fr.height+'px',right:'auto',marginBottom:''});return;}
    if(wide){const t=Math.max(el._top||0,y);Object.assign(el.style,{position:'absolute',left:0,right:0,top:t+'px',marginBottom:''});y=t+el.offsetHeight+8;}
    else Object.assign(el.style,{position:'',left:'',right:'',top:'',marginBottom:'.5rem'});
  });
}

/* --- Qui a écrit quoi --- */
function toggleAuthors(){
  const p=edPage();p.classList.toggle('show-by');
  const names=new Set([...p.querySelectorAll('[data-by]')].map(b=>b.dataset.by));Object.values(doc.bubbles).forEach(b=>names.add(b.by));
  E('ed-legend').innerHTML=p.classList.contains('show-by')?[...names].map(n=>`<span><i style="background:${colorOf(n)}" class="inline-block w-2 h-2 rounded-full"></i> ${escapeHtml(n)}</span>`).join(''):'';
}

/* --- Activité : prévient les autres membres (notifications du dashboard) --- */
const IDLE_MS=5*60*1000;   // inactivité avant d'annoncer « x a modifié … »
let actDirty=false,actTimer=null;
const hasOthers=()=>getCollabs().length>0||(getOwnerId()&&getOwnerId()!==currentUser.id);
function notifyActivity(kind,anchor){
  if(!projectId||!currentCard||!hasOthers())return;
  try{supabaseClient.rpc('notify_collaborators',{p_table:'projects',p_id:String(projectId),p_kind:kind,p_file_id:String(currentCard.id),p_file_name:currentCard.name||'',p_file_type:docType||'text',p_anchor:anchor||null}).then(()=>{},()=>{});}catch(e){}
}
function markEdited(){if(!canEdit())return;actDirty=true;clearTimeout(actTimer);actTimer=setTimeout(flushEdit,IDLE_MS);}
function flushEdit(){clearTimeout(actTimer);if(!actDirty)return;actDirty=false;notifyActivity('edit');}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushEdit();});
addEventListener('pagehide',flushEdit);
// lien direct depuis une notification : editor.html?...&focus=prop:ID ou bub:ID
function focusFromUrl(){
  const u=new URL(location.href),f=u.searchParams.get('focus');if(!f||!docReady)return;
  const k=f.slice(0,f.indexOf(':')),id=f.slice(f.indexOf(':')+1);let target=null;
  if(k==='prop'&&doc.proposals&&doc.proposals[id]){const p=doc.proposals[id];openNote={k:'p',id};target=(p.mode==='edit'?sceneHead(p):q(p.after))||edPage().lastElementChild;}
  else if(k==='bub'&&doc.bubbles&&doc.bubbles[id]){openNote={k:'b',id};target=edPage().querySelector(`[data-bubble="${id}"]`);}
  else showToast("Cet élément n'existe plus.");
  u.searchParams.delete('focus');history.replaceState(null,'',u);
  if(!target)return;
  renderSide();setTimeout(()=>target.scrollIntoView({block:'center',behavior:'smooth'}),150);
}

/* --- Propositions (scénario) + sondage --- */
const kindStyle=k=>k==='act'?'act':k==='scene'?'scene':'action';
function propose(){
  if(!getCollabs().length){showToast('Les propositions sont réservées aux projets collaboratifs.');return;}
  let b=window.ctxBlock&&edPage().contains(window.ctxBlock)?window.ctxBlock:null;window.ctxBlock=null;
  b=b||curBlock();if(b&&!edPage().contains(b))b=null;
  const id=rid(),sc=sceneOf(b),wasDirty=actDirty;
  doc.proposals[id]={mode:'add',kind:'free',num:'',scene:sc?sc.dataset.id:null,after:b?b.dataset.id:null,excerpt:b?headerText(b).slice(0,50):'',html:blk('action'),by:me(),uid:currentUser.id,at:Date.now(),votes:{}};
  openNote={k:'p',id};renderSide();recordHistory();scheduleSave();
  notifyActivity('proposal','prop:'+id);actDirty=wasDirty;
}
function vote(id,val){const p=doc.proposals[id];if(!p)return;if(p.votes[currentUser.id]===val)delete p.votes[currentUser.id];else p.votes[currentUser.id]=val;renderSide();scheduleSave();}
const propChanged=()=>{recordHistory();scheduleSave();renderSide();};
function loadScene(p){   // recopie toute la scène dans la proposition
  const h=q(p.scene);if(!h)return false;
  p.html=sceneExtent(h).map(n=>{const c=n.cloneNode(true);['data-id','data-by','title'].forEach(a=>c.removeAttribute(a));c.style.removeProperty('--c');return c.outerHTML;}).join('');
  p.dirty=false;return true;
}
function propPickScene(id,val){
  const p=doc.proposals[id];if(!p||!requireEdit())return;
  if(p.mode==='edit'){
    if(!val){showToast('Choisis la scène à modifier.');renderSide();return;}
    if(p.dirty&&!confirm('Remplacer le texte de la proposition par la scène choisie ?')){renderSide();return;}
    p.scene=val;loadScene(p);
  }else{
    p.scene=val||null;const h=q(val);
    if(h){const ext=sceneExtent(h),last=ext[ext.length-1];p.after=last.dataset.id;p.excerpt=headerText(last).slice(0,50);}
  }
  propChanged();
}
function propMode(id,m){
  const p=doc.proposals[id];if(!p||!requireEdit()||(p.mode||'add')===m)return;
  if(p.dirty&&!confirm('Changer de mode remplace le texte de la proposition. Continuer ?'))return;
  if(m==='edit'){
    if(!sceneHead(p)){showToast("Choisis d'abord une scène dans le menu.");return;}
    p.scene=sceneHead(p).dataset.id;p.mode='edit';loadScene(p);
  }else{p.mode='add';p.html=blk(kindStyle(p.kind||'free'));p.dirty=false;}
  propChanged();
}
function propKind(id,k){
  const p=doc.proposals[id];if(!p||!requireEdit())return;const prev=p.kind||'free';p.kind=k;
  if(k!=='free'||prev!=='free'){
    const t=document.createElement('div');t.innerHTML=p.html;let f=t.firstElementChild;
    if(!f){t.innerHTML=blk('action');f=t.firstElementChild;}
    f.dataset.s=kindStyle(k);p.html=t.innerHTML;
  }
  propChanged();
}
function propNum(id,v){const p=doc.proposals[id];if(!p)return;p.num=v;scheduleSave();}
function delProp(id){
  const p=doc.proposals[id];if(!p)return;
  if(!canDelProp(p)){showToast("Seuls l'auteur, un admin ou le propriétaire peuvent supprimer cette proposition.");return;}
  if(!confirm('Supprimer cette proposition ?'))return;
  delete doc.proposals[id];openNote=null;propChanged();
}
// Place des blocs selon le numéro d'un acte / d'une scène (numéro écrit en tête de l'en-tête, sinon ordre d'apparition)
const headNum=(h,i)=>{const m=headerText(h).match(/^(?:(?:sc[èe]ne|acte?|act)\s*)?(\d+)/i);return m?+m[1]:i+1;};
function placeByNumber(nodes,kind,num){
  const heads=[...edPage().children].filter(e=>e.dataset.s===kind);
  const nxt=heads.find((h,i)=>headNum(h,i)>=num);
  if(nxt){nxt.before(...nodes);return;}
  if(kind==='act'||!heads.length){edPage().append(...nodes);return;}
  const ext=sceneExtent(heads[heads.length-1]);ext[ext.length-1].after(...nodes);   // dernière scène : on s'ajoute à sa suite
}
function commitDoc(){
  normalizeRoot(edPage());const seen=new Set();
  edPage().querySelectorAll('[data-s]').forEach(x=>{if(!x.dataset.id||seen.has(x.dataset.id))x.dataset.id=rid();seen.add(x.dataset.id);});
  recordHistory();scheduleSave();pageNo();renderSide();
}
function resolveProp(id,ok){
  const p=doc.proposals[id];if(!p||!requireEdit())return;
  if(miniCur&&miniCur.obj===p&&miniCur.m.isConnected)p.html=miniCur.m.innerHTML;
  const t=document.createElement('div');t.innerHTML=p.html;normalizeRoot(t);
  if(!t.textContent.replace(/\u200b/g,'').trim()){showToast('La proposition est vide.');return;}
  const nodes=[...t.children].map(n=>{if(!n.dataset.s)n.dataset.s='action';n.dataset.id=rid();n.dataset.by=p.by;n.style.setProperty('--c',colorOf(p.by));return n;});
  const mode=p.mode||'add',kind=p.kind||'free';
  if(mode==='edit'){
    const h=sceneHead(p);if(!h){showToast("La scène d'origine n'existe plus : choisis-en une autre.");return;}
    if(!confirm('Remplacer la scène « '+headerText(h).slice(0,40)+' » par cette version ?'))return;
    const ext=sceneExtent(h);ext[0].before(...nodes);ext.forEach(n=>n.remove());
  }else if(kind!=='free'){
    const num=parseInt(p.num);if(!(num>0)){showToast("Indique le numéro "+(kind==='act'?"de l'acte":"de la scène")+" pour le placer.");return;}
    placeByNumber(nodes,kind,num);
  }else{const a=q(p.after);a?a.after(...nodes):edPage().append(...nodes);}
  getSelection().removeAllRanges();miniCur=null;
  delete doc.proposals[id];openNote=null;commitDoc();
  nodes[0].scrollIntoView({block:'center',behavior:'smooth'});
  showToast(mode==='edit'?'Scène modifiée.':'Proposition ajoutée au scénario.');
}

/* --- Export .mobtext / .mobscen (JSON : lisible, versionné, bulles et propositions rattachées par id) --- */
function exportDoc(){
  syncDoc();const ext=docType==='script'?'mobscen':'mobtext';
  const d={format:ext,version:1,type:docType,name:currentCard.name,content:currentCard.content,doc:{...doc,proposals:docType==='script'?doc.proposals:{}}};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));
  a.download=String(currentCard.name).replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]/g,'_')+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  showToast(`Exporté en .${ext} !`);
}

/* --- Collaborateurs (repris de map.html) --- */
const myEmail=()=>(currentUser.email||'').toLowerCase();
const isOwner=()=>{const o=getOwnerId();return !o||o===currentUser.id;};
const ownerEmail=()=>(projectData.owner_email||'').toLowerCase();
function canManageCollab(c){if(myRole!=='admin')return false;if(isOwner())return true;return (c.role||'editor')!=='admin'&&(c.email||'').toLowerCase()!==myEmail();}
function requireAdmin(){if(myRole==='admin')return true;showToast("Seul un admin peut gérer les collaborateurs.");return false;}
window.toggleCollaboratorsDropdown=()=>E('collab-dropdown').classList.toggle('hidden');
document.addEventListener('click',e=>{if(!e.target.closest('#collab-dropdown')&&!e.target.closest('[onclick="toggleCollaboratorsDropdown()"]'))E('collab-dropdown').classList.add('hidden');});
function renderCollaboratorsList(){
  const listEl=E('collaborators-list'),collabs=getCollabs(),admin=myRole==='admin';
  E('collab-count-label').textContent=`Collaborateurs (${collabs.length+1})`;
  E('collab-add-section').classList.toggle('hidden',!admin);
  const ao=document.querySelector('#new-collab-role option[value="admin"]');
  if(ao){ao.hidden=ao.disabled=!isOwner();if(!isOwner()&&ao.parentNode.value==='admin')ao.parentNode.value='editor';}
  listEl.innerHTML=`<div class="flex items-center justify-between gap-2 text-xs p-2 bg-slate-50 dark:bg-slate-800 rounded-lg"><span class="font-medium text-slate-700 dark:text-slate-300 truncate">${escapeHtml(currentUser.email)} (vous)</span><span class="text-[10px] font-semibold text-[#5246EE] shrink-0">${isOwner()?'Propriétaire':ROLE_LABELS[myRole]}</span></div>`;
  collabs.forEach((c,idx)=>{
    const acc=c.status==='accepted',manage=canManageCollab(c);
    const roleCtl=manage?`<select onchange="setCollaboratorRole(${idx},this.value)" class="px-1.5 py-1 text-[10px] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-md focus:outline-none">${Object.entries(ROLE_LABELS).filter(([k])=>isOwner()||k!=='admin').map(([k,l])=>`<option value="${k}" ${c.role===k?'selected':''}>${l}</option>`).join('')}</select>`:`<span class="text-[10px] font-semibold text-slate-500">${ROLE_LABELS[c.role]||c.role}</span>`;
    const row=document.createElement('div');row.className='flex items-center justify-between gap-2 text-xs p-2 bg-slate-50 dark:bg-slate-800 rounded-lg';
    row.innerHTML=`<div class="min-w-0"><div class="truncate text-slate-700 dark:text-slate-300">${escapeHtml(c.email)}</div><div class="text-[10px] ${acc?'text-emerald-500':'text-amber-500'}">${acc?'Accepté':'Invitation envoyée'}</div></div><div class="flex items-center gap-1 shrink-0">${roleCtl}${manage?`<button onclick="removeCollaborator(${idx})" class="text-rose-500 hover:text-rose-700 p-1" title="Retirer"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>`:''}</div>`;
    listEl.appendChild(row);
  });
  lucide.createIcons();
}
async function addCollaborator(){
  if(!requireAdmin())return;const input=E('new-collab-email'),email=input.value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showToast("Adresse e-mail invalide.");return;}
  if(email===myEmail()){showToast("Vous ne pouvez pas vous inviter vous-même.");return;}
  const role=E('new-collab-role').value,collabs=getCollabs();
  if(email===ownerEmail()){showToast("Le propriétaire ne peut pas être invité.");return;}
  if(role==='admin'&&!isOwner()){showToast("Seul le propriétaire peut nommer un admin.");return;}
  const ex=collabs.find(c=>(c.email||'').toLowerCase()===email);
  if(ex&&!canManageCollab(ex)){showToast("Vous ne pouvez pas modifier ce collaborateur.");return;}
  if(ex){Object.assign(ex,{role,status:'pending',invitedBy:currentUser.email,invitedAt:new Date().toISOString()});delete ex.acceptedAt;}
  else collabs.push({email,role,status:'pending',invitedBy:currentUser.email,invitedAt:new Date().toISOString()});
  await saveCurrentMapState(true);renderCollaboratorsList();input.value='';showToast("Invitation envoyée !");
}
window.setCollaboratorRole=async function(idx,role){
  if(!requireAdmin())return;const t=getCollabs()[idx];
  if(!t||!canManageCollab(t)||(role==='admin'&&!isOwner())){showToast("Seul le propriétaire peut modifier le rôle d'un admin ou nommer un admin.");renderCollaboratorsList();return;}
  t.role=role;await saveCurrentMapState(true);renderCollaboratorsList();showToast("Rôle mis à jour.");
};
async function removeCollaborator(idx){
  if(!requireAdmin())return;const c=getCollabs()[idx];
  if(c&&!canManageCollab(c)){showToast("Seul le propriétaire peut retirer un admin.");return;}
  if(!c||!confirm(`Retirer ${c.email} ?`))return;
  getCollabs().splice(idx,1);await saveCurrentMapState(true);renderCollaboratorsList();
}
