    <script>
        // Barre de chargement fine sous le menu du haut : visible seulement pendant l'ouverture d'un document
        window.topProgress = (() => {
            const el = document.getElementById('top-progress'), bar = el && el.firstElementChild;
            let timer = null, w = 0;
            return {
                start() {
                    if (!el) return;
                    clearInterval(timer);
                    bar.style.transition = 'none'; bar.style.width = '0%'; void bar.offsetWidth; bar.style.transition = '';
                    el.classList.add('active'); w = 12; bar.style.width = w + '%';
                    timer = setInterval(() => { w += (92 - w) * 0.1; bar.style.width = w + '%'; }, 250);
                },
                done() {
                    if (!el) return;
                    clearInterval(timer); bar.style.width = '100%';
                    setTimeout(() => el.classList.remove('active'), 250);
                    setTimeout(() => { bar.style.width = '0%'; }, 600);
                }
            };
        })();
        // retour arrière (page restaurée depuis le cache) : on ne garde pas une barre à moitié remplie
        window.addEventListener('pageshow', (e) => { if (e.persisted) window.topProgress.done(); });
        window.topProgress.start();
    </script>

    <div id="toast-notification" class="hidden fixed bottom-6 right-6 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-2xl z-50 flex items-center space-x-3 transition transform translate-y-2 opacity-0 pointer-events-none">

    <script>
        /* ===================== ÉTAT & PERMISSIONS (comme la page map) ===================== */
        let supabaseClient = null;
        let currentUser = null;
        let projectId = null;
        let projectData = null;
        let standalone = false;       // scénario / texte autonome (dashboard) : ?cardId=… , stocké dans la table cards, sans arborescence
        let cardId = null;            // id du fichier ouvert (nom conservé pour partager le code de l'arborescence)
        let currentCard = null;       // fichier ouvert (même objet que dans projectData.tree)
        let treeOpen = localStorage.getItem('treeOpen') !== '0';
        let mobileTreeOpen = false;
        let navOpenSA = window.innerWidth >= 768;   // menu (plan/durée/personnages/versions) ouvert quand il n'y a pas de projet

        const ROLE_LABELS = { viewer: 'Observateur', editor: 'Peut modifier', admin: 'Admin' };
        let myRole = 'admin';
        let saveTimer = null;
        let unsaved = false, editVer = 0, saving = false, autoTimer = null, saveIsManual = false;   // unsaved : modifications pas encore enregistrées ; editVer : compteur de modifications

        function updateSaveBtn() {
            const b = document.getElementById('save-btn'); if (!b) return;
            const active = unsaved && !saving;
            b.disabled = !active;
            ['bg-[#5246EE]', 'hover:bg-[#4538d8]', 'text-white', 'shadow-md', 'shadow-[#5246EE]/25'].forEach(c => b.classList.toggle(c, active));
            ['bg-slate-100', 'dark:bg-slate-800', 'text-slate-400', 'dark:text-slate-500', 'cursor-not-allowed'].forEach(c => b.classList.toggle(c, !active));
            const icon = document.getElementById('save-icon');
            icon.className = 'fa-solid ' + (unsaved || saving ? 'fa-floppy-disk' : 'fa-check');
            document.getElementById('save-label').textContent = saving ? 'Enregistrement…' : (unsaved ? 'Enregistrer' : 'Enregistré');
            b.title = unsaved ? 'Enregistrer maintenant (Ctrl/Cmd + S) — sinon enregistrement automatique dans quelques secondes' : 'Tout est enregistré';
        }
        function setUnsaved(v) { unsaved = v; updateSaveBtn(); }

        function holder() { return standalone ? currentCard : projectData; }
        function getCollabs() { const h = holder(); if (!Array.isArray(h.collaborators)) h.collaborators = []; return h.collaborators; }
        function normalizeCollaborators() {
            holder().collaborators = (holder().collaborators || [])
                .map(c => typeof c === 'string' ? { email: c, role: 'editor', status: 'pending' } : c)
                .filter(c => c && c.email)
                .map(c => c.role ? c : { ...c, role: 'editor' });
        }
        function getOwnerId() { const h = holder(); return h.user_id || h.owner_id || null; }
        function computeMyRole() {
            const ownerId = getOwnerId();
            if (ownerId && ownerId === currentUser.id) return 'admin';
            const me = getCollabs().find(c => c.email.toLowerCase() === (currentUser.email || '').toLowerCase());
            if (me) return me.status === 'accepted' ? me.role : 'viewer';
            return ownerId ? 'viewer' : 'admin';
        }
        function canEdit() { return myRole === 'admin' || myRole === 'editor'; }
        function requireEdit() { if (canEdit()) return true; showToast("Lecture seule : vous n'avez pas les droits de modification."); return false; }

        function showToast(msg) {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('hidden', 'translate-y-2', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        /* ===================== SAUVEGARDE DU FICHIER ===================== */
        // Utilisé aussi par le code de l'arborescence : recopie le texte de l'éditeur dans le fichier ouvert
        function updateCardInTree(list, file) {
            if (file && file === currentCard) syncDoc();
            return true;
        }

        async function saveCurrentMapState(force = false) {
            if (!force && !canEdit()) return false;
            clearTimeout(saveTimer); saveTimer = null; clearTimeout(autoTimer); autoTimer = null;
            const ver = editVer, wasUnsaved = unsaved;
            if (docReady && wasUnsaved && canEdit()) takeVersion(saveIsManual);   // historique des versions
            saving = true; updateSaveBtn();
            let error;
            try {
                if (standalone) {
                    syncDoc();
                    ({ error } = await supabaseClient.from('cards').update({ name: currentCard.name, info: standaloneInfo(), collaborators: currentCard.collaborators || [] }).eq('id', cardId));
                } else {
                    updateCardInTree(projectData.tree, currentCard);
                    lastTreeSave = Date.now();
                    ({ error } = await supabaseClient.from('projects').update({ tree: projectData.tree, collaborators: projectData.collaborators || [] }).eq('id', projectId));
                    if (error) ({ error } = await supabaseClient.from('projects').update({ tree: projectData.tree }).eq('id', projectId));
                    lastTreeSave = Date.now();
                }
            } catch (e) { error = e; }
            saving = false;
            if (error) { console.error(error); updateSaveBtn(); showToast("Erreur d'enregistrement."); return false; }
            if (editVer === ver) unsaved = false;   // si on a retapé pendant l'enregistrement, ça reste « non enregistré »
            updateSaveBtn();
            if (unsaved && canEdit()) armAuto();   // de nouvelles frappes ont eu lieu pendant l'envoi
            if (wasUnsaved) actDirty = true;
            flushEdit();   // fichier enregistré après des modifications : on prévient les autres membres
            return true;
        }

        // contenu de la colonne cards.info pour un scénario / texte autonome (type = 'script' | 'text' : c'est ce que lit le dashboard)
        function standaloneInfo() {
            const t = docType || 'text';
            return { id: currentCard.infoId || currentCard.id, name: currentCard.name, type: t, docType: t, content: currentCard.content || '', doc: currentCard.doc || doc || null };
        }
        function standaloneFromRow(row) {
            let info = row.info;
            if (typeof info === 'string') { try { info = JSON.parse(info); } catch (e) { info = null; } }
            info = info || {};
            const c = { ...row };
            delete c.info;
            c.id = row.id;
            if (info.id) c.infoId = info.id;
            c.name = info.name || row.name || '';
            c.docType = info.docType || (info.type === 'script' || info.type === 'text' ? info.type : null);
            c.doc = info.doc || null;
            c.content = info.content || '';
            return c;
        }

        window.saveFile = async function() {
            if (!requireEdit() || saving) return;
            if (!unsaved) { showToast('Aucune modification à enregistrer.'); return; }
            saveIsManual = true; const ok = await saveCurrentMapState(); saveIsManual = false;
            if (ok) showToast('Fichier enregistré !');
        }

        /* ===================== FIL D'ARIANE & ARBORESCENCE (même logique que la page map) ===================== */
        function getTreePath(list, targetId, currentPath = []) {
            for (let item of list) {
                if (item.id === targetId) return [...currentPath, item.name];
                if (item.children) {
                    const found = getTreePath(item.children, targetId, [...currentPath, item.name]);
                    if (found) return found;
                }
            }
            return null;
        }

        function formatTruncatedPath(pathArray) {
            if (!pathArray || pathArray.length === 0) return '';
            if (pathArray.length <= 3) return pathArray.join(' > ');
            return `${pathArray[0]} > ... > ${pathArray[pathArray.length - 2]} > ${pathArray[pathArray.length - 1]}`;
        }

        function renderBreadcrumb() {
            const bc = document.getElementById('breadcrumb-container');
            if (standalone) {
                bc.title = sideOpen() ? 'Replier le menu' : 'Plan, personnages, versions'; bc.style.cursor = 'pointer';
                bc.innerHTML = `<span class="text-slate-900 dark:text-slate-100 font-bold"><i data-lucide="${(docType || currentCard.docType) === 'script' ? 'film' : 'file-text'}" class="w-3.5 h-3.5 inline mr-1.5 text-[#5246EE]"></i> ${escapeHtml(currentCard.name)}</span><i data-lucide="${sideOpen() ? 'panel-left-close' : 'panel-left-open'}" class="w-3.5 h-3.5 text-slate-400 shrink-0 ml-1"></i>`;
                lucide.createIcons();
                return;
            }
            const open = window.innerWidth >= 768 ? treeOpen : mobileTreeOpen;
            const path = getTreePath(projectData.tree, cardId) || [currentCard.name];
            const label = window.innerWidth >= 768 ? formatTruncatedPath([projectData.name, ...path]) : path[path.length - 1];
            bc.title = open ? "Replier l'arborescence" : "Ouvrir l'arborescence";
            bc.innerHTML = `
                <span class="text-slate-900 dark:text-slate-100 font-bold"><i data-lucide="folder-tree" class="w-3.5 h-3.5 inline mr-1.5 text-[#5246EE]"></i> ${escapeHtml(label)}</span>
                <i data-lucide="${open ? 'panel-left-close' : 'panel-left-open'}" class="w-3.5 h-3.5 text-slate-400 shrink-0 ml-1"></i>`;
            lucide.createIcons();
        }

        function applyTreeSidebarState() {
            const sidebar = document.getElementById('tree-sidebar');
            sidebar.style.cssText = '';
            const open = sideOpen();
            if (window.innerWidth >= 768) sidebar.style.display = open ? 'flex' : 'none';
            else if (open) sidebar.style.cssText = `display:flex;position:fixed;left:0;right:0;bottom:0;top:${document.getElementById('top-header').offsetHeight}px;z-index:35`;
        }

        function setupTreeSidebarVisibility() {
            navTab = standalone ? 'plan' : 'tree';
            applyTreeSidebarState();
            renderTreeSidebarContent();
            renderNav();
        }

        window.toggleTreeSidebar = function() {
            if (standalone) navOpenSA = !navOpenSA;
            else if (window.innerWidth < 768) mobileTreeOpen = !mobileTreeOpen;
            else { treeOpen = !treeOpen; localStorage.setItem('treeOpen', treeOpen ? '1' : '0'); }
            applyTreeSidebarState();
            renderBreadcrumb();
            renderNav();
        }

        function sideOpen() {
            if (standalone) return navOpenSA && docReady;
            return window.innerWidth >= 768 ? treeOpen : mobileTreeOpen;
        }
        function navVisible() { return sideOpen() && navTab !== 'tree'; }

        window.closeTreeSidebar = function() {
            if (sideOpen()) toggleTreeSidebar();
        }

        window.toggleDarkMode = function() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        window.goBack = async function() {
            if (!await confirmLeave()) return;
            window.location.href = standalone ? `dashboard.html?tab=${docType === 'script' ? 'scripts' : 'texts'}` : `dashboard.html?openProjectId=${encodeURIComponent(projectId)}`;
        }

        /* ===================== DÉMARRAGE ===================== */
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();

            const SUPABASE_URL = 'https://nfvnayuqrmlldtixzdpx.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_EwONSAsqSfu8_SocZ7wZBA_rVODWqSF';
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const urlParams = new URLSearchParams(window.location.search);
            projectId = urlParams.get('projectId');
            cardId = urlParams.get('fileId');
            standalone = !projectId && !!urlParams.get('cardId');
            if (standalone) cardId = urlParams.get('cardId');

            if (!standalone && (!projectId || !cardId)) {
                await dlgAlert("Paramètres manquants.");
                window.location.href = 'dashboard.html';
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session || !session.user) { window.location.href = 'index.html'; return; }
            currentUser = session.user;

            if (standalone) {
                const { data, error } = await supabaseClient.from('cards').select('*').eq('id', cardId).single();
                if (error || !data) {
                    await dlgAlert("Impossible de charger le fichier.");
                    window.location.href = 'dashboard.html';
                    return;
                }
                currentCard = standaloneFromRow(data);
            } else {
                const { data, error } = await supabaseClient.from('projects').select('*').eq('id', projectId).single();
                if (error || !data) {
                    await dlgAlert("Impossible de charger le projet.");
                    window.location.href = 'dashboard.html';
                    return;
                }
                projectData = data;
                if (!Array.isArray(projectData.tree)) projectData.tree = [];

                currentCard = findTreeItem(projectData.tree, cardId);
                if (!currentCard) {
                    await dlgAlert("Fichier introuvable.");
                    window.location.href = 'dashboard.html?openProjectId=' + encodeURIComponent(projectId);
                    return;
                }
            }

            normalizeCollaborators();
            myRole = computeMyRole();

            document.getElementById('save-btn').classList.toggle('hidden', !canEdit());
            updateSaveBtn();
            const badge = document.getElementById('role-badge');
            badge.textContent = ROLE_LABELS[myRole] || '';
            badge.classList.toggle('text-[#5246EE]', myRole === 'admin');

            // ne pas perdre le texte si on ferme l'onglet juste après avoir tapé
            // fermeture / rechargement de l'onglet : le navigateur n'autorise que sa propre boîte native (pas de popup personnalisée possible)
            window.addEventListener('beforeunload', (e) => { if (unsaved && canEdit()) { e.preventDefault(); e.returnValue = ''; return ''; } });
            // Ctrl/Cmd + S : enregistrer (comme GitHub), sans ouvrir « Enregistrer sous » du navigateur
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); if (canEdit()) saveFile(); }
            }, true);

            setupTreeSidebarVisibility();
            renderBreadcrumb();
            initEditor();
            focusFromUrl();
            topProgress.done();

            window.addEventListener('resize', () => {
                applyTreeSidebarState();
                renderBreadcrumb();
            });
        });

    // --- Boîte de dialogue générique (saisie / confirmation / choix) ---
    function dlg({ title, message = '', input = null, buttons, row = false }) {
        return new Promise(resolve => {
            const ov = document.createElement('div');
            ov.className = 'fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50';
            ov.innerHTML = '<div class="w-full max-w-sm bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-800 p-5 space-y-3 text-xs"><h3 class="font-bold text-sm"></h3><p class="text-gray-500 dark:text-gray-400 whitespace-pre-line hidden"></p><input class="hidden w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:border-[#5246EE]"><div class="' + (row ? 'flex gap-2' : 'flex flex-col gap-2') + ' pt-1"></div></div>';
            const [h, p, inp, bar] = ov.querySelector('div').children;
            h.textContent = title;
            if (message) { p.textContent = message; p.classList.remove('hidden'); }
            if (input) { inp.classList.remove('hidden'); inp.type = input.type || 'text'; inp.placeholder = input.placeholder || ''; inp.value = input.value || ''; }
            const done = (value) => { ov.remove(); document.removeEventListener('keydown', onKey, true); resolve(value === undefined ? null : { value, text: inp.value }); };
            const primary = buttons.find(b => b.primary);
            const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(undefined); } else if (e.key === 'Enter' && input && primary) { e.preventDefault(); done(primary.value); } };
            buttons.forEach(b => {
                const btn = document.createElement('button');
                btn.type = 'button'; btn.textContent = b.label; btn.disabled = !!b.disabled; if (b.title) btn.title = b.title;
                btn.className = 'py-2.5 px-3 rounded-xl font-semibold transition-all ' + (row ? 'flex-1 ' : '') + (b.danger ? 'bg-red-500 hover:bg-red-600 text-white' : b.primary ? 'bg-[#5246EE] hover:bg-[#4538d8] text-white' : 'bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700') + (b.disabled ? ' opacity-40 cursor-not-allowed' : '');
                btn.addEventListener('click', () => done(b.value));
                bar.appendChild(btn);
            });
            ov.addEventListener('mousedown', (e) => { if (e.target === ov) done(undefined); });
            document.addEventListener('keydown', onKey, true);
            document.body.appendChild(ov);
            setTimeout(() => (input ? inp : bar.querySelector('button:not([disabled])'))?.focus(), 30);
            if (input) inp.select();
        });
    }
    const treeAsk = async (title, placeholder, value = '', type = 'text') => {
        const r = await dlg({ title, input: { placeholder, value, type }, row: true, buttons: [{ label: 'Annuler', value: null }, { label: 'OK', value: true, primary: true }] });
        return r && r.value ? r.text.trim() : null;
    };
    const treeConfirm = async (message) => !!(await dlg({ title: 'Confirmation', message, row: true, buttons: [{ label: 'Annuler', value: false }, { label: 'Confirmer', value: true, primary: true }] }))?.value;
    const dlgAlert = (message, title = 'Information') => dlg({ title, message, row: true, buttons: [{ label: 'OK', value: true, primary: true }] });
    // Quitter l'éditeur : propose d'enregistrer s'il reste des modifications. Renvoie true si on peut quitter.
    async function confirmLeave() {
        if (!unsaved || !canEdit()) return true;
        const r = await dlg({
            title: 'Modifications non enregistrées',
            message: "Voulez-vous enregistrer avant de quitter ?\nSinon, vos modifications ne seront pas conservées.",
            buttons: [
                { label: 'Enregistrer et quitter', value: 'save', primary: true },
                { label: 'Quitter sans enregistrer', value: 'discard', danger: true },
                { label: 'Annuler', value: 'cancel' }
            ]
        });
        if (!r || r.value === 'cancel') return false;
        if (r.value === 'save') { saveIsManual = true; try { return await saveCurrentMapState(); } finally { saveIsManual = false; } }   // en cas d'erreur on reste sur la page
        unsaved = false;   // « quitter sans enregistrer » : pas de seconde alerte native
        return true;

    // --- Détection de fichiers binaires / images (signatures + octets de contrôle) ---
    function detectBinaryKind(bytes) {
        const sig = (...b) => b.every((v, i) => bytes[i] === v);
        if (sig(0x89, 0x50, 0x4E, 0x47)) return 'une image PNG';
        if (sig(0xFF, 0xD8, 0xFF)) return 'une image JPEG';
        if (sig(0x47, 0x49, 0x46, 0x38)) return 'une image GIF';
        if (sig(0x52, 0x49, 0x46, 0x46)) return 'un fichier RIFF (image WebP / audio / vidéo)';
        if (sig(0x25, 0x50, 0x44, 0x46)) return 'un PDF (renommé)';
        if (sig(0x50, 0x4B, 0x03, 0x04)) return 'une archive ZIP (ex. fichier Pages ou Word)';
        if (sig(0xD0, 0xCF, 0x11, 0xE0)) return 'un ancien document Office (.doc)';
        const head = bytes.subarray(0, 8192);
        if (head[0] === 0xFF && head[1] === 0xFE || head[0] === 0xFE && head[1] === 0xFF) return null; // UTF-16 avec BOM
        let ctrl = 0;
        for (const v of head) { if (v === 0) return 'des données binaires'; if (v < 9 || (v > 13 && v < 32)) ctrl++; }
        return head.length && ctrl / head.length > 0.02 ? 'des données binaires' : null;
    }

    // --- Décodage avec détection d'encodage (UTF-16 BOM, UTF-8, sinon Windows-1252) ---
    function decodeTextBytes(bytes) {
        if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes.subarray(2));
        if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes.subarray(2));
        try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/^\uFEFF/, ''); }
        catch (e) { return new TextDecoder('windows-1252').decode(bytes); }
    }

    async function pdfToText(buf) {
        if (!window.pdfjsLib) throw new Error("lecteur PDF indisponible (connexion ?)");
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
        const pages = [];
        for (let n = 1; n <= pdf.numPages; n++) {
            const content = await (await pdf.getPage(n)).getTextContent();
            let out = '', lastY = null;
            for (const it of content.items) {
                if (it.str === '') { if (it.hasEOL && out && !out.endsWith('\n')) out += '\n'; continue; }
                const y = it.transform ? it.transform[5] : null;
                if (lastY !== null && y !== null && Math.abs(y - lastY) > 2 && out && !out.endsWith('\n')) out += '\n';
                out += it.str;
                if (it.hasEOL && !out.endsWith('\n')) out += '\n';
                if (y !== null) lastY = y;
            }

        }
        return fixPdfLigatures(pages.filter(Boolean).join('\n\n'));
    }

    // Beaucoup de PDF (Keynote, Pages, certaines polices) encodent les ligatures « ti » / « tt »
    // avec un mauvais caractère : « aberra%ons », « len5lle », « vigne.e », « vigne=age ».
    // On les répare quand le caractère est coincé entre des lettres (donc jamais dans « 50% » ou « x=2 »).
    const KEEP_DOT = /^(com|fr|org|net|io|html?|js|css|txt|pdf|docx?|json|md|png|jpe?g|gif|svg|mobius|mobpro|fountain|pages?|xml|csv|zip|be|de|uk|eu|us|ca|ch)$/;
    function fixPdfLigatures(text) {
        let n = 0;
        const bump = (r) => (...a) => { n++; return r(...a); };
        text = text.replace(/⦁/g, '•');
        text = text.replace(/(?<=\p{L})%(?=\p{L})/gu, bump(() => 'ti'));
        text = text.replace(/(?<=\p{Ll})5(?=\p{Ll})/gu, bump(() => 'ti'));
        text = text.replace(/(?<=\p{Ll}{2})=(?=\p{Ll}{2})/gu, bump(() => 'tt'));
        text = text.replace(/(\p{Ll}{2,})\.(\p{Ll}+)/gu, (m, a, b) => KEEP_DOT.test(b) ? m : (n++, a + 'tt' + b));
        return { text, fixes: n };
    }

    async function docxToText(buf) {
        const zip = await JSZip.loadAsync(buf);
        const entry = zip.file('word/document.xml');
        if (!entry) throw new Error("ce n'est pas un document Word valide");
        const xml = new DOMParser().parseFromString(await entry.async('string'), 'application/xml');
        const walk = (node) => {
            let t = '';
            for (const ch of node.childNodes) {
                const n = ch.localName;
                if (n === 't') t += ch.textContent;
                else if (n === 'tab') t += '\t';
                else if (n === 'br' || n === 'cr') t += '\n';
                else if (ch.nodeType === 1) t += walk(ch);
            }
            return t;
        };
        return [...xml.getElementsByTagNameNS('*', 'p')].map(walk).join('\n').replace(/\n{3,}/g, '\n\n').trim();
    }

    // Transforme n'importe quel fichier accepté en texte brut (images et mise en forme ignorées).
    // Lance une Error (message lisible) si le fichier est refusé.
    async function fileToText(file) {
        if (file.size > MAX_INPUT_BYTES) throw new Error('fichier trop volumineux (max 20 Mo)');
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let text, fixes = 0;
        if (/\.pdf$/i.test(file.name)) {
            if (!(bytes[0] === 0x25 && bytes[1] === 0x50)) throw new Error("ce n'est pas un vrai PDF");
            ({ text, fixes } = await pdfToText(buf));
        } else if (/\.docx$/i.test(file.name)) {
            if (!(bytes[0] === 0x50 && bytes[1] === 0x4B)) throw new Error("ce n'est pas un vrai .docx");
            text = await docxToText(buf);
        } else {
            const kind = detectBinaryKind(bytes);
            if (kind) throw new Error(`le fichier contient ${kind}, pas du texte`);
            text = decodeTextBytes(bytes);
        }
        if (!text.trim()) throw new Error('aucun texte trouvé (document scanné ou composé uniquement d\'images ?)');
        if (text.length > MAX_TEXT_CHARS) throw new Error('texte trop long (max 2 millions de caractères)');
        return { text, fixes };
    }

            const put = (item) => {
                treeInsert(item, t); added++;
                if (t && t.id && (t.pos === 'before' || t.pos === 'after')) t = { id: item.id, pos: 'after' };   // conserve l'ordre des fichiers déposés
            };
            for (const file of accepted) {
                try {
                    if (/\.(sql|csv|xlsx|xls)$/i.test(file.name) || (/\.json$/i.test(file.name) && await MT.isTabularJson(file))) {
                        // Excel / CSV / SQL / SQL Mobius / JSON tabulaire : une carte par table ou feuille (mêmes règles que la page map)
                        const cs = await MT.fileToCards(file);
                        cs.forEach(c => put(c));
                        showToast(`« ${file.name} » : ${cs.length} carte${cs.length > 1 ? 's' : ''} créée${cs.length > 1 ? 's' : ''}.`);
                        continue;
                    }
                    if (/\.(mobtext|mobscen)$/i.test(file.name)) {
                        const d = JSON.parse(await file.text());
                        put({ id: newItemId(), type: 'txt', name: d.name || file.name.replace(/\.[^.]+$/, ''), content: d.content || '', docType: d.type, doc: d.doc }); continue;
                    }
                    if (/\.mobius$/i.test(file.name)) {
                        const card = parseMobiusCard(await file.text(), file.name);
                        if (!card) { showToast(`« ${file.name} » n'est pas une carte Mobius valide.`); continue; }
                        put(card);
                    } else if (/\.json$/i.test(file.name)) {
                        const raw = await file.text();
                        const card = parseMobiusCard(raw, file.name);
                        const choice = await askJsonFormat(file.name, !!card);
                        if (choice === 'skip') continue;
                        if (choice === 'map' && card) { put(card); continue; }
                        const { text } = await fileToText(file);
                        put({ id: newItemId(), type: 'txt', name: choice === 'txt' ? file.name.replace(/\.json$/i, '.txt') : file.name, content: text });
                    } else {
                        const { text: content, fixes } = await fileToText(file);
                        if (fixes) showToast(`« ${file.name} » : ${fixes} ligature(s) (ti / tt) corrigée(s).`);
                        const name = /\.(pdf|docx)$/i.test(file.name) ? file.name.replace(/\.[^.]+$/, '') + '.txt' : file.name;
                        put({ id: newItemId(), type: 'txt', name, content });
                    }
                } catch (err) { console.error(err); showToast(`« ${file.name} » refusé : ${err.message}.`); }
            }
            if (added) refreshTree();
        }

            // glisser-déposer : réordonner / déplacer / importer des fichiers du système
            c.addEventListener('dragstart', (e) => {
                const row = e.target.closest('.tree-row'); if (!row || !canEdit()) return;
                treeDragId = row.dataset.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', treeDragId);

            c.addEventListener('dragover', (e) => {
                if (!canEdit()) return;
                e.preventDefault(); treeClearDrop();
                const t = treeDropTarget(e);
                if (t.row && t.id !== treeDragId) t.row.classList.add('tree-drop-' + t.pos);

            c.addEventListener('dragleave', (e) => { if (!c.contains(e.relatedTarget)) treeClearDrop(); });
            c.addEventListener('drop', (e) => {

                const id = treeDragId; treeDragId = null;
                if (id) treeMoveTo(id, t.id ? { id: t.id, pos: t.pos } : { id: null });
            });
        }

/* --- Fountain : conserve la mise en page du fichier d'origine (stocké en .txt) --- */
const SCENE_RE=/^(INT|EXT|EST|INT\.?\/EXT|EXT\.?\/INT|I\/E)[. ]/i;
function looksFountain(t,n){return /\.fountain$/i.test(n||'')||/^\s*(title|author|credit|draft date)\s*:/im.test(t.slice(0,400))||(t.match(/^(INT|EXT|EST|I\/E)[. ]/gim)||[]).length>=2;}
function parseFountain(t){
  const L=t.replace(/\r/g,'').split('\n'),meta={},K=/^(title|authors?|credit|source|draft date|date|contact|copyright|notes)\s*:\s*(.*)$/i;let i=0,k=null;
  while(i<L.length&&(K.test(L[i])||(k&&/^\s+\S/.test(L[i])))){const m=L[i].match(K);if(m){k=m[1].toLowerCase();meta[k]=m[2];}else meta[k]+=' '+L[i].trim();i++;}
  const out=[];let dlg=false;
  if(meta.title)out.push(blk('title',escapeHtml(meta.title)));
  if(meta.author||meta.authors)out.push(blk('sub','de '+escapeHtml(meta.author||meta.authors)));
  for(;i<L.length;i++){
    const l=L[i].trim();let m;
    if(!l){dlg=false;continue;}
    if(/^(\[\[.*\]\]|={3,})$/.test(l))continue;
    const nm=l.replace(/\s*\(.*\)\s*$/,'');
    if((m=l.match(/^#+\s*(.*)$/))){out.push(blk('act',escapeHtml(m[1])));dlg=false;}
    else if(SCENE_RE.test(l)||/^\.[^.]/.test(l)){out.push(blk('scene',escapeHtml(l.replace(/^\./,''))));dlg=false;}
    else if(dlg&&/^\(.*\)$/.test(l))out.push(blk('paren',escapeHtml(l)));
    else if(dlg)out.push(blk('dial',escapeHtml(l)));
    else if((l[0]==='@'||(nm===nm.toUpperCase()&&/[A-ZÀ-Ý]/.test(nm)&&!/^[>!]/.test(l)))&&L[i+1]&&L[i+1].trim()&&(i===0||!L[i-1].trim())){out.push(blk('char',escapeHtml(l.replace(/^@/,''))));dlg=true;}
    else out.push(blk('action',escapeHtml(l.replace(/^!/,''))));
  }
  return {meta,html:out.join('')};
}

/* --- Outils de mise en forme (style « Pages ») --- */
let lastSel=null,hist={u:[],r:[],base:null,t:0};
const selRoot=r=>{const n=r.commonAncestorContainer,el=n.nodeType===1?n:n.parentElement;return el&&el.closest&&el.closest('[contenteditable=true]');};
window.addEventListener('error',e=>{try{showToast('Erreur : '+e.message);}catch(x){}});
document.addEventListener('selectionchange',()=>{const s=getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0);if(selRoot(r)){lastSel=r.cloneRange();syncTools();}});
// Sélection à utiliser : la vraie, sinon la dernière connue, sinon la fin de la page (aucun clic nécessaire avant d'utiliser un outil)
function getRange(){
  const s=getSelection();
  if(s.rangeCount&&selRoot(s.getRangeAt(0)))return s.getRangeAt(0);
  if(lastSel&&document.contains(lastSel.commonAncestorContainer)&&selRoot(lastSel))return lastSel;
  const last=[...edPage().children].filter(e=>e.dataset.s).pop(),r=document.createRange();
  if(last){r.selectNodeContents(last);r.collapse(false);}else r.selectNodeContents(edPage());
  return r;
}
function restoreSel(){   // renvoie la sélection à utiliser ; ne touche à la vraie sélection que si elle est sortie de l'éditeur
  const s=getSelection();
  if(s.rangeCount&&selRoot(s.getRangeAt(0))){lastSel=s.getRangeAt(0).cloneRange();return s.getRangeAt(0);}
  const r=getRange().cloneRange(),root=selRoot(r);
  if(root)root.focus({preventScroll:true});
  s.removeAllRanges();s.addRange(r);lastSel=r.cloneRange();return r;
}
// Le navigateur peut créer un paragraphe sans notre attribut data-s (retour à la ligne, collage…) : on le répare
function normalizeRoot(root){
  if(!root)return;const def=docType==='script'?'action':'body';let prev=def;
  [...root.childNodes].forEach(n=>{
    if(n.nodeType===1&&n.dataset&&n.dataset.s){prev=n.dataset.s;return;}
    if(n.nodeType===1&&(n.tagName==='DIV'||n.tagName==='P')){n.dataset.s=prev;if(!n.dataset.id)n.dataset.id=rid();return;}
    if(n.nodeType===3&&n.data.length){
      const s=getSelection(),keep=s.rangeCount&&s.anchorNode===n?s.anchorOffset:null,d=document.createElement('div');
      d.dataset.s=prev;d.dataset.id=rid();n.replaceWith(d);d.appendChild(n);
      if(keep!==null){const r=document.createRange();r.setStart(n,keep);r.collapse(true);s.removeAllRanges();s.addRange(r);}
    }

function inlineRuns(node){
  const runs=[];
  (function walk(n,f){
    n.childNodes.forEach(c=>{
      if(c.nodeType===3){const t=c.data.replace(/\u200b/g,'').replace(/[\u00a0\u202f\u2009]/g,' ');if(t)runs.push({t,b:f.b,i:f.i,u:f.u});}
      else if(c.nodeType===1){
        if(c.tagName==='BR'){runs.push({t:'\n',b:false,i:false,u:false});return;}
        const st=c.style||{},tg=c.tagName;
        walk(c,{b:f.b||tg==='B'||tg==='STRONG'||+st.fontWeight>=600||st.fontWeight==='bold',i:f.i||tg==='I'||tg==='EM'||st.fontStyle==='italic',u:f.u||tg==='U'||/underline/.test(st.textDecoration||'')});
      }
    });
  })(node,{b:false,i:false,u:false});
  while(runs.length&&runs[runs.length-1].t==='\n')runs.pop();
  return runs;
}
function mergeRuns(runs){const o=[];runs.forEach(r=>{const l=o[o.length-1];if(l&&r.t!=='\n'&&l.t!=='\n'&&l.b===r.b&&l.i===r.i&&l.u===r.u)l.t+=r.t;else o.push({...r});});return o;}

const parseBlocks=html=>{const t=document.createElement('div');t.innerHTML=html;return [...t.children].map(n=>({s:(n.dataset&&n.dataset.s)||(docType==='script'?'action':'body'),id:(n.dataset&&n.dataset.id)||'',text:(n.textContent||'').replace(/\u200b/g,'').replace(/\s+/g,' ').trim(),html:n.outerHTML}));};

  const out=[h];let n=h.nextElementSibling;while(n&&!(n.dataset&&HEADS.includes(n.dataset.s))){out.push(n);n=n.nextElementSibling;}return out;
}
function sectionsFrom(blocks){
  const secs=[],isHead=b=>docType==='script'?(b.s==='scene'||b.s==='act'):HEADS.includes(b.s);let cur=null;
  blocks.forEach(b=>{

const secSig=s=>s.blocks.map(b=>b.s+'|'+b.text).join('\n');
function matchSections(A,B){
  const aBy=new Map(A.map(s=>[s.key,s])),used=new Set(),out=[];
  B.forEach(sb=>{
    let sa=aBy.get(sb.key);
    if(!sa)sa=A.find(x=>!used.has(x)&&x.kind===sb.kind&&x.title===sb.title&&!B.some(y=>y.key===x.key));
    if(sa)used.add(sa);
    out.push({a:sa||null,b:sb,st:!sa?'added':secSig(sa)===secSig(sb)?'same':'changed'});
  });

    if(used.has(sa))return;let pos=-1;

function lcsOps(a,b,eq){
  const n=a.length,m=b.length;
  if(n*m>4e6)return [...a.map((_,i)=>({t:'-',i})),...b.map((_,j)=>({t:'+',j}))];
  const w=m+1,dp=new Uint16Array((n+1)*w);

}

}
function diffBlocksHtml(a,b){
  const ops=lcsOps(a,b,(x,y)=>x.s===y.s&&x.text===y.text),rows=[];let dels=[],ins=[];
  const flush=()=>{
    const k=Math.min(dels.length,ins.length);
    for(let n=0;n<k;n++)rows.push({t:'m',a:a[dels[n]],b:b[ins[n]]});
    for(let n=k;n<dels.length;n++)rows.push({t:'d',a:a[dels[n]]});
    for(let n=k;n<ins.length;n++)rows.push({t:'i',b:b[ins[n]]});
    dels=[];ins=[];
  };
  ops.forEach(o=>{if(o.t==='-')dels.push(o.i);else if(o.t==='+')ins.push(o.j);else{flush();rows.push({t:'s',a:a[o.i]});}});
  flush();
  const tag=s=>`<span class="df-tag">${escapeHtml(styleLabel(s))}</span>`;
  const html=[];let run=[];
  const flushSame=()=>{
    if(run.length>6){html.push(...run.slice(0,2),`<div class="text-center text-[10px] text-slate-400 py-1">… ${run.length-4} blocs identiques …</div>`,...run.slice(-2));}else html.push(...run);run=[];
  };
  rows.forEach(r=>{
    if(r.t==='s'){run.push(`<div class="df-line text-slate-500">${tag(r.a.s)}${escapeHtml(r.a.text)||'&nbsp;'}</div>`);return;}
    flushSame();

    else if(r.t==='i')html.push(`<div class="df-line i">${tag(r.b.s)}<span class="df-ins">${escapeHtml(r.b.text)||'(vide)'}</span></div>`);
    else html.push(`<div class="df-line m">${r.a.s!==r.b.s?`<span class="df-tag">${escapeHtml(styleLabel(r.a.s))} → ${escapeHtml(styleLabel(r.b.s))}</span>`:tag(r.b.s)}${wordDiff(r.a.text,r.b.text)}</div>`);
  });

}

  return mergeRuns(inlineRuns(node)).map(r=>{
    if(r.t==='\n')return '\n';
    const m=r.t.match(/^(\s*)([\s\S]*?)(\s*)$/);let core=m[2];if(!core)return r.t;
    if(r.u)core='_'+core+'_';if(r.i)core='*'+core+'*';if(r.b)core='**'+core+'**';
    return m[1]+core+m[3];
  }).join('').trim();
}
function toFountain(){
  const out=[];let title='',author='',tU=false,aU=false,inDlg=false;
  blocksOf().forEach(b=>{if(b.dataset.s==='title'&&!title)title=headerText(b);else if(b.dataset.s==='sub'&&!author)author=headerText(b).replace(/^(de|par|by|écrit par)\s+/i,'');});
  const hdr=[];if(title)hdr.push('Title: '+title);if(author)hdr.push('Author: '+author);
  const emit=(t,glue)=>{if(!glue&&out.length)out.push('');out.push(...t.split('\n'));};
  blocksOf().forEach(b=>{
    const s=b.dataset.s,plain=headerText(b);
    if(s==='title'&&!tU&&plain===title){tU=true;return;}
    if(s==='sub'&&!aU&&plain.replace(/^(de|par|by|écrit par)\s+/i,'')===author){aU=true;return;}
    const text=fountainInline(b);if(!text)return;
    if(s==='act'){emit('# '+plain);inDlg=false;}
    else if(s==='scene'){emit(SCENE_RE.test(plain)?text:'.'+text);inDlg=false;}
    else if(s==='char'){const n=plain.replace(/\s*\^$/,'').toUpperCase();emit(/^[A-ZÀ-Ý]/.test(n)?n:'@'+n);inDlg=true;}
    else if(s==='paren'&&inDlg)emit(/^\(.*\)$/s.test(text)?text:'('+text.replace(/^\(|\)$/g,'')+')',true);
    else if(s==='dial'&&inDlg)emit(text.replace(/\n\s*\n/g,'\n  \n'),true);
    else{
      inDlg=false;const caps=plain===plain.toUpperCase()&&/[A-ZÀ-Ý]/.test(plain);
      emit((caps||/^[!@#~=>.\[]/.test(text)||SCENE_RE.test(plain)?'!':'')+text);
    }
  });
  return (hdr.length?hdr.join('\n')+'\n\n':'')+out.join('\n').replace(/\n{3,}/g,'\n\n')+'\n';
}
async function exportDoc(){
  syncDoc();const ext=docType==='script'?'mobscen':'mobtext';
  const base=String(currentCard.name).replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]/g,'_')||'document';
  const btns=[{label:`Sauvegarde Mobius (.${ext})`,value:'mob',primary:true}];
  if(docType==='script')btns.push({label:'Fountain (.fountain)',value:'fountain'});
  btns.push({label:docType==='script'?'PDF — format scénario':'PDF',value:'pdf'},{label:'Annuler',value:null});
  const r=await dlg({title:'Exporter',message:'Dans quel format ?',buttons:btns});
  if(!r||!r.value)return;
  if(r.value==='mob'){
    const d={format:ext,version:1,type:docType,name:currentCard.name,content:currentCard.content,doc:{...doc,versions:[],proposals:docType==='script'?doc.proposals:{}}};
    await deliver(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),base+'.'+ext,`Exporté en .${ext} !`);
  }else if(r.value==='fountain'){
    await deliver(new Blob([toFountain()],{type:'text/plain;charset=utf-8'}),base+'.fountain','Exporté en Fountain !');
  }else{
    showToast('Génération du PDF…');
    try{const blob=docType==='script'?await buildScriptPdf():await buildTextPdf();await deliver(blob,base+'.pdf','PDF exporté !');}
    catch(e){console.error(e);showToast('Impossible de générer le PDF (connexion ?).');}
  }
}

/* ===================== PANNEAU : PLAN / PERSONNAGES / VERSIONS ===================== */
let navTab='plan',navCharOpen=null,lastChars=[],navSceneId=null,persQ='';
function toggleNav(force){
  const want=force===undefined?!navVisible():force;
  if(want){if(navTab==='tree')navTab='plan';if(!sideOpen())toggleTreeSidebar();else renderNav();}
  else if(sideOpen())toggleTreeSidebar();
}
function setNavTab(t){navTab=t;renderNav();if(t==='tree')renderTreeSidebarContent();}
function renderNav(){
  const tabs=[...(standalone?[]:[['tree','Projet']]),...(docReady?[['plan','Plan'],...(docType==='script'?[['pers','Personnages']]:[]),['ver','Versions']]:[])];
  if(!tabs.length)return;
  if(!tabs.some(t=>t[0]===navTab))navTab=tabs[0][0];
  const isTree=navTab==='tree';
  E('tree-pane').style.display=isTree?'flex':'none';
  E('nav-body').style.display=isTree?'none':'block';
  E('nav-tabs').innerHTML=tabs.map(([k,l])=>`<button class="nv-tab ${k===navTab?'on':''}" onclick="setNavTab('${k}')">${l}</button>`).join('');
  if(isTree||!sideOpen())return;
  const body=E('nav-body'),st=body.scrollTop;
  body.innerHTML=navTab==='plan'?(docType==='script'?planScript():planText()):navTab==='pers'?persHtml():verHtml();
  body.scrollTop=st;
  if(navTab==='plan'&&docType==='script')bindPlanDnD();
}
function planScript(){
  const m=scriptModel();let n=0;const ed=canEdit();
  let h=`<div class="mb-2 text-[11px] text-slate-500">${m.acts.reduce((t,a)=>t+a.scenes.length,0)} scène(s) · ${pgN} page(s) · durée estimée <b>${fmtDur(m.total)}</b></div>`;
  m.acts.forEach(a=>{
    if(a.el)h+=`<div class="nv-row nv-act" data-act="${a.id}" onclick="navGo('${a.id}')"><span class="flex-1 truncate">${escapeHtml(a.title||'Acte')}</span><span class="nv-chip">${fmtDur(a.sec)}</span></div>`;
    a.scenes.forEach(s=>{n++;
      h+=`<div class="nv-row" draggable="${ed}" data-sc="${s.id}" onclick="navGo('${s.id}')"><span class="text-slate-400 w-5 text-right shrink-0">${n}</span><span class="flex-1 truncate" title="${escapeHtml(s.title)}">${escapeHtml(s.title||'(sans titre)')}</span>`
        +(ed?`<button class="nv-mv" title="Monter" onclick="event.stopPropagation();navMove('${s.id}',-1)">▲</button><button class="nv-mv" title="Descendre" onclick="event.stopPropagation();navMove('${s.id}',1)">▼</button>`:'')
        +`<button class="nv-chip ${s.manual?'man':''}" title="${s.manual?'Durée corrigée à la main':'Durée estimée'}${ed?' — cliquer pour corriger':''}" ${ed?`onclick="event.stopPropagation();editDur('${s.id}')"`:'disabled'}>${s.manual?'✎ ':'≈ '}${fmtDur(s.sec)}</button></div>`;
    });
  });
  if(!n)h+='<p class="text-slate-400 py-6 text-center">Aucune scène pour le moment. Utilise le style « En-tête de scène » pour en créer.</p>';
  else if(ed)h+='<div class="nv-row text-slate-400 justify-center text-[10px]" data-end="1">Glisser ici pour mettre à la fin</div>';
  return h;
}
function planText(){
  const hs=blocksOf().filter(b=>HEADS.includes(b.dataset.s)),lv={title:0,h1:0,h2:1,h3:2};
  const info=`<div class="mb-2 text-[11px] text-slate-500">${wordsIn(edPage().innerText||'')} mots</div>`;
  if(!hs.length)return info+'<p class="text-slate-400 py-6 text-center">Aucun titre. Applique un style Titre ou Titre 1-3 pour construire le plan.</p>';
  return info+hs.map(h=>`<div class="nv-row" style="padding-left:${.5+lv[h.dataset.s]*.9}rem" onclick="navGo('${h.dataset.id}')"><span class="flex-1 truncate ${lv[h.dataset.s]===0?'font-semibold':''}">${escapeHtml(headerText(h)||'(sans titre)')}</span></div>`).join('');
}
function navGo(id){
  const el=q(id);if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  try{el.animate([{backgroundColor:'rgba(82,70,238,.35)'},{backgroundColor:'rgba(82,70,238,0)'}],{duration:1400});}catch(e){}
  if(innerWidth<768)toggleNav(false);
}
function moveScene(id,tid,pos,toEnd){
  if(!requireEdit())return;const h=q(id);if(!h||id===tid)return;const src=sceneExtent(h);
  if(toEnd){const bs=blocksOf(),last=bs[bs.length-1];if(src.includes(last))return;last.after(...src);}
  else{
    const t=q(tid);if(!t||src.includes(t))return;
    if(t.dataset.s==='scene'){if(pos==='before')t.before(...src);else{const ext=sceneExtent(t);ext[ext.length-1].after(...src);}}
    else if(t.dataset.s==='act'){const ext=sceneExtent(t);ext[ext.length-1].after(...src);}
    else return;
  }
  commitDoc();renderNav();
}
function navMove(id,dir){
  const hs=blocksOf().filter(b=>b.dataset.s==='scene'),i=hs.findIndex(h=>h.dataset.id===id),t=hs[i+dir];
  if(i<0||!t)return;moveScene(id,t.dataset.id,dir<0?'before':'after');
}
function bindPlanDnD(){
  if(!canEdit())return;const body=E('nav-body');let drag=null;
  const clear=()=>body.querySelectorAll('.dbefore,.dafter,.dinside').forEach(e=>e.classList.remove('dbefore','dafter','dinside'));
  body.querySelectorAll('[data-sc]').forEach(r=>{
    r.addEventListener('dragstart',e=>{drag=r.dataset.sc;r.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',drag);});
    r.addEventListener('dragend',()=>{drag=null;r.classList.remove('dragging');clear();});
  });
  body.querySelectorAll('[data-sc],[data-act],[data-end]').forEach(r=>{
    r.addEventListener('dragover',e=>{
      if(!drag)return;e.preventDefault();clear();
      if(r.dataset.sc){if(r.dataset.sc===drag)return;const b=r.getBoundingClientRect();r.classList.add(e.clientY<b.top+b.height/2?'dbefore':'dafter');}
      else r.classList.add('dinside');
    });
    r.addEventListener('drop',e=>{
      if(!drag)return;e.preventDefault();const id=drag,pos=r.classList.contains('dbefore')?'before':r.classList.contains('dafter')?'after':'inside';
      clear();drag=null;moveScene(id,r.dataset.sc||r.dataset.act||null,pos,!!r.dataset.end);
    });
  });
}
function charModel(){
  const map=new Map();let sc=null,scN=0,cur=null;
  blocksOf().forEach(b=>{
    const s=b.dataset.s;
    if(s==='scene'){sc=b;scN++;cur=null;return;}
    if(s==='act'){sc=null;cur=null;return;}
    if(s==='char'){
      const name=blkText(b).replace(/\s*\([^)]*\)\s*/g,' ').replace(/\^+$/,'').trim();
      if(!name){cur=null;return;}
      const key=normKey(name);let c=map.get(key);
      if(!c){c={key,name:name.toUpperCase(),replies:[],words:0,scenes:new Set()};map.set(key,c);}
      cur={c,r:{id:b.dataset.id,n:sc?scN:0,text:''}};c.replies.push(cur.r);if(sc)c.scenes.add(sc.dataset.id);return;
    }
    if(s==='dial'&&cur){const t=blkText(b).trim();cur.r.text+=(cur.r.text?' ':'')+t;cur.c.words+=wordsIn(t);return;}
    if(s==='paren'&&cur)return;
    cur=null;
  });
  return [...map.values()].sort((a,b)=>b.replies.length-a.replies.length||a.name.localeCompare(b.name));
}
function persList(){
  const f=normKey(persQ);
  return lastChars.map((c,i)=>({c,i})).filter(({c})=>!f||c.key.includes(f)).map(({c,i})=>
    `<div><div class="nv-row" onclick="persToggle(${i})"><span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${colorOf(c.name)}"></span><span class="flex-1 truncate font-semibold">${escapeHtml(c.name)}</span><span class="text-[10px] text-slate-400 shrink-0">${c.replies.length} rép. · ${c.scenes.size} sc. · ${c.words} mots</span></div>`
    +(navCharOpen===i?c.replies.map((r,j)=>`<div class="nv-row text-[11px]" style="padding-left:1.4rem" onclick="persGo(${i},${j})"><span class="shrink-0 text-slate-400">${r.n?'Sc. '+r.n:'—'}</span><span class="flex-1 truncate text-slate-500">${escapeHtml(r.text.slice(0,70)||'…')}</span></div>`).join(''):'')+'</div>').join('')||'<p class="text-slate-400 text-center py-4">Aucun résultat.</p>';
}
function persHtml(){
  lastChars=charModel();
  if(!lastChars.length)return '<p class="text-slate-400 py-6 text-center">Aucun personnage détecté. Les noms sont lus dans les blocs « Personnage » (style Tab pour changer de bloc).</p>';
  return `<input class="ed-in mb-2" placeholder="Rechercher un personnage…" value="${escapeHtml(persQ)}" oninput="persQ=this.value;E('pers-list').innerHTML=persList()"><div id="pers-list">${persList()}</div><div class="flex gap-2 mt-3"><button class="flex-1 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-semibold" onclick="exportChars()">Exporter le registre (JSON)</button><button class="py-2 px-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-semibold" onclick="copyChars()">Copier</button></div>`;
}
function persToggle(i){navCharOpen=navCharOpen===i?null:i;E('pers-list').innerHTML=persList();}
function persGo(i,j){const r=lastChars[i]&&lastChars[i].replies[j];if(r)navGo(r.id);}
const charsJson=()=>({format:'mobchars',version:1,document:currentCard.name||'',characters:lastChars.map(c=>({name:c.name,replies:c.replies.length,scenes:c.scenes.size,words:c.words}))});
async function exportChars(){
  const base=String(currentCard.name||'scenario').replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]/g,'_');
  await deliver(new Blob([JSON.stringify(charsJson(),null,2)],{type:'application/json'}),base+'-personnages.json','Registre exporté !');
}
async function copyChars(){try{await navigator.clipboard.writeText(lastChars.map(c=>c.name).join('\n'));showToast('Noms copiés.');}catch(e){showToast('Copie impossible.');}}
function verHtml(){
  const vs=(doc.versions||[]).slice().reverse();
  let h=(canEdit()?'<button class="w-full mb-2 py-2 rounded-xl bg-[#5246EE] text-white font-semibold" onclick="saveVersionNow()">Créer un point de sauvegarde</button>':'')
    +`<p class="text-[10px] text-slate-400 mb-2">Une version est gardée à chaque enregistrement manuel, et au plus toutes les 10 min en enregistrement automatique (${VMAX} versions maximum).</p>`;
  if(!vs.length)return h+'<p class="text-slate-400 py-6 text-center">Aucune version pour l\'instant.</p>';
  return h+vs.map(v=>`<div class="nv-row" onclick="openVersions('${v.id}')"><i class="fa-regular fa-clock text-slate-400"></i><div class="flex-1 min-w-0"><div class="font-semibold truncate">${escapeHtml(fmtDate(v.t))}${v.m?' · manuel':''}${v.note?' · '+escapeHtml(v.note):''}</div><div class="text-[10px] text-slate-400 truncate">${escapeHtml(v.by||'')} · ${v.w} mots</div></div><i class="fa-solid fa-chevron-right text-[10px] text-slate-300"></i></div>`).join('');
}
function initModules(){
  doc.versions=doc.versions||[];doc.dur=doc.dur||{};

document.addEventListener('selectionchange',()=>{   // on quitte une scène : durées et totaux recalculés tout de suite
  if(!docReady||docType!=='script')return;const s=getSelection();if(!s.rangeCount)return;

/* --- Collaborateurs (repris de map.html) --- */
const myEmail=()=>(currentUser.email||'').toLowerCase();
const isOwner=()=>{const o=getOwnerId();return !o||o===currentUser.id;};
const ownerEmail=()=>(holder().owner_email||'').toLowerCase();
function canManageCollab(c){if(myRole!=='admin')return false;if(isOwner())return true;return (c.role||'editor')!=='admin'&&(c.email||'').toLowerCase()!==myEmail();}
function requireAdmin(){if(myRole==='admin')return true;showToast("Seul un admin peut gérer les collaborateurs.");return false;}
window.toggleCollaboratorsDropdown=()=>E('collab-dropdown').classList.toggle('hidden');
document.addEventListener('click',e=>{if(!e.target.closest('#collab-dropdown')&&!e.target.closest('[onclick="toggleCollaboratorsDropdown()"]'))E('collab-dropdown').classList.add('hidden');});
function renderCollaboratorsList(){
  const listEl=E('collaborators-list'),collabs=getCollabs(),admin=myRole==='admin';
  E('collab-count-label').textContent=`Collaborateurs (${collabs.length+1})`;
  E('collab-add-section').classList.toggle('hidden',!admin);
  const ao=document.querySelector('#new-collab-role option[value="admin"]');
  if(ao){ao.textContent=isOwner()?'Admin':'Admin (à confirmer)';}
  listEl.innerHTML=`<div class="flex items-center justify-between gap-2 text-xs p-2 bg-slate-50 dark:bg-slate-800 rounded-lg"><span class="font-medium text-slate-700 dark:text-slate-300 truncate">${escapeHtml(currentUser.email)} (vous)</span><span class="text-[10px] font-semibold text-[#5246EE] shrink-0">${isOwner()?'Propriétaire':ROLE_LABELS[myRole]}</span></div>`;
  collabs.forEach((c,idx)=>{
    const acc=c.status==='accepted',manage=canManageCollab(c);
    const roleCtl=manage?`<select onchange="setCollaboratorRole(${idx},this.value)" class="px-1.5 py-1 text-[10px] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-md focus:outline-none">${Object.entries(ROLE_LABELS).map(([k,l])=>`<option value="${k}" ${c.role===k?'selected':''}>${k==='admin'&&!isOwner()?'Admin (à confirmer)':l}</option>`).join('')}</select>`:`<span class="text-[10px] font-semibold text-slate-500">${ROLE_LABELS[c.role]||c.role}</span>`;
    const row=document.createElement('div');row.className='flex items-center justify-between gap-2 text-xs p-2 bg-slate-50 dark:bg-slate-800 rounded-lg';
    row.innerHTML=`<div class="min-w-0"><div class="truncate text-slate-700 dark:text-slate-300">${escapeHtml(c.email)}</div><div class="text-[10px] ${acc?'text-emerald-500':'text-amber-500'}">${acc?'Accepté':'Invitation envoyée'}</div></div><div class="flex items-center gap-1 shrink-0">${roleCtl}${manage?`<button onclick="removeCollaborator(${idx})" class="text-rose-500 hover:text-rose-700 p-1" title="Retirer"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>`:''}</div>`;
    listEl.appendChild(row);
  });
  lucide.createIcons();
}
async function requestAdmin(email){
  const{error}=await supabaseClient.rpc('request_admin_role',{p_table:standalone?'cards':'projects',p_id:String(standalone?cardId:projectId),p_email:email});
  showToast(error?"Demande impossible : "+error.message:"Demande envoyée au propriétaire pour nommer "+email+" admin.");
}
async function addCollaborator(){
  if(!requireAdmin())return;const input=E('new-collab-email'),email=input.value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showToast("Adresse e-mail invalide.");return;}
  if(email===myEmail()){showToast("Vous ne pouvez pas vous inviter vous-même.");return;}
  let role=E('new-collab-role').value,wantAdmin=false;const collabs=getCollabs();
  if(email===ownerEmail()){showToast("Le propriétaire ne peut pas être invité.");return;}
  if(role==='admin'&&!isOwner()){wantAdmin=true;role='editor';}
  const ex=collabs.find(c=>(c.email||'').toLowerCase()===email);
  if(ex&&!canManageCollab(ex)){showToast("Vous ne pouvez pas modifier ce collaborateur.");return;}
  if(ex){Object.assign(ex,{role,status:'pending',invitedBy:currentUser.email,invitedAt:new Date().toISOString()});delete ex.acceptedAt;}
  else collabs.push({email,role,status:'pending',invitedBy:currentUser.email,invitedAt:new Date().toISOString()});
  await saveCurrentMapState(true);renderCollaboratorsList();input.value='';showToast("Invitation envoyée !");
  if(wantAdmin)await requestAdmin(email);
}
window.setCollaboratorRole=async function(idx,role){
  if(!requireAdmin())return;const t=getCollabs()[idx];
  if(!t||!canManageCollab(t)){showToast("Seul le propriétaire peut modifier le rôle d'un admin.");renderCollaboratorsList();return;}
  if(role==='admin'&&!isOwner()){await requestAdmin(t.email);renderCollaboratorsList();return;}
  t.role=role;await saveCurrentMapState(true);renderCollaboratorsList();showToast("Rôle mis à jour.");
};
async function removeCollaborator(idx){
  if(!requireAdmin())return;const c=getCollabs()[idx];
  if(c&&!canManageCollab(c)){showToast("Seul le propriétaire peut retirer un admin.");return;}
  if(!c||!await treeConfirm(`Retirer ${c.email} ?`))return;
  getCollabs().splice(idx,1);await saveCurrentMapState(true);renderCollaboratorsList();
}
