<script>
/* ===== Mots de passe : vérification côté serveur (fonction SQL check_item_pwd — voir protect_pwd.sql) ===== */
window.verifyPwd = async function (client, table, id, typed, stored) {
  if (typed == null) return false;
  try {
    const { data, error } = await client.rpc('check_item_pwd', { p_table: table, p_id: String(id), p_pwd: String(typed) });
    if (!error) return data === true;
    const msg = String(error.message || '');
    if (/too_many_attempts/.test(msg)) { alert('Trop de tentatives incorrectes. Réessayez dans quelques minutes.'); return false; }
    const missing = error.code === 'PGRST202' || error.code === '42883' || /could not find the function|does not exist/i.test(msg);
    if (!missing) { console.warn('check_item_pwd :', msg); return false; }
  } catch (e) { console.warn('check_item_pwd :', e); return false; }
  // fonction SQL pas encore installée : ancien mode (mot de passe encore en clair dans la colonne)
  return stored != null && !/^\$2[abxy]\$|^pbkdf2\$|^locked$/.test(String(stored)) && String(typed) === String(stored);
};
</script>

    <script>
        // Barre de chargement fine sous le menu du haut : visible seulement pendant l'ouverture d'un document
        window.topProgress = (() => {
            const el = document.getElementById('top-progress'), bar = el && el.firstElementChild;
            let timer = null, w = 0;
            return {
                start() {
                    if (!el) return;
                    clearInterval(timer);
                    bar.style.transition = 'none'; bar.style.width = '0%'; void bar.offsetWidth; bar.style.transition = '';
                    el.classList.add('active'); w = 12; bar.style.width = w + '%';
                    timer = setInterval(() => { w += (92 - w) * 0.1; bar.style.width = w + '%'; }, 250);
                },
                done() {
                    if (!el) return;
                    clearInterval(timer); bar.style.width = '100%';
                    setTimeout(() => el.classList.remove('active'), 250);
                    setTimeout(() => { bar.style.width = '0%'; }, 600);
                }
            };
        })();
        // retour arrière (page restaurée depuis le cache) : on ne garde pas une barre à moitié remplie
        window.addEventListener('pageshow', (e) => { if (e.persisted) window.topProgress.done(); });
        window.topProgress.start();
    </script>

        function escapeHtml(str) {
            if (!str) return '';

        /* ===================== SAUVEGARDE DU FICHIER ===================== */

    // --- Boîte de dialogue générique (saisie / confirmation / choix) ---
    function dlg({ title, message = '', input = null, buttons, row = false }) {
        return new Promise(resolve => {
            const ov = document.createElement('div');
            ov.className = 'fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50';
            ov.innerHTML = '<div class="w-full max-w-sm bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-800 p-5 space-y-3 text-xs"><h3 class="font-bold text-sm"></h3><p class="text-gray-500 dark:text-gray-400 whitespace-pre-line hidden"></p><input class="hidden w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:border-[#5246EE]"><div class="' + (row ? 'flex gap-2' : 'flex flex-col gap-2') + ' pt-1"></div></div>';
            const [h, p, inp, bar] = ov.querySelector('div').children;
            h.textContent = title;
            if (message) { p.textContent = message; p.classList.remove('hidden'); }
            if (input) { inp.classList.remove('hidden'); inp.type = input.type || 'text'; inp.placeholder = input.placeholder || ''; inp.value = input.value || ''; }
            const done = (value) => { ov.remove(); document.removeEventListener('keydown', onKey, true); resolve(value === undefined ? null : { value, text: inp.value }); };
            const primary = buttons.find(b => b.primary);
            const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(undefined); } else if (e.key === 'Enter' && input && primary) { e.preventDefault(); done(primary.value); } };
            buttons.forEach(b => {
                const btn = document.createElement('button');
                btn.type = 'button'; btn.textContent = b.label; btn.disabled = !!b.disabled; if (b.title) btn.title = b.title;
                btn.className = 'py-2.5 px-3 rounded-xl font-semibold transition-all ' + (row ? 'flex-1 ' : '') + (b.danger ? 'bg-red-500 hover:bg-red-600 text-white' : b.primary ? 'bg-[#5246EE] hover:bg-[#4538d8] text-white' : 'bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700') + (b.disabled ? ' opacity-40 cursor-not-allowed' : '');
                btn.addEventListener('click', () => done(b.value));
                bar.appendChild(btn);
            });
            ov.addEventListener('mousedown', (e) => { if (e.target === ov) done(undefined); });
            document.addEventListener('keydown', onKey, true);
            document.body.appendChild(ov);
            setTimeout(() => (input ? inp : bar.querySelector('button:not([disabled])'))?.focus(), 30);
            if (input) inp.select();
        });
    }

    // --- Détection de fichiers binaires / images (signatures + octets de contrôle) ---
    function detectBinaryKind(bytes) {
        const sig = (...b) => b.every((v, i) => bytes[i] === v);
        if (sig(0x89, 0x50, 0x4E, 0x47)) return 'une image PNG';
        if (sig(0xFF, 0xD8, 0xFF)) return 'une image JPEG';
        if (sig(0x47, 0x49, 0x46, 0x38)) return 'une image GIF';
        if (sig(0x52, 0x49, 0x46, 0x46)) return 'un fichier RIFF (image WebP / audio / vidéo)';
        if (sig(0x25, 0x50, 0x44, 0x46)) return 'un PDF (renommé)';
        if (sig(0x50, 0x4B, 0x03, 0x04)) return 'une archive ZIP (ex. fichier Pages ou Word)';
        if (sig(0xD0, 0xCF, 0x11, 0xE0)) return 'un ancien document Office (.doc)';
        const head = bytes.subarray(0, 8192);
        if (head[0] === 0xFF && head[1] === 0xFE || head[0] === 0xFE && head[1] === 0xFF) return null; // UTF-16 avec BOM
        let ctrl = 0;
        for (const v of head) { if (v === 0) return 'des données binaires'; if (v < 9 || (v > 13 && v < 32)) ctrl++; }
        return head.length && ctrl / head.length > 0.02 ? 'des données binaires' : null;
    }

    // --- Décodage avec détection d'encodage (UTF-16 BOM, UTF-8, sinon Windows-1252) ---
    function decodeTextBytes(bytes) {
        if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes.subarray(2));
        if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes.subarray(2));
        try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/^\uFEFF/, ''); }
        catch (e) { return new TextDecoder('windows-1252').decode(bytes); }
    }

    // PDF textuel : reconstruit les lignes à partir des coordonnées plutôt que
    // d'aplatir tous les fragments. Les marges et la typographie guident le style.
    async function pdfToText(buf) {
        if (!window.pdfjsLib) throw new Error('Lecteur PDF indisponible');
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
        const lines=[];
        for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
            const page=await pdf.getPage(pageNo), content=await page.getTextContent();
            const rows=[];
            for(const it of content.items){
                if(!it.str || !it.str.trim())continue;
                const x=it.transform[4], y=it.transform[5];
                let row=rows.find(r=>Math.abs(r.y-y)<Math.max(2,Math.min(4,Math.abs(it.transform[0])*.3)));
                if(!row){row={y,items:[]};rows.push(row);}

    const KEEP_DOT = /^(com|fr|org|net|io|html?|js|css|txt|pdf|docx?|json|md|png|jpe?g|gif|svg|mobius|mobpro|fountain|pages?|xml|csv|zip|be|de|uk|eu|us|ca|ch)$/;

        text = text.replace(/(?<=\p{L})%(?=\p{L})/gu, bump(() => 'ti'));
        text = text.replace(/(?<=\p{Ll})5(?=\p{Ll})/gu, bump(() => 'ti'));
        text = text.replace(/(?<=\p{Ll}{2})=(?=\p{Ll}{2})/gu, bump(() => 'tt'));
        text = text.replace(/(\p{Ll}{2,})\.(\p{Ll}+)/gu, (m, a, b) => KEEP_DOT.test(b) ? m : (n++, a + 'tt' + b));
        return { text, fixes: n };
    }

    async function docxToText(buf) {

    // Lance une Error (message lisible) si le fichier est refusé.
    async function fileToText(file) {
        if (file.size > MAX_INPUT_BYTES) throw new Error('fichier trop volumineux (max 20 Mo)');
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let text, fixes = 0, layout = null;
        if (/\.pdf$/i.test(file.name)) {
            if (!(bytes[0] === 0x25 && bytes[1] === 0x50)) throw new Error("ce n'est pas un vrai PDF");
            ({ text, fixes, layout } = await pdfToText(buf));
        } else if (/\.docx$/i.test(file.name)) {
            if (!(bytes[0] === 0x50 && bytes[1] === 0x4B)) throw new Error("ce n'est pas un vrai .docx");
            ({ text, layout } = await docxToText(buf));
        } else {
            const kind = detectBinaryKind(bytes);
            if (kind) throw new Error(`le fichier contient ${kind}, pas du texte`);
            text = decodeTextBytes(bytes);
        }
        if (!text.trim()) throw new Error('aucun texte trouvé (document scanné ou composé uniquement d\'images ?)');
        if (text.length > MAX_TEXT_CHARS) throw new Error('texte trop long (max 2 millions de caractères)');
        return { text, fixes, layout };
    }

                const flush = () => { if (cur.length) S.push(cur); cur = []; };
                for (const t of T) {
                    if (t.t === 'meta') { flush(); S.push([t]); continue; }
                    if (sy(t, ';')) { flush(); continue; }
                    if (isCmd(cur)) {
                        const p = cur[cur.length - 1], depth = cur.reduce((d, x) => d + (sy(x, '(') ? 1 : sy(x, ')') ? -1 : 0), 0);
                        if (t.ln > p.ln && !sy(p, ',') && depth <= 0) flush();
                    }
                    cur.push(t);
                }
                flush(); return S;
            }

            // ---------- exécution (sur une copie : tout ou rien) ----------
            function run(S, base) {
                const cp = x => JSON.parse(JSON.stringify(x));
                const D = { nodes: cp(base.nodes || []), links: cp(base.links || []), relationTypes: cp(base.relationTypes || []), fields: cp(Array.isArray(base.fields) ? base.fields : DEFAULT_FIELDS()) };
                const log = [], results = [], types = {}; let ins = 0, upd = 0, del = 0, lk = 0, md = 0, changed = false;
                const val = t => { if (!t) throw Error('valeur manquante'); if (t.t !== 'w') return t.v; const u = t.v.toUpperCase(); if (u === 'NULL') return null; if (u === 'TRUE') return true; if (u === 'FALSE') return false; return /^-?\d+(\.\d+)?$/.test(t.v) ? Number(t.v) : t.v; };
                const findF = c => { const k = idn(c); return D.fields.find(f => idn(f.label) === k || f.key === k) || D.fields.find(f => f.key && f.key === ALIAS[k]); };
                const getF = (c, type) => findF(c) || (() => { const f = { id: uid('f_'), label: pretty(c), type: type || 'line' }; D.fields.push(f); return f; })();
                const setV = (n, f, v) => {
                    if (v !== null && v !== '') {
                        if (f.type === 'number') { v = Number(v); if (!isFinite(v)) throw Error(`« ${f.label} » attend un nombre`); }
                        else if (f.type === 'bool') v = v === true || /^(true|1|oui|vrai)$/i.test(String(v));
                        else v = String(v);
                    }
                    if (f.key) { n[f.key] = v == null ? '' : v; if (f.key === 'birthdate') n.age = computeAge(n.birthdate || ''); }
                    else (n.custom ||= {})[f.id] = v;
                };
                const getV = (n, c) => { const u = c.toLowerCase(); if (u === 'id') return n.id; if (u === '_x') return n.x; if (u === '_y') return n.y; const f = findF(c); if (!f) throw Error(`colonne « ${c} » inconnue`); return fieldVal(n, f); };
                const ref = r => {
                    let n = D.nodes.find(x => x.id === r); if (n) return n;
                    const k = String(r).toLowerCase().trim(), m = D.nodes.filter(x => `${x.firstname || ''} ${x.lastname || ''}`.trim().toLowerCase() === k);
                    if (m.length === 1) return m[0];
                    throw Error(m.length ? `« ${r} » est ambigu (${m.length} personnes) : utilise l'id` : `personne « ${r} » introuvable`);
                };
                const place = n => {
                    if (isFinite(n.x) && isFinite(n.y)) return;
                    for (let i = D.nodes.length; ; i++) { const x = 60 + (i % 6) * 200, y = 60 + Math.floor(i / 6) * 150; if (!D.nodes.some(o => Math.abs(o.x - x) < 180 && Math.abs(o.y - y) < 120)) { n.x = x; n.y = y; return; } }
                };
                const cmp = (a, op, b) => {
                    if (op === 'LIKE') return new RegExp('^' + String(b).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/%/g, '.*').replace(/_/g, '.') + '$', 'i').test(String(a ?? ''));
                    const na = Number(a), nb = Number(b), num = a !== null && a !== '' && b !== null && isFinite(na) && isFinite(nb);
                    const x = num ? na : String(a ?? '').toLowerCase(), y = num ? nb : String(b ?? '').toLowerCase();
                    switch (op) { case '=': return x === y; case '!=': case '<>': return x !== y; case '<': return x < y; case '>': return x > y; case '<=': return x <= y; case '>=': return x >= y; }
                    throw Error(`opérateur « ${op} » non géré`);
                };
                const where = (tk, i) => {
                    const ors = [[]];
                    while (tk[i] && !/^(order|limit)$/i.test(tk[i].v)) {
                        const col = tk[i++].v; let op = tk[i] && tk[i].v.toUpperCase(), neg = false, f;
                        if (op === 'IS') { i++; if (tk[i] && /^not$/i.test(tk[i].v)) { neg = true; i++; } i++; f = n => { const v = getV(n, col); return (v == null || v === '') !== neg; }; }
                        else { if (op === 'NOT') { neg = true; i++; op = tk[i].v.toUpperCase(); } i++; const v = val(tk[i++]); f = n => cmp(getV(n, col), op, v) !== neg; }
                        ors[ors.length - 1].push(f);
                        const nx = tk[i];
                        if (nx && /^and$/i.test(nx.v)) i++; else if (nx && /^or$/i.test(nx.v)) { i++; ors.push([]); } else break;
                    }
                    return [n => ors.some(a => a.every(f => f(n))), i];
                };
                const link = (rel, a, b, directed) => {
                    const A = ref(a), B = ref(b);
                    if (A === B) throw Error('une personne ne peut pas être reliée à elle-même');
                    const res = addLinkTo(D.links, A.id, B.id, rel ? rel.id : '', directed);
                    if (res === 'exists') { log.push({ k: 'warn', m: `Lien déjà existant entre « ${a} » et « ${b} » : ignoré` }); return; }
                    if (res === 'merged') { log.push({ k: 'ok', m: `« ${a} » et « ${b} » : les deux sens ont fusionné en un lien normal` }); changed = true; return; }
                    lk++; changed = true;
                };
                // link: (typeLink: "Nom", a and b)  /  (typeLink: "Nom", from a to b) : modifie le lien EXISTANT entre deux personnes
                const editLink = (rel, a, b, directed) => {
                    const A = ref(a), B = ref(b);
                    if (A === B) throw Error('une personne ne peut pas être reliée à elle-même');
                    const between = D.links.filter(l => (l.sourceId === A.id && l.targetId === B.id) || (l.sourceId === B.id && l.targetId === A.id));
                    if (!between.length) { log.push({ k: 'warn', m: `Aucun lien entre « ${a} » et « ${b} » : utilise newLink pour le créer` }); return; }
                    const t = directed ? (between.find(l => isDirected(l) && l.sourceId === A.id) || (between.length === 1 ? between[0] : null))
                                       : (between.find(l => !isDirected(l)) || (between.length === 1 ? between[0] : null));
                    if (!t) throw Error(`plusieurs liens existent entre « ${a} » et « ${b} » : précise le sens avec « from X to Y », ou le lien normal avec « X and Y »`);
                    t.relationTypeId = rel ? rel.id : '';
                    if (directed) { t.sourceId = A.id; t.targetId = B.id; t.directed = true; } else delete t.directed;
                    md++; changed = true;
                };
                // createLink: (name: "Nom", color: "#hex")   |   newLink: (typeLink: "Nom", x and y, from x to z ...)
                // « to » = lien à sens unique (x → z), « and » = lien normal. Les parenthèses sont facultatives.
                const cmd = st => {
                    const kind = st[0].v.toLowerCase(); let i = 2, name = null, color = null, tl = null; const pairs = [];
                    while (i < st.length) {
                        const t = st[i], w = t.v.toLowerCase();
                        if (sy(t, ',') || sy(t, '(') || sy(t, ')')) { i++; continue; }
                        // clause de liens : from A [with B …] to C [to D …] (sens unique)   |   A [with B …] and C [and D …] (lien normal)
                        //   to = sens unique (flèche), and = lien normal ; chaque source est reliée à chaque cible
                        const isRef = x => x && x.t !== 'sym' && x.t !== 'meta';
                        const kw = x => x && x.t === 'w' ? x.v.toLowerCase() : '';
                        const isKey = t.t === 'w' && (w === 'name' || w === 'color' || w === 'typelink') && (sy(st[i + 1], ':') || sy(st[i + 1], '='));
                        if (!isKey && isRef(t)) {
                            let j = i; const hasFrom = kw(st[j]) === 'from'; if (hasFrom) j++;
                            const srcs = [], tgs = [];
                            const fmt = 'syntaxe attendue : from X [with Y,Z …] to A,B (sens unique) ou X [with Y,Z …] and A,B (lien normal)';
                            if (!isRef(st[j])) throw Error(fmt);
                            srcs.push(st[j++].v);
                            // Sources : syntaxes longues, courtes et mixtes acceptées (with b with c / with b,c / with b,c with d).
                            while (kw(st[j]) === 'with') {
                                j++;
                                if (!isRef(st[j])) throw Error('with : une personne est attendue après « with »');
                                srcs.push(st[j++].v);
                                while (sy(st[j], ',') && isRef(st[j + 1]) && !['to', 'and', 'with'].includes(kw(st[j + 1]))) {
                                    j++;
                                    srcs.push(st[j++].v);
                                }
                            }
                            // Cibles : « to e,f,g » / « and e,f,g », ainsi que les répétitions historiques.
                            while (kw(st[j]) === 'to' || kw(st[j]) === 'and') {
                                const d = kw(st[j]) === 'to'; j++;
                                if (!isRef(st[j])) throw Error(`« ${d ? 'to' : 'and'} » : une personne est attendue après`);
                                tgs.push([st[j++].v, d]);
                                while (sy(st[j], ',') && isRef(st[j + 1]) &&
                                       !['from', 'to', 'and', 'with', 'name', 'color', 'typelink'].includes(kw(st[j + 1])) &&
                                       !['to', 'and', 'with'].includes(kw(st[j + 2]))) {
                                    j++;
                                    tgs.push([st[j++].v, d]);
                                }
                            }
                            if (!tgs.length) throw Error(fmt);
                            if (new Set(tgs.map(x => x[1])).size > 1) throw Error('ne mélange pas « to » et « and » dans la même clause : sépare-les par une virgule');
                            if (tgs[0][1] && !hasFrom) throw Error('un lien à sens unique s\'écrit « from X to Y »');
                            if (!tgs[0][1] && hasFrom) throw Error('« from » ne s\'utilise qu\'avec « to » : écris « a and b » pour un lien normal');
                            srcs.forEach(a => tgs.forEach(([b, d]) => { if (a !== b) pairs.push([a, b, d]); }));
                            i = j; continue;
                        }
                        if (t.t === 'w' && (w === 'name' || w === 'color' || w === 'typelink') && (sy(st[i + 1], ':') || sy(st[i + 1], '='))) { const v = st[i + 2]; if (!v || v.t === 'sym') throw Error(`valeur manquante après ${t.v}`); if (w === 'name') name = v.v; else if (w === 'color') color = v.v; else tl = v.v; i += 3; continue; }
                        throw Error(`élément inattendu « ${t.v} »`);
                    }
                    if (kind === 'createlink') {
                        if (!name) throw Error('createLink : name: "…" est obligatoire');
                        if (!color) throw Error('createLink : color: "#……" est obligatoire');
                        if (!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(color)) throw Error(`couleur « ${color} » invalide (attendu : #RRGGBB)`);
                        if (pairs.length) throw Error('createLink ne crée pas de lien : utilise newLink');
                        let rel = D.relationTypes.find(r => r.name.toLowerCase() === name.toLowerCase());
                        if (rel) { rel.color = color; log.push({ k: 'warn', m: `Le type « ${rel.name} » existait déjà : couleur mise à jour` }); }
                        else { rel = { id: uid('rel-'), name, color }; D.relationTypes.push(rel); log.push({ k: 'ok', m: `Type de lien « ${name} » ajouté à la légende` }); }
                        changed = true; return;
                    }
                    const cn = kind === 'link' ? 'link' : 'newLink';
                    if (!tl) throw Error(`${cn} : typeLink: "…" est obligatoire`);
                    if (!pairs.length) throw Error(`${cn} : from X [with Y,Z …] to A,B (sens unique) ou X [with Y,Z …] and A,B (lien normal) attendu`);
                    const rel = D.relationTypes.find(r => r.name.toLowerCase() === tl.toLowerCase() || r.id === tl);
                    if (!rel && !/^(none|aucun)$/i.test(tl)) throw Error(`type de lien « ${tl} » inconnu : crée-le d'abord avec createLink`);
                    if (kind === 'link') {
                        const n0 = D.links.length;
                        pairs.forEach(([a, b, directed]) => editLink(rel, a, b, directed));
                        normalizeLinkList(D.links);
                        if (D.links.length < n0) log.push({ k: 'ok', m: `${n0 - D.links.length} lien(s) fusionné(s) ou devenu(s) identique(s)` });
                        return;
                    }
                    pairs.forEach(([a, b, directed]) => link(rel, a, b, directed));
                };
                const exec = st => {
                    if (st[0].t === 'meta' || /^use$/i.test(st[0].v)) return;
                    if (/^alter$/i.test(st[0].v)) {
                        const k = st.findIndex(t => t.t === 'w' && /^add$/i.test(t.v)); let j = k + 1;
                        if (k < 0 || !st[j]) throw Error('ALTER TABLE nom ADD COLUMN colonne type attendu');
                        if (/^column$/i.test(st[j].v)) j++;
                        getF(st[j].v, tmap(st.slice(j + 1).map(t => t.v).join(' '))); changed = true; return;
                    }
                    if (isCmd(st)) return cmd(st);
                    const w0 = st[0].v.toUpperCase(); let i = 1;
                    if (w0 === 'CREATE') {
                        if (/^(table|card)$/i.test(st[i].v)) i++;
                        if (/^if$/i.test(st[i].v)) i += 3;
                        i++;
                        if (!sy(st[i], '(')) throw Error('« ( » attendue après le nom de la table');
                        i++; let n = 0;
                        while (i < st.length) {
                            const nm = st[i++]; if (sy(nm, ')')) break;
                            let depth = 0, ty = '';
                            while (i < st.length && !(depth === 0 && (sy(st[i], ',') || sy(st[i], ')')))) { if (sy(st[i], '(')) depth++; if (sy(st[i], ')')) depth--; ty += ' ' + st[i].v; i++; }
                            if (sy(st[i], ',')) i++;
                            const u = nm.v.toLowerCase();
                            if (u === 'id' || u === '_x' || u === '_y' || /^(primary|foreign|unique|constraint|check)$/.test(u)) continue;
                            getF(nm.v, tmap(ty)); n++;
                        }
                        log.push({ k: 'ok', m: `Table : ${n} colonne(s) prises en compte` }); changed = true; return;
                    }
                    if (w0 === 'INSERT') {
                        if (/^into$/i.test(st[i].v)) i++;
                        i++; let cols;
                        if (sy(st[i], '(')) { cols = []; i++; while (!sy(st[i], ')')) { if (!sy(st[i], ',')) cols.push(st[i].v); i++; } i++; }
                        else cols = ['id', ...D.fields.map(f => f.label)];
                        if (!/^values$/i.test(st[i].v)) throw Error('VALUES attendu');
                        i++;
                        while (sy(st[i], '(')) {
                            i++; const vs = [];
                            while (!sy(st[i], ')')) { if (!sy(st[i], ',')) vs.push(val(st[i])); i++; }
                            i++;
                            if (vs.length !== cols.length) throw Error(`${cols.length} colonnes mais ${vs.length} valeurs`);
                            const nd = {}; let id = null;
                            cols.forEach((c, k) => { const u = c.toLowerCase(); if (u === 'id') id = vs[k]; else if (u === '_x') nd.x = Number(vs[k]); else if (u === '_y') nd.y = Number(vs[k]); });
                            nd.id = id != null && id !== '' ? String(id) : uid('node-');
                            if (D.nodes.some(x => x.id === nd.id)) throw Error(`id « ${nd.id} » déjà utilisé`);
                            cols.forEach((c, k) => { const u = c.toLowerCase(); if (u !== 'id' && u !== '_x' && u !== '_y') setV(nd, getF(c), vs[k]); });
                            place(nd); D.nodes.push(nd); ins++; changed = true;
                            if (sy(st[i], ',')) i++;
                        }
                        return;
                    }
                    if (w0 === 'UPDATE') {
                        i = 2; if (!/^set$/i.test(st[i].v)) throw Error('SET attendu');
                        i++; const sets = [];
                        for (;;) { const c = st[i++].v; i++; sets.push([c, val(st[i++])]); if (sy(st[i], ',')) i++; else break; }
                        let f = () => true; if (st[i] && /^where$/i.test(st[i].v)) [f, i] = where(st, i + 1);
                        const hit = D.nodes.filter(f);
                        hit.forEach(n => sets.forEach(([c, v]) => { const u = c.toLowerCase(); if (u === '_x') n.x = Number(v); else if (u === '_y') n.y = Number(v); else if (u === 'id') throw Error("l'id ne peut pas être modifié"); else setV(n, getF(c), v); }));
                        upd += hit.length; changed = true; return;
                    }
                    if (w0 === 'DELETE') {
                        if (/^from$/i.test(st[i].v)) i++;
                        i++; let f = () => true; if (st[i] && /^where$/i.test(st[i].v)) [f, i] = where(st, i + 1);
                        const ids = new Set(D.nodes.filter(f).map(n => n.id));
                        D.nodes = D.nodes.filter(n => !ids.has(n.id)); D.links = D.links.filter(l => !ids.has(l.sourceId) && !ids.has(l.targetId));
                        del += ids.size; changed = true; return;
                    }
                    if (w0 === 'SELECT') {
                        const cols = [];
                        while (!/^from$/i.test(st[i].v)) { if (!sy(st[i], ',')) cols.push(st[i].v); i++; }
                        i += 2; let f = () => true; if (st[i] && /^where$/i.test(st[i].v)) [f, i] = where(st, i + 1);
                        let ord = null, desc = false, lim = Infinity;
                        while (st[i]) {
                            const u = st[i].v.toUpperCase();
                            if (u === 'ORDER') { i += 2; ord = st[i++].v; if (st[i] && /^(asc|desc)$/i.test(st[i].v)) desc = st[i++].v.toUpperCase() === 'DESC'; }
                            else if (u === 'LIMIT') { lim = Number(st[i + 1].v); i += 2; }
                            else throw Error(`« ${st[i].v} » inattendu`);
                        }
                        const cs = cols[0] === '*' ? ['id', ...D.fields.map(x => x.label)] : cols;
                        let rs = D.nodes.filter(f);
                        if (ord) rs = rs.slice().sort((a, b) => { const x = getV(a, ord), y = getV(b, ord); return (x > y ? 1 : x < y ? -1 : 0) * (desc ? -1 : 1); });
                        rs = rs.slice(0, lim);
                        results.push({ cols: cs, rows: rs.map(n => cs.map(c => getV(n, c))) });
                        log.push({ k: 'ok', m: `SELECT : ${rs.length} ligne(s)` }); return;
                    }
                    throw Error(`instruction non reconnue : ${st[0].v}`);
                };
                S.forEach(st => { try { exec(st); } catch (e) { throw Error(`Ligne ${st[0].ln} : ${e instanceof TypeError ? 'syntaxe invalide' : e.message}`); } });
                if (ins) log.push({ k: 'ok', m: `${ins} personne(s) ajoutée(s)` });
                if (upd) log.push({ k: 'ok', m: `${upd} personne(s) modifiée(s)` });
                if (del) log.push({ k: 'ok', m: `${del} personne(s) supprimée(s)` });
                if (lk) log.push({ k: 'ok', m: `${lk} lien(s) créé(s)` });
                if (md) log.push({ k: 'ok', m: `${md} lien(s) modifié(s)` });
                return { D, log, results, changed };
            }

            // routage : CREATE TABLE|CARD crée une nouvelle carte (les instructions suivantes la visent), USE désigne une autre carte ; sans CREATE tout vise la carte courante
            function runAll(S) {
                const G = [{ ident: currentCard.name || '', label: 'carte actuelle', base: currentCard, st: [] }];
                let act = G[0], title = null, made = false;
                const find = n => G.find(g => idn(g.ident) === idn(n) || idn(g.label) === idn(n));
                const tn = st => {
                    const u = st[0].v.toUpperCase(); let i = 1;
                    if (u === 'INSERT') { if (/^into$/i.test(st[i].v)) i++; return st[i]; }
                    if (u === 'UPDATE') return st[1];
                    if (u === 'DELETE') { if (/^from$/i.test(st[i].v)) i++; return st[i]; }
                    if (u === 'SELECT') return st[st.findIndex(t => t.t === 'w' && /^from$/i.test(t.v)) + 1];
                    return null;
                };
                S.forEach(st => {
                    if (st[0].t === 'meta') { title = st[0].v; return; }
                    const u = st[0].t === 'w' ? st[0].v.toUpperCase() : '';
                    try {
                        if (u === 'CREATE') {
                            let j = 1; if (/^(table|card)$/i.test(st[j].v)) j++; if (/^if$/i.test(st[j].v)) j += 3;
                            const nt = st[j]; if (!nt) throw Error('nom de la table manquant');
                            act = { ident: nt.v, label: title || (nt.t === 'w' ? pretty(nt.v) : nt.v), base: {}, st: [st], isNew: true }; G.push(act); made = true; title = null; return;
                        }
                        if (u === 'USE') { let j = 1; if (/^(table|card)$/i.test(st[j].v)) j++; const g = st[j] && find(st[j].v); if (!g) throw Error(`carte « ${st[j] ? st[j].v : ''} » inconnue`); act = g; return; }
                        let g = act; const t = tn(st);
                        if (t && t.t !== 'sym') { const f = find(t.v); if (f) g = f; else if (made) throw Error(`table « ${t.v} » inconnue : crée-la d'abord ou utilise USE`); }
                        g.st.push(st);
                    } catch (e) { throw Error(`Ligne ${st[0].ln} : ${e.message}`); }
                });
                const outs = G.map(g => ({ g, r: run(g.st, g.base) })), log = [], results = [];
                outs.forEach(o => { o.r.log.forEach(l => log.push(G.length > 1 ? { ...l, m: `« ${o.g.label} » : ${l.m}` } : l)); results.push(...o.r.results); });
                return { cur: outs[0].r, news: outs.slice(1).map(o => ({ label: o.g.label, D: o.r.D })), log, results };
            }

            // un script (une ou plusieurs tables) -> une carte par CREATE TABLE
            function toCards(src, fname) {
                const segs = []; let cur = null, title = null;
                split(tok(src)).forEach(st => {
                    if (st[0].t === 'meta') { title = st[0].v; return; }
                    if (st[0].t === 'w' && /^create$/i.test(st[0].v)) {
                        let j = st.findIndex(t => t.t === 'w' && /^(table|card)$/i.test(t.v)) + 1;
                        if (st[j] && /^if$/i.test(st[j].v)) j += 3;
                        cur = { title, tn: st[j] ? st[j].v : '', st: [] }; segs.push(cur); title = null;
                    } else if (!cur) { cur = { title, tn: '', st: [] }; segs.push(cur); }
                    cur.st.push(st);
                });
                const base = String(fname || 'Carte importée').replace(/\.[^.]+$/, '');
                return segs.map(s => {
                    const r = run(s.st, {});
                    return { id: 'item_' + Date.now() + Math.random().toString(36).slice(2, 7), name: s.title || (segs.length === 1 ? base : pretty(s.tn)), type: 'card', links: r.D.links, nodes: r.D.nodes, content: '', relationTypes: r.D.relationTypes, fields: r.D.fields };
                });
            }

            // ---------- tables -> SQL (format Mobius : labels exacts, positions, légende et liens) ----------
            function emit(tables, o = {}) {

const SCENE_RE=/^(?:INT|EXT|EST|INT\.?\/EXT|EXT\.?\/INT|I\/E|INTÉRIEUR|EXTÉRIEUR)\s*[.\-– ]/i;
const ACT_RE=/^(?:(?:ACTE|ACT|PARTIE|CHAPITRE)\s+(?:[IVXLCDM]+|\d+|[A-ZÀ-Ÿ]+)|#+\s*.+)$/i;
const INSERT_RE=/^(?:INSERT|INS[ÉE]R[ÉE]?|INSERTION|CARTON|SURIMPRESSION|TITRE À L[’']ÉCRAN)\b/i;
const NON_CHAR=/^(?:FIN|NOIR|CUT TO|FONDU|SUITE|CONTINU|LE LENDEMAIN|QUELQUES INSTANTS PLUS TARD|THE END)$/i;
function looksFountain(t,n){return /\.(?:fountain|mobscen)$/i.test(n||'')||/^\s*(?:title|author|credit|draft date)\s*:/im.test(t.slice(0,400))||((t.match(/^\s*(?:INT|EXT|EST|I\/E|INTÉRIEUR|EXTÉRIEUR)[. \-–]/gim)||[]).length>=1);}
function importInline(t){
  // Fountain : **gras**, *italique*, _souligné_ deviennent de vrais éléments HTML.
  const parts=String(t).split(/(\*\*[^*\n]+\*\*|\*[^*\n]+\*|_[^_\n]+_)/g);
  return parts.map(x=>{if(/^\*\*.+\*\*$/.test(x))return '<strong>'+escapeHtml(x.slice(2,-2))+'</strong>';
    if(/^\*.+\*$/.test(x))return '<em>'+escapeHtml(x.slice(1,-1))+'</em>';
    if(/^_.+_$/.test(x))return '<u>'+escapeHtml(x.slice(1,-1))+'</u>';
    return escapeHtml(x);}).join('');
}
function classifyScriptLines(t,layout){
  const raw=String(t).replace(/\r/g,'').split('\n'),out=[];
  let inDialogue=false,prevBlank=true;
  for(let i=0;i<raw.length;i++){
    const original=raw[i],line=original.trim(),next=(raw.slice(i+1).find(x=>x.trim())||'').trim();
    if(!line){prevBlank=true;inDialogue=false;continue;}
    if(/^(?:\[\[.*\]\]|={3,})$/.test(line))continue;
    const pos=layout&&layout[i], x=pos&&pos.x;
    const isAct=ACT_RE.test(line),isScene=SCENE_RE.test(line)||/^\.[^.]/.test(line),isInsert=INSERT_RE.test(line);
    const caps=line.replace(/^@/,'').replace(/\s*\([^)]*\)\s*$/,'');
    const upper=caps===caps.toLocaleUpperCase('fr')&&/[A-ZÀ-Ÿ]/.test(caps);
    const character=!isAct&&!isScene&&!isInsert&&!NON_CHAR.test(caps)&&upper&&caps.length<=42&&next&&!SCENE_RE.test(next)&&
      (line.startsWith('@')||(pos&&x>110&&x<420)||(prevBlank&&/^[A-ZÀ-Ÿ][A-ZÀ-Ÿ0-9 .'-]+$/.test(caps)));
    let style;
    if(isAct)style='act';else if(isScene)style='scene';else if(isInsert)style='insert';
    else if(inDialogue&&/^\(.*\)$/.test(line))style='paren';
    else if(character)style='char';
    else if(inDialogue)style='dial';
    else if(pos&&/character|personnage|speaker/i.test(pos.style||''))style='char';
    else if(pos&&/dialogue|dialog/i.test(pos.style||''))style='dial';
    else if(pos&&/scene|slugline|heading/i.test(pos.style||''))style='scene';
    else if(pos&&/acte|act\b/i.test(pos.style||''))style='act';
    else if(pos&&x>110&&x<410&&prevBlank&&line.length<60&&upper)style='char';
    else style='action';
    let value=line.replace(/^\.(?=[^.])/,'').replace(/^@(?=[A-ZÀ-Ÿ])/,'').replace(/^!(?=.)/,'');
    // Un PDF peut indiquer l'italique dans les métadonnées de police.
    let html=importInline(value);
    if(pos&&pos.italic&&!/<em>/.test(html))html='<em>'+html+'</em>';
    if(pos&&pos.bold&&!/<strong>/.test(html)&&style!=='scene'&&style!=='insert')html='<strong>'+html+'</strong>';
    if(style==='scene'||style==='insert')html=html.toLocaleUpperCase('fr');
    out.push(blk(style,html));
    inDialogue=style==='char'||style==='dial'||style==='paren';prevBlank=false;
  }
  return out.join('');
}
function parseFountain(t,layout){
  const L=String(t).replace(/\r/g,'').split('\n'),meta={},K=/^(title|authors?|credit|source|draft date|date|contact|copyright|notes)\s*:\s*(.*)$/i;
  let i=0,k=null;
  while(i<L.length&&(K.test(L[i])||(k&&/^\s+\S/.test(L[i])))){
    const m=L[i].match(K);if(m){k=m[1].toLowerCase();meta[k]=m[2];}else meta[k]+=' '+L[i].trim();i++;
  }
  const head=(meta.title?blk('title',escapeHtml(meta.title)):'')+((meta.author||meta.authors)?blk('sub','de '+escapeHtml(meta.author||meta.authors)):'');
  return {meta,html:head+classifyScriptLines(L.slice(i).join('\n'),layout?layout.slice(i):null)};
}

let lastSel=null,hist={u:[],r:[],base:null,t:0};
const selRoot=r=>{const n=r.commonAncestorContainer,el=n.nodeType===1?n:n.parentElement;return el&&el.closest&&el.closest('[contenteditable=true]');};

// Sélection à utiliser : la vraie, sinon la dernière connue, sinon la fin de la page (aucun clic nécessaire avant d'utiliser un outil)
function getRange(){
  const s=getSelection();
  if(s.rangeCount&&selRoot(s.getRangeAt(0)))return s.getRangeAt(0);
  if(lastSel&&document.contains(lastSel.commonAncestorContainer)&&selRoot(lastSel))return lastSel;
  const last=[...edPage().children].filter(e=>e.dataset.s).pop(),r=document.createRange();

  const s=getSelection();

  const r=getRange().cloneRange(),root=selRoot(r);

}
// Le navigateur peut créer un paragraphe sans notre attribut data-s (retour à la ligne, collage…) : on le répare
function normalizeRoot(root){
  if(!root)return;const def=docType==='script'?'action':'body';let prev=def;
  [...root.childNodes].forEach(n=>{
    if(n.nodeType===1&&n.dataset&&n.dataset.s){prev=n.dataset.s;return;}
    if(n.nodeType===1&&(n.tagName==='DIV'||n.tagName==='P')){n.dataset.s=prev;if(!n.dataset.id)n.dataset.id=rid();return;}
    if(n.nodeType===3&&n.data.length){

      if(keep!==null){const r=document.createRange();r.setStart(n,keep);r.collapse(true);s.removeAllRanges();s.addRange(r);}
    }

}
function allHl(r){   // tout le texte sélectionné est-il surligné ?

    if(b<=a||!n.data.slice(a,b).replace(/\u200b/g,''))continue;
    any=true;if(!inHl(n))return false;
  }
  return any;
}
function buildTools(){

  +`<div class="sec">Style</div><div class="relative"><button id="sty-btn" class="dd" onmousedown="event.preventDefault()" onclick="E('sty-menu').classList.toggle('hidden')"><span id="sty-label">—</span><i class="fa-solid fa-chevron-down text-[10px]"></i></button><div id="sty-menu" class="hidden dd-menu">${edStyles().map(([k,l])=>`<button data-k="${k}" onmousedown="event.preventDefault()" onclick="pickStyle('${k}')"><span>${l}</span><i class="fa-solid fa-check text-[10px]" style="opacity:0"></i></button>`).join('')}</div></div>`
  +`<div class="sec">Police</div><div class="flex gap-1">${seg('fa-bold','Gras',"cmd('bold')",'t-bold')}${seg('fa-italic','Italique',"cmd('italic')",'t-italic')}${seg('fa-underline','Souligné',"cmd('underline')",'t-underline')}${docType==='text'?seg('fa-highlighter','Surligner','hilite()','t-hl'):''}</div>`
  +`<div class="sec">Alignement</div><div class="segbar">${seg('fa-align-left','Aligner à gauche',"setAlign('left')",'t-a-left')}${seg('fa-align-center','Centrer',"setAlign('center')",'t-a-center')}${seg('fa-align-right','Aligner à droite',"setAlign('right')",'t-a-right')}${seg('fa-align-justify','Justifier',"setAlign('justify')",'t-a-justify')}</div>${docType==='text'?`<div class="segbar">${seg('fa-outdent','Diminuer le retrait  (Ctrl/Cmd + [)',"indent(-1)",'t-outdent')}${seg('fa-indent','Augmenter le retrait  (Ctrl/Cmd + ])',"indent(1)",'t-indent')}</div>`:''}`

const inHl=n=>{const el=n&&(n.nodeType===1?n:n.parentElement);return el&&el.closest&&el.closest('.hl');};

/* Surlignage : balises <span class="hl"> gérées à la main (activer / désactiver proprement, par paragraphe) */
function blockRanges(r){
  normalizeRoot(selRoot(r));
  return [...selRoot(r).children].filter(b=>b.dataset.s&&r.intersectsNode(b)).map(b=>{
    const x=document.createRange();x.selectNodeContents(b);
    if(r.compareBoundaryPoints(Range.START_TO_START,x)>0)x.setStart(r.startContainer,r.startOffset);
    if(r.compareBoundaryPoints(Range.END_TO_END,x)<0)x.setEnd(r.endContainer,r.endOffset);
    return x;
  });
}
function liftOutOfHl(r){   // coupe le surlignage englobant pour que le point d'insertion soit en dehors

  const t=document.createRange();t.setStart(r.startContainer,r.startOffset);t.setEnd(h,h.childNodes.length);
  const tail=t.extractContents(),h2=h.cloneNode(false);h2.appendChild(tail);h.after(h2);
  r.setStartAfter(h);r.collapse(true);
}
function hilite(){
  if(!requireEdit())return;const r=restoreSel(),s=getSelection();
  if(r.collapsed){
    const h=inHl(r.startContainer);
    if(h){const x=document.createRange();x.setStartAfter(h);x.collapse(true);s.removeAllRanges();s.addRange(x);}else showToast('Sélectionne du texte à surligner.');
    syncTools();return;
  }
  const on=allHl(r),made=[];
  blockRanges(r).forEach(br=>{
    const frag=br.extractContents();frag.querySelectorAll('.hl').forEach(unwrap);
    if(!frag.childNodes.length)return;liftOutOfHl(br);
    let nodes=[...frag.childNodes];
    if(!on){const sp=document.createElement('span');sp.className='hl';sp.appendChild(frag);nodes=[sp];br.insertNode(sp);}else br.insertNode(frag);
    made.push(...nodes);
  });
  edPage().querySelectorAll('.hl').forEach(h=>{if(!h.textContent&&!h.querySelector('*'))h.remove();});
  if(made.length&&made[0].isConnected){const x=document.createRange();x.setStartBefore(made[0]);x.setEndAfter(made[made.length-1]);s.removeAllRanges();s.addRange(x);lastSel=x.cloneRange();}

}
function cleanEnterHl(){   // un retour à la ligne ne doit pas emporter un surlignage vide

/* Taille : sur la sélection, ou sur la suite de la frappe si rien n'est sélectionné */

function selBlocks(){
  const r=getRange(),root=selRoot(r);if(!root)return[];normalizeRoot(root);

      +edStyles().map(([k,l])=>b(l,`setStyle('${k}')`)).join('')+'<hr>'
      +(docType==='text'?(getSelection().isCollapsed?'':b('💬 Ajouter une bulle','addBubble()')):b('💡 Proposer une idée ici','propose()')+(window.ctxBlock?.dataset.s==='char'?b('🗂️ Ajouter ce personnage aux cartes','openCharacterCardsFromContext()'):''));

let miniCur=null;

/* --- Contenu en lignes de texte avec styles (gras / italique / souligné) --- */
function inlineRuns(node){

    n.childNodes.forEach(c=>{
      if(c.nodeType===3){const t=c.data.replace(/\u200b/g,'').replace(/[\u00a0\u202f\u2009]/g,' ');if(t)runs.push({t,b:f.b,i:f.i,u:f.u});}
      else if(c.nodeType===1){
        if(c.tagName==='BR'){runs.push({t:'\n',b:false,i:false,u:false});return;}
        const st=c.style||{},tg=c.tagName;
        walk(c,{b:f.b||tg==='B'||tg==='STRONG'||+st.fontWeight>=600||st.fontWeight==='bold',i:f.i||tg==='I'||tg==='EM'||st.fontStyle==='italic',u:f.u||tg==='U'||/underline/.test(st.textDecoration||'')});
      }

  while(runs.length&&runs[runs.length-1].t==='\n')runs.pop();

}

function estBlock(b){

function scriptModel(){

  blocksOf().forEach(b=>{
    const s=b.dataset.s;

    if(s==='scene'){if(!act){act=mk(null);acts.push(act);}sc={el:b,id:b.dataset.id,title:headerText(b),blocks:[b]};act.scenes.push(sc);return;}

function parseDur(t){

  if((m=t.match(/^(\d+(?:\.\d+)?)\s*(min|m|minutes?)?$/)))return Math.round(+m[1]*60);

const LAY={act:{col:0,w:57,align:'c',caps:1,b:1,u:1},scene:{col:0,w:57,caps:1,b:1},action:{col:0,w:57},char:{col:22,w:35,caps:1},paren:{col:16,w:20},dial:{col:10,w:35}};
const GAP={act:3,scene:2,action:1,char:1,paren:0,dial:0};
const LPP=58, TXTW=57;   // A4, marges 1,5″ / 1″ / 1″ / 1″, Courier 12 pt (10 car./pouce, 6 lignes/pouce)
const PDF_MAP={'’':"'",'‘':"'",'“':'"','”':'"','„':'"','…':'...','–':'-','—':'-','œ':'oe','Œ':'OE','€':'EUR','•':'*','™':'TM','→':'->','←':'<-','‑':'-','−':'-','ʼ':"'"};
function pdfChar(c){if(PDF_MAP[c])return PDF_MAP[c];const k=c.codePointAt(0);if((k>=32&&k<=126)||(k>=160&&k<=255))return c;if(c==='\t')return '  ';return '?';}
function scriptContent(safe){
  const els=[];let title='',author='';const mapT=t=>safe?[...t].map(pdfChar).join(''):t;
  blocksOf().forEach(b=>{
    const s=b.dataset.s,runs=inlineRuns(b),plain=runs.map(r=>r.t).join('').replace(/\n/g,' ').trim();
    if(s==='title'&&!title){title=mapT(plain);return;}
    if(s==='sub'&&!author){author=mapT(plain.replace(/^(de|par|by|écrit par)\s+/i,''));return;}
    if(!plain)return;
    const k=LAY[s]?s:'action',L=LAY[k],chars=[];
    runs.forEach(r=>{for(const ch of r.t){let c=ch;if(L.caps){const u=c.toUpperCase();if(u.length===1)c=u;}
      const f=((r.b||L.b)?1:0)|((r.i||s==='desc')?2:0)|((r.u||L.u)?4:0);
      if(safe)[...pdfChar(c)].forEach(x=>chars.push({c:x,f}));else chars.push({c,f});}});
    while(chars.length&&(chars[chars.length-1].c===' '||chars[chars.length-1].c==='\n'))chars.pop();

    if(k==='paren'){if(chars[0].c!=='(')chars.unshift({c:'(',f:0});if(chars[chars.length-1].c!==')')chars.push({c:')',f:0});}

function wrapChars(chars,width){

  segs.forEach(seg=>{
    const words=[];let w=[];
    seg.forEach(x=>{if(x.c===' '){if(w.length){words.push(w);w=[];}}else w.push(x);});
    if(w.length)words.push(w);
    if(!words.length){out.push([]);return;}
    let line=[];
    words.forEach(wd=>{
      while(wd.length>width){if(line.length){out.push(line);line=[];}out.push(wd.slice(0,width));wd=wd.slice(width);}
      if(!line.length)line=wd.slice();
      else if(line.length+1+wd.length<=width)line=line.concat([{c:' ',f:0}],wd);
      else{out.push(line);line=wd.slice();}
    });
    if(line.length)out.push(line);

function paginate(els){
  const units=[];

    const last=units[units.length-1];
    if((e.k==='paren'||e.k==='dial')&&last&&last.k==='dlg'){last.parts.push(e);return;}
    if(e.k==='char'||e.k==='paren'||e.k==='dial'){units.push({k:'dlg',parts:[e]});return;}
    units.push({k:e.k,parts:[e]});
  });
  const mk=u=>{const ls=[];u.parts.forEach(p=>{const L=LAY[p.k];wrapChars(p.chars,L.w).forEach(c=>ls.push({t:p.k,col:L.col,al:L.align||null,chars:c,el:p.el}));});return ls;};
  const Q=units.map(u=>({k:u.k,gap:GAP[u.k]!==undefined?GAP[u.k]:1,lines:mk(u)}));
  const pages=[[]];let y=0;
  const emit=l=>{pages[pages.length-1].push(Object.assign({},l,{y}));y++;};
  const brk=()=>{pages.push([]);y=0;};
  const putAll=(ls,gap)=>{y+=gap;ls.forEach(emit);};
  const txt=l=>l.chars.map(x=>x.c).join('');
  for(let qi=0;qi<Q.length;qi++){
    const u=Q[qi];

    const gap=(y===0||u.cont)?0:u.gap,avail=LPP-y-gap,need=u.lines.length;

    }
    if(need<=avail){putAll(u.lines,gap);continue;}
    if(u.k==='dlg'){   // réplique coupée : (SUITE) en bas, NOM (SUITE) en haut de la page suivante

      if(k<0){k=kmax;while(k>kmin&&u.lines[k-1].t==='paren')k--;}
      putAll(u.lines.slice(0,k),gap);
      emit({t:'more',col:22,al:null,chars:[...'(SUITE)'].map(c=>({c,f:0})),el:null});
      brk();

      if(cueN){const lc=cue[cue.length-1];[...' (SUITE)'].forEach(c=>lc.chars.push({c,f:0}));}

      continue;
    }
    if(need<4||avail<2){if(y>0){brk();qi--;continue;}putAll(u.lines,gap);continue;}   // paragraphe : au moins 2 lignes de chaque côté
    const k=Math.min(avail,need-2);
    if(k<2){brk();qi--;continue;}
    putAll(u.lines.slice(0,k),gap);brk();
    Q.splice(qi+1,0,{k:u.k,gap:0,cont:true,lines:u.lines.slice(k)});

async function buildScriptPdf(){

    fnt(0);y+=2*LH;

async function buildTextPdf(){
  const J=await ensureJsPDF(),pdf=new J({unit:'pt',format:'a4'}),PW=pdf.internal.pageSize.getWidth(),PH=pdf.internal.pageSize.getHeight(),M=62,MB=62,CWID=PW-2*M;
  const ST={title:{sz:26,b:1,a:'center',gap:14},h1:{sz:19,b:1,gap:10,keep:1},h2:{sz:15.5,b:1,gap:8,keep:1},h3:{sz:13,b:1,gap:6,keep:1},sub:{sz:13,i:1,gap:8,a:'center',col:[100,116,139]},body:{sz:11.5,gap:5},box:{sz:11.5,gap:6,ind:14,box:1}};
  let y=M,title='';
  blocksOf().forEach(b=>{
    const st=ST[b.dataset.s]||ST.body,runs=inlineRuns(b),ind=(+b.dataset.i||0)*24+(st.ind||0),maxW=CWID-ind,lh=st.sz*1.35,al=b.dataset.a==='justify'?'left':(b.dataset.a||st.a||'left');
    if(b.dataset.s==='title'&&!title)title=[...blkText(b)].map(pdfChar).join('');
    const toks=[];
    runs.forEach(r=>{if(r.t==='\n'){toks.push({br:1});return;}r.t.split(/( +)/).forEach(w=>{if(w==='')return;toks.push({t:[...w].map(pdfChar).join(''),sp:/^ +$/.test(w),b:r.b||!!st.b,i:r.i||!!st.i,u:r.u});});});
    const setT=t=>pdf.setFont('times',t.b&&t.i?'bolditalic':t.b?'bold':t.i?'italic':'normal');
    pdf.setFontSize(st.sz);
    const lines=[];let line=[],lw=0;
    const flush=()=>{while(line.length&&line[line.length-1].sp){lw-=line.pop().w;}lines.push({toks:line,w:lw});line=[];lw=0;};
    toks.forEach(t=>{
      if(t.br){flush();return;}
      setT(t);const w=pdf.getTextWidth(t.t);
      if(t.sp){if(line.length){line.push({...t,w});lw+=w;}return;}
      if(lw+w>maxW&&line.length)flush();
      line.push({...t,w});lw+=w;
    });
    flush();
    if(st.keep&&y+lh*3>PH-MB){pdf.addPage();y=M;}
    const draw=(from,count)=>{
      for(let n=from;n<from+count;n++){
        const L=lines[n],y0=y+st.sz*.95;let x=M+ind+(al==='center'?(maxW-L.w)/2:al==='right'?maxW-L.w:0);
        L.toks.forEach(t=>{setT(t);pdf.setTextColor(...(st.col||[15,23,42]));pdf.text(t.t,x,y0);if(t.u&&!t.sp)pdf.line(x,y0+1.5,x+t.w,y0+1.5);x+=t.w;});

  for(let p=1;p<=n;p++){pdf.setPage(p);pdf.setFont('times','normal');pdf.setFontSize(9);pdf.setTextColor(120);pdf.text(`${p} / ${n}`,PW/2,PH-30,{align:'center'});}

  return pdf.output('blob');
}
function fountainInline(node){
  return mergeRuns(inlineRuns(node)).map(r=>{
    if(r.t==='\n')return '\n';
    const m=r.t.match(/^(\s*)([\s\S]*?)(\s*)$/);let core=m[2];if(!core)return r.t;
    if(r.u)core='_'+core+'_';if(r.i)core='*'+core+'*';if(r.b)core='**'+core+'**';
    return m[1]+core+m[3];
  }).join('').trim();
}
function toFountain(){
  const out=[];let title='',author='',tU=false,aU=false,inDlg=false;
  blocksOf().forEach(b=>{if(b.dataset.s==='title'&&!title)title=headerText(b);else if(b.dataset.s==='sub'&&!author)author=headerText(b).replace(/^(de|par|by|écrit par)\s+/i,'');});
  const hdr=[];if(title)hdr.push('Title: '+title);if(author)hdr.push('Author: '+author);
  const emit=(t,glue)=>{if(!glue&&out.length)out.push('');out.push(...t.split('\n'));};
  blocksOf().forEach(b=>{
    const s=b.dataset.s,plain=headerText(b);
    if(s==='title'&&!tU&&plain===title){tU=true;return;}
    if(s==='sub'&&!aU&&plain.replace(/^(de|par|by|écrit par)\s+/i,'')===author){aU=true;return;}
    const text=fountainInline(b);if(!text)return;
    if(s==='act'){emit('# '+plain);inDlg=false;}
    else if(s==='scene'){emit(SCENE_RE.test(plain)?text:'.'+text);inDlg=false;}
    else if(s==='char'){const n=plain.replace(/\s*\^$/,'').toUpperCase();emit(/^[A-ZÀ-Ý]/.test(n)?n:'@'+n);inDlg=true;}
    else if(s==='paren'&&inDlg)emit(/^\(.*\)$/s.test(text)?text:'('+text.replace(/^\(|\)$/g,'')+')',true);
    else if(s==='dial'&&inDlg)emit(text.replace(/\n\s*\n/g,'\n  \n'),true);
    else{
      inDlg=false;const caps=plain===plain.toUpperCase()&&/[A-ZÀ-Ý]/.test(plain);
      emit((caps||/^[!@#~=>.\[]/.test(text)||SCENE_RE.test(plain)?'!':'')+text);
    }
  });
  return (hdr.length?hdr.join('\n')+'\n\n':'')+out.join('\n').replace(/\n{3,}/g,'\n\n')+'\n';
}

async function addCollaborator(){
  if(!requireAdmin())return;const input=E('new-collab-email'),email=input.value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showToast("Adresse e-mail invalide.");return;}
  if(email===myEmail()){showToast("Vous ne pouvez pas vous inviter vous-même.");return;}
  let role=E('new-collab-role').value,wantAdmin=false;const collabs=getCollabs();
  if(email===ownerEmail()){showToast("Le propriétaire ne peut pas être invité.");return;}
  if(role==='admin'&&!isOwner()){wantAdmin=true;role='editor';}
  const ex=collabs.find(c=>(c.email||'').toLowerCase()===email);

  if(!t||!canManageCollab(t)){showToast("Seul le propriétaire peut modifier le rôle d'un admin.");renderCollaboratorsList();return;}
  if(role==='admin'&&!isOwner()){await requestAdmin(t.email);renderCollaboratorsList();return;}

  getCollabs().splice(idx,1);await saveCurrentMapState(true);renderCollaboratorsList();
}

 // une carte = une table, un champ de l'inspecteur = une colonne
 function buildTables(entries) {
  const usedT = new Set();

   let tn = sqlIdent(c.name, 'carte'), base = tn, i = 2;

   dl(new Blob([M.emit(tables, { mobius: true, head: '-- MQL (Mobius Query Language) : SQL compatible + commandes de relations Mobius' })], { type: 'text/plain;charset=utf-8' }), base + '.mobql');
  } else if (format === 'sql') {
   const ty = { line: 'TEXT', text: 'TEXT', number: 'NUMERIC', bool: 'BOOLEAN', date: 'DATE' };

   const csv = t => '\ufeff' + [['id', ...t.cols.map(c => c.label)], ...t.rows.map(r => [r.id, ...r.vals])].map(row => row.map(csvCell).join(';')).join('\r\n');

   tables.forEach(t => {

  }
  if (!cap) toast(`Export ${format.toUpperCase()} terminé (${tables.length} table${tables.length > 1 ? 's' : ''}).`);
 }

<script>
/* Export SQL relationnel Mobius : préserve tous les liens avec des tables de jonction.
   Les cardinalités n'étant pas déclarées, ne présume jamais d'une relation plusieurs-vers-un. */
window.mobiusRelationSQL = function(cardTables) {
 const qi = s => '"'+String(s).replace(/"/g,'""')+'"';
 const lit = v => v == null ? 'NULL' : "'"+String(v).replace(/'/g,"''")+"'";
 const entries = cardTables.filter(x=>x.card && x.table);
 const byId = new Map(entries.map(x=>[String(x.card.id),x]));
 const ids = new Map(entries.map(x=>[String(x.card.id),new Set((x.card.nodes||[]).map(n=>String(n.id)))]));
 const groups = new Map(), seen = new Set();
 const add = (a,an,b,bn,kind,rel,directed) => {
   a=String(a);b=String(b);an=String(an);bn=String(bn);
   if(!byId.has(a)||!byId.has(b)||!ids.get(a).has(an)||!ids.get(b).has(bn))return;
   // Canonical ordering for symmetric cross-links; preserve direction on internal links.
   if(a!==b && a>b){[a,b]=[b,a];[an,bn]=[bn,an];}
   const key=[a,b].join('|'), edge=[a,an,b,bn,kind,rel,directed].join('\u001f');
   if(seen.has(edge))return;seen.add(edge);
   if(!groups.has(key))groups.set(key,{a,b,edges:[]});
   groups.get(key).edges.push({an,bn,kind,rel,directed});
 };
 for(const {card} of entries){
   for(const n of card.nodes||[])for(const l of n.crossLinks||[])add(card.id,n.id,l.cardId,l.nodeId,'interLink','',false);
   for(const l of card.links||[]){
     const rt=(card.relationTypes||[]).find(t=>String(t.id)===String(l.relationTypeId));
     add(card.id,l.sourceId,card.id,l.targetId,'link',rt?.name||'',!!l.directed);
   }
 }
 const used = new Set(entries.map(x=>x.table));const out=[];
 for(const {a,b,edges} of groups.values()){
   const left=byId.get(a).table,right=byId.get(b).table;
   let base=('mobius_links_'+left+(a===b?'_internal':'_'+right)).replace(/[^a-zA-Z0-9_]/g,'_');
   let table=base,i=2;while(used.has(table))table=base+'_'+i++;used.add(table);
   out.push('-- Relations Mobius : '+left+' ↔ '+right);
   out.push('CREATE TABLE '+qi(table)+' (\n  "source_id" TEXT NOT NULL,\n  "target_id" TEXT NOT NULL,\n  "relation_type" TEXT NOT NULL,\n  "relation_name" TEXT,\n  "directed" BOOLEAN NOT NULL,\n  FOREIGN KEY ("source_id") REFERENCES '+qi(left)+'("id"),\n  FOREIGN KEY ("target_id") REFERENCES '+qi(right)+'("id")\n);');
   for(const e of edges)out.push('INSERT INTO '+qi(table)+' ("source_id", "target_id", "relation_type", "relation_name", "directed") VALUES ('+[lit(e.an),lit(e.bn),lit(e.kind),lit(e.rel),e.directed?'TRUE':'FALSE'].join(', ')+');');
 }
 return out.join('\n');
};

   if(noteLabel)noteLabel.textContent=docType==='script'?'Proposition':'Bulle';
   if(noteIcon)noteIcon.textContent=docType==='script'?'💡':'💬';
   const kb=byId('ed-mobile-kbbar');
   if(kb){ kb.classList.toggle('show', mobile && writing && mobileEditorFocused && docReady); if(mobile && writing && mobileEditorFocused)scheduleKbPosition(); if(kb.classList.contains('show')){scheduleKbPosition();requestAnimationFrame(()=>window.syncMobileFormatBar?.());} }
   const subtabs=byId('editor-mobile-subtabs');
   if(subtabs) subtabs.classList.toggle('show', mobile && inspecting && docReady);
   document.querySelectorAll('#editor-mobile-nav button').forEach(b=>b.classList.toggle('active',b.id==='ed-mobile-'+mobilePanel));
 }
 window.editorMobileView=function(which){
   mobilePanel=which;
   const sidebar=byId('tree-sidebar');
   if(which==='tree'){
     if(typeof standalone!=='undefined' && standalone){mobilePanel='write';updateMobileChrome();return;}
     if(typeof setNavTab==='function') setNavTab('tree');
     if(!sideOpen()) toggleTreeSidebar(); else renderNav();
   } else if(which==='inspect'){
     if(typeof navTab!=='undefined' && navTab==='tree') navTab='plan';
     if(!sideOpen()) toggleTreeSidebar();
     renderNav();
     requestAnimationFrame(()=>{ renderNav(); updateMobileChrome(); });
   } else {
     if(sideOpen()) toggleTreeSidebar();
     byId('ed-page')?.focus({preventScroll:true});
   }
   updateMobileChrome();
   layout();
   if(which==='inspect') requestAnimationFrame(()=>{renderNav();updateMobileChrome();});
 };
 function update(){layout();}
 addEventListener('resize',update);
 window.visualViewport?.addEventListener('resize',()=>{scheduleKbPosition();updateMobileChrome();});
 window.visualViewport?.addEventListener('scroll',scheduleKbPosition);
 window.addEventListener('orientationchange',scheduleKbPosition);
 document.addEventListener('DOMContentLoaded',()=>{
   layout();
   new MutationObserver(layout).observe(byId('ed-work'),{attributes:true,attributeFilter:['style']});
   byId('ed-page')?.addEventListener('focusin',()=>{mobileEditorFocused=true;positionKbBar();updateMobileChrome();});
   byId('ed-page')?.addEventListener('focusout',()=>{setTimeout(()=>{mobileEditorFocused=byId('ed-page')?.contains(document.activeElement);updateMobileChrome();},120);});
   document.addEventListener('focusin', e=>{if(e.target?.closest?.('#ed-page')){mobileEditorFocused=true;updateMobileChrome();}});
   document.addEventListener('focusout', e=>{if(e.target?.closest?.('#ed-page'))setTimeout(()=>{mobileEditorFocused=byId('ed-page')?.contains(document.activeElement);updateMobileChrome();},180);});
   if(window.lucide && lucide.createIcons) lucide.createIcons();
 });
 let timer;
 function selectionPopup(){
   const bar=byId('ed-selection-toolbar'),root=byId('ed-page'),s=window.getSelection();if(!bar||!root)return;
   if(isMobile()){bar.style.display='none';return;}
   if(!s||s.isCollapsed||!s.rangeCount||!root.contains(s.anchorNode)||!root.contains(s.focusNode)||!docReady){bar.style.display='none';return;}
   const rect=s.getRangeAt(0).getBoundingClientRect();if(!rect.width&&!rect.height){bar.style.display='none';return;}
   bar.style.display='flex';bar.style.visibility='hidden';
   const width=bar.offsetWidth,height=bar.offsetHeight;
   const x=Math.max(8,Math.min(innerWidth-width-8,rect.left+rect.width/2-width/2));
   const y=rect.top-height-10>8?rect.top-height-10:Math.min(innerHeight-height-8,rect.bottom+10);
   bar.style.left=x+'px';bar.style.top=Math.max(8,y)+'px';bar.style.visibility='visible';
   const size=byId('ed-selection-size');if(size){const el=s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement;const px=parseInt(getComputedStyle(el).fontSize);if(Number.isFinite(px))size.value=px;}
 }
 document.addEventListener('selectionchange',()=>{clearTimeout(timer);timer=setTimeout(selectionPopup,90)});
 document.addEventListener('pointerup',e=>{if(byId('ed-page')?.contains(e.target))setTimeout(selectionPopup,110)});
 document.addEventListener('pointerdown',e=>{if(!byId('ed-selection-toolbar')?.contains(e.target)&&!byId('ed-page')?.contains(e.target))byId('ed-selection-toolbar').style.display='none'});
 window.editorSelectionFont=function(font){if(!canEdit())return;restoreSel();document.execCommand('fontName',false,font);afterEdit();syncTools();};
 window.mobileHighlight=function(){ if(!canEdit())return; restoreSel(); try{document.execCommand('hiliteColor',false,'#fef08a');}catch(e){document.execCommand('backColor',false,'#fef08a');} afterEdit(); syncTools(); };
 window.editorSelectionAction=async function(action){
   if(action==='copy'||action==='cut'){
     restoreSel();const selected=String(window.getSelection());
     try{await navigator.clipboard.writeText(selected)}catch(e){document.execCommand('copy');}
     if(action==='cut'&&canEdit()){restoreSel();document.execCommand('delete');afterEdit();}
   }else if(action==='paste'){
     if(!canEdit())return;
     try{const txt=await navigator.clipboard.readText();restoreSel();document.execCommand('insertText',false,txt);afterEdit();}
     catch(e){alert('Pour coller, utilisez le menu natif ou le raccourci Coller de votre appareil.');}
   }
 };
})();
</script>
