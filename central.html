  const raw=[d.doc&&d.doc.html,d.html,typeof d.doc==='string'?d.doc:'',d.content,d.text].find(x=>typeof x==='string'&&x.trim())||'',out=[];
  const ACT=/^(acte|act|partie|part|chapitre|chapter|s[ée]quence|sequence)\b/i,SC=/^(sc[èe]ne|scene|int|ext|i\/e)(\.|\s|\/|:|$)|^\.[^.\s]/i;
