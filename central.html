/* ===== Mots de passe : vérification côté serveur (fonction SQL check_item_pwd — voir protect_pwd.sql) ===== */
window.verifyPwd = async function (client, table, id, typed, stored) {
  if (typed == null) return false;
  try {
    const { data, error } = await client.rpc('check_item_pwd', { p_table: table, p_id: String(id), p_pwd: String(typed) });
    if (!error) return data === true;
    const msg = String(error.message || '');
    if (/too_many_attempts/.test(msg)) { alert('Trop de tentatives incorrectes. Réessayez dans quelques minutes.'); return false; }
    const missing = error.code === 'PGRST202' || error.code === '42883' || /could not find the function|does not exist/i.test(msg);
    if (!missing) { console.warn('check_item_pwd :', msg); return false; }
  } catch (e) { console.warn('check_item_pwd :', e); return false; }
  // fonction SQL pas encore installée : ancien mode (mot de passe encore en clair dans la colonne)
  return stored != null && !/^\$2[abxy]\$|^pbkdf2\$|^locked$/.test(String(stored)) && String(typed) === String(stored);
};
</script>

<script>

function persons(){const cs=cards(),all=[];cs.forEach(c=>(c.nodes||[]).forEach(n=>all.push({c,n})));
  const par=new Map(),ref=new Map(),id=e=>e.c.id+'|'+e.n.id,F=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x)}return x},U=(a,b)=>{a=F(a);b=F(b);if(a!==b)par.set(a,b)};

function reach(pid){const all=[];walk(P.tree,i=>{if(i.type==='card')(i.nodes||[]).forEach(n=>all.push({c:i,n}))});

    function dlg({ title, message = '', input = null, buttons, row = false }) {
        return new Promise(resolve => {
            const ov = document.createElement('div');
            ov.className = 'fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50';
            ov.innerHTML = '<div class="w-full max-w-sm bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-800 p-5 space-y-3 text-xs"><h3 class="font-bold text-sm"></h3><p class="text-gray-500 dark:text-gray-400 whitespace-pre-line hidden"></p><input class="hidden w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:border-[#5246EE]"><div class="' + (row ? 'flex gap-2' : 'flex flex-col gap-2') + ' pt-1"></div></div>';
            const [h, p, inp, bar] = ov.querySelector('div').children;
            h.textContent = title;
            if (message) { p.textContent = message; p.classList.remove('hidden'); }
            if (input) { inp.classList.remove('hidden'); inp.type = input.type || 'text'; inp.placeholder = input.placeholder || ''; inp.value = input.value || ''; }
            const done = (value) => { ov.remove(); document.removeEventListener('keydown', onKey, true); resolve(value === undefined ? null : { value, text: inp.value }); };
            const primary = buttons.find(b => b.primary);
            const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(undefined); } else if (e.key === 'Enter' && input && primary) { e.preventDefault(); done(primary.value); } };
            buttons.forEach(b => {
                const btn = document.createElement('button');
                btn.type = 'button'; btn.textContent = b.label; btn.disabled = !!b.disabled; if (b.title) btn.title = b.title;
                btn.className = 'py-2.5 px-3 rounded-xl font-semibold transition-all ' + (row ? 'flex-1 ' : '') + (b.primary ? 'bg-[#5246EE] hover:bg-[#4538d8] text-white' : 'bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700') + (b.disabled ? ' opacity-40 cursor-not-allowed' : '');
                btn.addEventListener('click', () => done(b.value));
                bar.appendChild(btn);
            });
            ov.addEventListener('mousedown', (e) => { if (e.target === ov) done(undefined); });
            document.addEventListener('keydown', onKey, true);
            document.body.appendChild(ov);

    // --- Détection de fichiers binaires / images (signatures + octets de contrôle) ---
    function detectBinaryKind(bytes) {
        const sig = (...b) => b.every((v, i) => bytes[i] === v);
        if (sig(0x89, 0x50, 0x4E, 0x47)) return 'une image PNG';
        if (sig(0xFF, 0xD8, 0xFF)) return 'une image JPEG';
        if (sig(0x47, 0x49, 0x46, 0x38)) return 'une image GIF';
        if (sig(0x52, 0x49, 0x46, 0x46)) return 'un fichier RIFF (image WebP / audio / vidéo)';
        if (sig(0x25, 0x50, 0x44, 0x46)) return 'un PDF (renommé)';
        if (sig(0x50, 0x4B, 0x03, 0x04)) return 'une archive ZIP (ex. fichier Pages ou Word)';
        if (sig(0xD0, 0xCF, 0x11, 0xE0)) return 'un ancien document Office (.doc)';
        const head = bytes.subarray(0, 8192);
        if (head[0] === 0xFF && head[1] === 0xFE || head[0] === 0xFE && head[1] === 0xFF) return null; // UTF-16 avec BOM
        let ctrl = 0;
        for (const v of head) { if (v === 0) return 'des données binaires'; if (v < 9 || (v > 13 && v < 32)) ctrl++; }
        return head.length && ctrl / head.length > 0.02 ? 'des données binaires' : null;
    }

    // --- Décodage avec détection d'encodage (UTF-16 BOM, UTF-8, sinon Windows-1252) ---
    function decodeTextBytes(bytes) {
        if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes.subarray(2));
        if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes.subarray(2));
        try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/^\uFEFF/, ''); }
        catch (e) { return new TextDecoder('windows-1252').decode(bytes); }
    }

    async function pdfToText(buf) {
        if (!window.pdfjsLib) throw new Error("lecteur PDF indisponible (connexion ?)");
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
        const pages = [];
        for (let n = 1; n <= pdf.numPages; n++) {
            const content = await (await pdf.getPage(n)).getTextContent();
            let out = '', lastY = null;
            for (const it of content.items) {
                if (it.str === '') { if (it.hasEOL && out && !out.endsWith('\n')) out += '\n'; continue; }
                const y = it.transform ? it.transform[5] : null;
                if (lastY !== null && y !== null && Math.abs(y - lastY) > 2 && out && !out.endsWith('\n')) out += '\n';
                out += it.str;
                if (it.hasEOL && !out.endsWith('\n')) out += '\n';
                if (y !== null) lastY = y;
            }
            pages.push(out.trim());
        }
        return fixPdfLigatures(pages.filter(Boolean).join('\n\n'));
    }

    // Beaucoup de PDF (Keynote, Pages, certaines polices) encodent les ligatures « ti » / « tt »
    // avec un mauvais caractère : « aberra%ons », « len5lle », « vigne.e », « vigne=age ».
    // On les répare quand le caractère est coincé entre des lettres (donc jamais dans « 50% » ou « x=2 »).
    const KEEP_DOT = /^(com|fr|org|net|io|html?|js|css|txt|pdf|docx?|json|md|png|jpe?g|gif|svg|mobius|mobpro|fountain|pages?|xml|csv|zip|be|de|uk|eu|us|ca|ch)$/;
    function fixPdfLigatures(text) {
        let n = 0;
        const bump = (r) => (...a) => { n++; return r(...a); };
        text = text.replace(/⦁/g, '•');
        text = text.replace(/(?<=\p{L})%(?=\p{L})/gu, bump(() => 'ti'));
        text = text.replace(/(?<=\p{Ll})5(?=\p{Ll})/gu, bump(() => 'ti'));
        text = text.replace(/(?<=\p{Ll}{2})=(?=\p{Ll}{2})/gu, bump(() => 'tt'));
        text = text.replace(/(\p{Ll}{2,})\.(\p{Ll}+)/gu, (m, a, b) => KEEP_DOT.test(b) ? m : (n++, a + 'tt' + b));
        return { text, fixes: n };
    }

    async function docxToText(buf) {
        const zip = await JSZip.loadAsync(buf);
        const entry = zip.file('word/document.xml');
        if (!entry) throw new Error("ce n'est pas un document Word valide");
        const xml = new DOMParser().parseFromString(await entry.async('string'), 'application/xml');
        const walk = (node) => {
            let t = '';
            for (const ch of node.childNodes) {
                const n = ch.localName;
                if (n === 't') t += ch.textContent;
                else if (n === 'tab') t += '\t';
                else if (n === 'br' || n === 'cr') t += '\n';
                else if (ch.nodeType === 1) t += walk(ch);
            }
            return t;
        };

    // Transforme n'importe quel fichier accepté en texte brut (images et mise en forme ignorées).
    // Lance une Error (message lisible) si le fichier est refusé.
    async function fileToText(file) {
        if (file.size > MAX_INPUT_BYTES) throw new Error('fichier trop volumineux (max 20 Mo)');
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let text, fixes = 0;
        if (/\.pdf$/i.test(file.name)) {
            if (!(bytes[0] === 0x25 && bytes[1] === 0x50)) throw new Error("ce n'est pas un vrai PDF");
            ({ text, fixes } = await pdfToText(buf));
        } else if (/\.docx$/i.test(file.name)) {
            if (!(bytes[0] === 0x50 && bytes[1] === 0x4B)) throw new Error("ce n'est pas un vrai .docx");
            text = await docxToText(buf);
        } else {
            const kind = detectBinaryKind(bytes);
            if (kind) throw new Error(`le fichier contient ${kind}, pas du texte`);
            text = decodeTextBytes(bytes);
        }
        if (!text.trim()) throw new Error('aucun texte trouvé (document scanné ou composé uniquement d\'images ?)');
        if (text.length > MAX_TEXT_CHARS) throw new Error('texte trop long (max 2 millions de caractères)');
        return { text, fixes };
    }



        
// tableaux : une carte = une table, un champ de l'inspecteur = une colonne
        function buildTables(entries) {
            const usedT = new Set();
            return entries.map(({ card: c, fieldIds }) => {
                let tn = sqlIdent(c.name, 'carte'), base = tn, i = 2;
                while (usedT.has(tn)) tn = base + '_' + i++;
                usedT.add(tn);
                const usedC = new Set(['id']);
                const cols = cardFields(c).filter(f => !fieldIds || fieldIds.has(f.id)).map(f => {
                    let n = sqlIdent(f.label, 'champ'), b = n, k = 2;
                    while (usedC.has(n)) n = b + '_' + k++;
                    usedC.add(n);
                    return { name: n, label: f.label, type: f.type, f };
                });
                const rows = (c.nodes || []).map(node => ({
                    id: node.id, x: node.x, y: node.y,
                    vals: cols.map(col => {
                        const v = fieldVal(node, col.f);
                        if (col.type === 'bool') return v === true;
                        if (v === undefined || v === null || v === '') return null;
                        return col.type === 'number' ? Number(v) : String(v);
                    })
                }));
                return { name: tn, title: c.name || tn, cols, rows, card: c };
            });
        }
        const csvCell = v => { const s = v === null || v === undefined ? '' : String(v); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

                const out = { tables: tables.map(t => ({ table: t.name, title: t.title, relationTypes: (t.card && t.card.relationTypes) || [], links: (t.card && t.card.links) || [], columns: [{ name: 'id', label: 'id', type: 'text' }, ...t.cols.map(c => ({ name: c.name, label: c.label, type: c.type === 'line' ? 'text' : c.type }))], rows: t.rows.map(r => ({ id: r.id, _x: r.x, _y: r.y, ...Object.fromEntries(t.cols.map((c, i) => [c.name, r.vals[i]])) })) })) };

            } else if (format === 'mql') {

                const sql = ['-- Export Mobius : une carte = une table', ...tables.map(t =>

                    t.rows.map(r => `\nINSERT INTO "${t.name}" ("id"${t.cols.map(c => `, "${c.name}"`).join('')}) VALUES (${sqlVal(r.id)}${r.vals.map(v => ', ' + sqlVal(v)).join('')});`).join(''))].join('\n') + '\n';

/* ===== MOBIUS-TABULAR:START (bloc autonome : console MQL Mobius, imports mql/sql/csv/xlsx/json) ===== */
        const MT = (() => {

            const isCmd = c => c.length > 1 && c[0].t === 'w' && /^(createlink|newlink|link)$/i.test(c[0].v) && sy(c[1], ':');

            function tok(src) {
                const T = [], n = src.length; let i = 0, ln = 1;

                            const d = src[j];
                            if (d === cl) { if (cl === c && src[j + 1] === c) { s += c; j += 2; continue; } break; }
                            if (d === '\n') ln++;

                        }
                        T.push({ t: c === '"' ? 'qid' : 'str', v: s, ln: l0 }); i = j + 1; continue;

                const setV = (n, f, v) => {
                    if (v !== null && v !== '') {

                const ref = r => {
                    let n = D.nodes.find(x => x.id === r); if (n) return n;

                    if (m.length === 1) return m[0];

                };
                const place = n => {
                    if (isFinite(n.x) && isFinite(n.y)) return;
                    for (let i = D.nodes.length; ; i++) { const x = 60 + (i % 6) * 200, y = 60 + Math.floor(i / 6) * 150; if (!D.nodes.some(o => Math.abs(o.x - x) < 180 && Math.abs(o.y - y) < 120)) { n.x = x; n.y = y; return; } }

                const cmp = (a, op, b) => {

                    const x = num ? na : String(a ?? '').toLowerCase(), y = num ? nb : String(b ?? '').toLowerCase();

                };
                const link = (rel, a, b, directed) => {
                    const A = ref(a), B = ref(b);

                    const res = addLinkTo(D.links, A.id, B.id, rel ? rel.id : '', directed);
                    if (res === 'exists') { log.push({ k: 'warn', m: `Lien déjà existant entre « ${a} » et « ${b} » : ignoré` }); return; }
                    if (res === 'merged') { log.push({ k: 'ok', m: `« ${a} » et « ${b} » : les deux sens ont fusionné en un lien normal` }); changed = true; return; }
                    lk++; changed = true;
                };
                // link: (typeLink: "Nom", a and b)  /  (typeLink: "Nom", from a to b) : modifie le lien EXISTANT entre deux personnes
                const editLink = (rel, a, b, directed) => {
                    const A = ref(a), B = ref(b);
                    if (A === B) throw Error('une personne ne peut pas être reliée à elle-même');
                    const between = D.links.filter(l => (l.sourceId === A.id && l.targetId === B.id) || (l.sourceId === B.id && l.targetId === A.id));
                    if (!between.length) { log.push({ k: 'warn', m: `Aucun lien entre « ${a} » et « ${b} » : utilise newLink pour le créer` }); return; }
                    const t = directed ? (between.find(l => isDirected(l) && l.sourceId === A.id) || (between.length === 1 ? between[0] : null))
                                       : (between.find(l => !isDirected(l)) || (between.length === 1 ? between[0] : null));
                    if (!t) throw Error(`plusieurs liens existent entre « ${a} » et « ${b} » : précise le sens avec « from X to Y », ou le lien normal avec « X and Y »`);
                    t.relationTypeId = rel ? rel.id : '';
                    if (directed) { t.sourceId = A.id; t.targetId = B.id; t.directed = true; } else delete t.directed;
                    md++; changed = true;
                };
                // createLink: (name: "Nom", color: "#hex")   |   newLink: (typeLink: "Nom", x and y, from x to z ...)
                // « to » = lien à sens unique (x → z), « and » = lien normal. Les parenthèses sont facultatives.
                const cmd = st => {
                    const kind = st[0].v.toLowerCase(); let i = 2, name = null, color = null, tl = null; const pairs = [];
                    while (i < st.length) {
                        const t = st[i], w = t.v.toLowerCase();
                        if (sy(t, ',') || sy(t, '(') || sy(t, ')')) { i++; continue; }
                        // clause de liens : from A [with B …] to C [to D …] (sens unique)   |   A [with B …] and C [and D …] (lien normal)
                        //   to = sens unique (flèche), and = lien normal ; chaque source est reliée à chaque cible
                        const isRef = x => x && x.t !== 'sym' && x.t !== 'meta';
                        const kw = x => x && x.t === 'w' ? x.v.toLowerCase() : '';
                        const isKey = t.t === 'w' && (w === 'name' || w === 'color' || w === 'typelink') && (sy(st[i + 1], ':') || sy(st[i + 1], '='));
                        if (!isKey && isRef(t)) {
                            let j = i; const hasFrom = kw(st[j]) === 'from'; if (hasFrom) j++;
                            const srcs = [], tgs = [];
                            const fmt = 'syntaxe attendue : from X [with Y,Z …] to A,B (sens unique) ou X [with Y,Z …] and A,B (lien normal)';
                            if (!isRef(st[j])) throw Error(fmt);
                            srcs.push(st[j++].v);
                            // Sources : syntaxes longues, courtes et mixtes acceptées (with b with c / with b,c / with b,c with d).
                            while (kw(st[j]) === 'with') {
                                j++;
                                if (!isRef(st[j])) throw Error('with : une personne est attendue après « with »');
                                srcs.push(st[j++].v);
                                while (sy(st[j], ',') && isRef(st[j + 1]) && !['to', 'and', 'with'].includes(kw(st[j + 1]))) {
                                    j++;
                                    srcs.push(st[j++].v);
                                }
                            }
                            // Cibles : « to e,f,g » / « and e,f,g », ainsi que les répétitions historiques.
                            while (kw(st[j]) === 'to' || kw(st[j]) === 'and') {
                                const d = kw(st[j]) === 'to'; j++;
                                if (!isRef(st[j])) throw Error(`« ${d ? 'to' : 'and'} » : une personne est attendue après`);
                                tgs.push([st[j++].v, d]);
                                while (sy(st[j], ',') && isRef(st[j + 1]) &&
                                       !['from', 'to', 'and', 'with', 'name', 'color', 'typelink'].includes(kw(st[j + 1])) &&
                                       !['to', 'and', 'with'].includes(kw(st[j + 2]))) {
                                    j++;
                                    tgs.push([st[j++].v, d]);
                                }
                            }
                            if (!tgs.length) throw Error(fmt);
                            if (new Set(tgs.map(x => x[1])).size > 1) throw Error('ne mélange pas « to » et « and » dans la même clause : sépare-les par une virgule');

                            if (!tgs[0][1] && hasFrom) throw Error('« from » ne s\'utilise qu\'avec « to » : écris « a and b » pour un lien normal');

                        let rel = D.relationTypes.find(r => r.name.toLowerCase() === name.toLowerCase());
                        if (rel) { rel.color = color; log.push({ k: 'warn', m: `Le type « ${rel.name} » existait déjà : couleur mise à jour` }); }

                        i++;
                        while (sy(st[i], '(')) {
                            i++; const vs = [];

                            i++;

                            cols.forEach((c, k) => { const u = c.toLowerCase(); if (u !== 'id' && u !== '_x' && u !== '_y') setV(nd, getF(c), vs[k]); });

                        let f = () => true; if (st[i] && /^where$/i.test(st[i].v)) [f, i] = where(st, i + 1);
                        const hit = D.nodes.filter(f);
                        hit.forEach(n => sets.forEach(([c, v]) => { const u = c.toLowerCase(); if (u === '_x') n.x = Number(v); else if (u === '_y') n.y = Number(v); else if (u === 'id') throw Error("l'id ne peut pas être modifié"); else setV(n, getF(c), v); }));

            // routage : CREATE TABLE|CARD crée une nouvelle carte (les instructions suivantes la visent), USE désigne une autre carte ; sans CREATE tout vise la carte courante
            function runAll(S) {
                const G = [{ ident: currentCard.name || '', label: 'carte actuelle', base: currentCard, st: [] }];
                let act = G[0], title = null, made = false;
                const find = n => G.find(g => idn(g.ident) === idn(n) || idn(g.label) === idn(n));
                const tn = st => {
                    const u = st[0].v.toUpperCase(); let i = 1;
                    if (u === 'INSERT') { if (/^into$/i.test(st[i].v)) i++; return st[i]; }
                    if (u === 'UPDATE') return st[1];
                    if (u === 'DELETE') { if (/^from$/i.test(st[i].v)) i++; return st[i]; }
                    if (u === 'SELECT') return st[st.findIndex(t => t.t === 'w' && /^from$/i.test(t.v)) + 1];
                    return null;
                };
                S.forEach(st => {
                    if (st[0].t === 'meta') { title = st[0].v; return; }
                    const u = st[0].t === 'w' ? st[0].v.toUpperCase() : '';
                    try {
                        if (u === 'CREATE') {
                            let j = 1; if (/^(table|card)$/i.test(st[j].v)) j++; if (/^if$/i.test(st[j].v)) j += 3;
                            const nt = st[j]; if (!nt) throw Error('nom de la table manquant');
                            act = { ident: nt.v, label: title || (nt.t === 'w' ? pretty(nt.v) : nt.v), base: {}, st: [st], isNew: true }; G.push(act); made = true; title = null; return;
                        }
                        if (u === 'USE') { let j = 1; if (/^(table|card)$/i.test(st[j].v)) j++; const g = st[j] && find(st[j].v); if (!g) throw Error(`carte « ${st[j] ? st[j].v : ''} » inconnue`); act = g; return; }

                        if (t && t.t !== 'sym') { const f = find(t.v); if (f) g = f; else if (made) throw Error(`table « ${t.v} » inconnue : crée-la d'abord ou utilise USE`); }

                outs.forEach(o => { o.r.log.forEach(l => log.push(G.length > 1 ? { ...l, m: `« ${o.g.label} » : ${l.m}` } : l)); results.push(...o.r.results); });
                return { cur: outs[0].r, news: outs.slice(1).map(o => ({ label: o.g.label, D: o.r.D })), log, results };
            }

            // un script (une ou plusieurs tables) -> une carte par CREATE TABLE
            function toCards(src, fname) {
                const segs = []; let cur = null, title = null;
                split(tok(src)).forEach(st => {
                    if (st[0].t === 'meta') { title = st[0].v; return; }
                    if (st[0].t === 'w' && /^create$/i.test(st[0].v)) {
                        let j = st.findIndex(t => t.t === 'w' && /^(table|card)$/i.test(t.v)) + 1;
                        if (st[j] && /^if$/i.test(st[j].v)) j += 3;
                        cur = { title, tn: st[j] ? st[j].v : '', st: [] }; segs.push(cur); title = null;
                    } else if (!cur) { cur = { title, tn: '', st: [] }; segs.push(cur); }

            // ---------- interface : console SQL ----------
            const EXAMPLE = `-- CREATE CARD (ou CREATE TABLE) crée une nouvelle carte dans l'arborescence

            const HELP = `<p><b>MQL</b> (Mobius Query Language) : accepte le SQL pris en charge par Mobius et ajoute les commandes spécifiques aux relations. <b>SQL compatible</b> : CREATE TABLE (ou CREATE CARD), INSERT INTO, UPDATE … SET … WHERE, DELETE FROM … WHERE, SELECT … WHERE / ORDER BY / LIMIT. Une colonne = un champ de l'inspecteur, une ligne = une personne. Colonnes spéciales : <code>id</code>, <code>_x</code>, <code>_y</code> (position, sinon placement automatique).</p>
<p class="mt-2"><b>Où ça s'exécute</b> : sans CREATE, tout s'exécute dans la carte où tu as ouvert cette console. Avec CREATE, une nouvelle carte est ajoutée à l'arborescence avec tout son contenu, et les instructions qui suivent (dont createLink / newLink) s'appliquent à elle. Pour revenir à une autre carte : <code>USE CARD nom;</code> ou nomme-la dans l'instruction (<code>INSERT INTO nom …</code>).</p>
<p class="mt-2"><b>createLink: (name: "Nom", color: "#RRGGBB");</b> crée un type de lien dans la légende (name et color obligatoires).</p>
<p class="mt-2"><b>newLink: (typeLink: "Nom", x and y, from x to z);</b> crée un ou plusieurs liens du type choisi (la liste des types apparaît pendant la saisie, Tab pour valider). x et y sont des id ou des « Prénom Nom ». <code>typeLink: none</code> : lien sans type.</p>
<p class="mt-2"><code>and</code> = lien normal (dans les deux sens). <code>to</code> = lien à sens unique : <code>from x to y</code> trace une flèche de x vers y. Si tu crées <code>from x to y</code> puis <code>from y to x</code> avec le même type, les deux fusionnent en un lien normal. Les parenthèses sont facultatives.</p>
<p class="mt-2"><b>Raccourcis</b> : <code>with</code> ajoute des sources, on peut enchaîner des cibles, et chaque source est reliée à chaque cible (jamais entre elles). <code>from a with b to c</code> = a→c, b→c. <code>from a with b,c to d,e</code> = a→d, a→e, b→d, b→e, c→d, c→e. Les formes longues (<code>with b with c</code>, <code>to d to e</code>, <code>and d and e</code>), courtes (<code>with b,c</code>, <code>to d,e</code>, <code>and d,e</code>) et mixtes (<code>with b,c with d</code>, <code>to e,f to g</code>) sont toutes équivalentes et restent acceptées. Pareil avec <code>and</code>, mais <b>sans</b> <code>from</code> : <code>a with b and c</code> = a–c, b–c. <code>from</code> est obligatoire avec <code>to</code> et interdit avec <code>and</code>. On ne mélange pas <code>to</code> et <code>and</code> dans une même clause : sépare-les par une virgule.</p>
<p class="mt-2"><b>link: (typeLink: "Nom", a and b);</b> <b>modifie</b> le lien déjà existant entre a et b (type et sens) au lieu d'en créer un, avec la même syntaxe que newLink : <code>link: (typeLink: "Ami", a and b)</code> le rend normal et de type Ami, <code>link: (typeLink: "Mentor", from a to b)</code> le rend à sens unique a→b (même avec <code>with</code> / plusieurs cibles). S'il n'y a aucun lien, rien n'est créé (un avertissement t'invite à utiliser newLink). S'il y en a plusieurs entre les deux personnes, <code>and</code> vise le lien normal et <code>from a to b</code> le lien a→b ; sinon une erreur te demande de préciser.</p>
<p class="mt-2">Les instructions finissent par « ; » (ou à la fin de la ligne pour createLink / newLink). Tab indente, Maj+Tab désindente et Entrée applique une indentation contextuelle. Tout est exécuté ou rien : en cas d'erreur, rien n'est modifié. Annulable avec Ctrl+Z pour la carte courante.</p>
<p class="mt-2">Dépose un fichier <b>.mobql, .sql, .csv, .xlsx, .json</b> : il est converti en MQL dans l'éditeur (donc il s'ajoute à la carte ouverte, sauf si tu écris CREATE CARD), tu relis puis tu exécutes. Importé dans l'arborescence, il crée une nouvelle carte. Seuls le MQL, le JSON et le .mobius gardent les liens, leurs types et leurs noms.</p>`;
const HLRE = /(--[^\n]*)|("(?:[^"]|"")*"|'(?:[^']|'')*'|«[^»]*»|“[^”]*”)|\b(createLink|newLink|interLink|link)\b|\b(name|color|typeLink|to)\b|\b(CREATE|TABLE|CARD|USE|INSERT|INTO|VALUES|UPDATE|SET|DELETE|FROM|WITH|WHERE|SELECT|ORDER|BY|LIMIT|AND|OR|NOT|NULL|LIKE|IS|ALTER|ADD|COLUMN|PRIMARY|KEY|IF|EXISTS|ASC|DESC|TRUE|FALSE)\b|\b(TEXT|NUMERIC|BOOLEAN|DATE|INTEGER|INT)\b|(\b\d+(?:\.\d+)?\b)/gi;

<!-- Mobius Split integration: no changes to the existing database. -->
<script>
const mobiusCentralOriginalFlush=flush;
const mobiusCentralPending=new Set();
window.flush=async(...args)=>{const job=Promise.resolve().then(()=>mobiusCentralOriginalFlush(...args));mobiusCentralPending.add(job);try{return await job}finally{mobiusCentralPending.delete(job)}};
window.MobiusSplitAdapter={
 app:'central',
 hasProject:()=>Boolean(pid && P && C && window.__mobiusCentralUserId),
 isReady:()=>Boolean(P&&C&&pid&&cid&&window.__mobiusCentralInitialized),
 title:()=>C?.name||'Centrale',
 userId:()=>window.__mobiusCentralUserId,
 ensureSaved:async()=>{
  try{if(timer||dirty){if((await flush())===false)return false;}if(mobiusCentralPending.size){const results=await Promise.allSettled([...mobiusCentralPending]);if(results.some(x=>x.status==='rejected'||x.value===false))return false;}return true;}
  catch(e){console.error(e);return false;}
 }
};
</script>
<script id="mobius-split-bridge-inline">
/* Mobius Split Bridge v1 — common navigation/iframe protocol. Designed to be loaded AFTER the original page scripts. */
(()=>{'use strict';
 const APP=window.MobiusSplitAdapter;
 if(!APP||!['map','editor','central'].includes(APP.app))return;
 const PREFIX='mobius.split.v1', HIST='mobius.split.navigation.v1', INTENT='mobius.split.intent.v1', URLS=/^(map|editor|central)\.html$/i;
 const q=new URLSearchParams(location.search), embedded=q.get('split')==='1';
 const origin=location.origin==='null'?'*':location.origin;
 let busy=false, readySent=false;
 const scoped=key=>key+':'+(APP.userId?.()||'unknown');
 const escURL=()=>location.pathname.split('/').pop()+location.search;
 const isPhone=()=>/iPhone|iPod|Android[^;]*Mobile|Windows Phone/i.test(navigator.userAgent)&&!/iPad/i.test(navigator.userAgent);
 const validDoc=(entry)=>{
   if(!entry||typeof entry.url!=='string'||entry.url.length>4096)return null;
   try{const u=new URL(entry.url,location.href);if(u.origin!==location.origin||!URLS.test(u.pathname.split('/').pop()))return null;
     if(!u.searchParams.has('cardId')&&!u.searchParams.has('fileId')&&!u.searchParams.has('centralId'))return null;
     return {url:u.pathname.split('/').pop()+u.search,app:u.pathname.split('/').pop().replace('.html',''),projectId:u.searchParams.get('projectId')||null,docId:u.searchParams.get('fileId')||u.searchParams.get('cardId')||u.searchParams.get('centralId')||null};
   }catch{return null}
 };
 function current(){return validDoc(APP.document?.()||{url:escURL()});}
 function remember(){if(embedded||!APP.isReady()||!APP.hasProject?.())return;const e=current();if(!e)return;let arr=[];
   try{arr=JSON.parse(sessionStorage.getItem(scoped(HIST))||'[]')}catch{}if(!Array.isArray(arr))arr=[];
   arr=arr.filter(x=>validDoc(x)&&x.url!==e.url);arr.unshift({...e,at:Date.now()});sessionStorage.setItem(scoped(HIST),JSON.stringify(arr.slice(0,16)));
 }
 function notify(type,other={}){if(!embedded||window.parent===window)return;window.parent.postMessage({namespace:PREFIX,type,...other},origin)}
 function ready(){if(!APP.isReady())return; if(!embedded){button.hidden=isPhone()||!APP.hasProject?.();remember();}else if(!readySent){readySent=true;notify('READY',{document:current(),name:APP.title?.()||document.title})}}
 async function ensureSaved(){try{const ok=(await APP.ensureSaved())===true;if(ok)notify('TREE_CHANGED');return ok}catch(err){console.error('Mobius Split: échec de sauvegarde',err);return false}}
 async function openSplit(){if(embedded){notify('REQUEST_SPLIT');return}if(busy||!APP.isReady()||!APP.hasProject?.())return;
   if(isPhone()||(window.innerWidth<768&&window.matchMedia('(pointer:coarse)').matches)){alert('Mobius Split est disponible sur tablette et ordinateur.');return}
   if(document.querySelector('dialog[open],#mod:not(.hidden),[aria-modal="true"]')){alert('Ferme la fenêtre en cours avant de passer en mode Split.');return}
   busy=true;
   try{const ok=await ensureSaved();if(!ok){alert('Enregistrement impossible ou modification en cours : Split n’a pas été ouvert pour protéger ton travail.');return}
     remember();const left=current();if(!left||!left.projectId)return;let arr=[];try{arr=JSON.parse(sessionStorage.getItem(scoped(HIST))||'[]')}catch{};
     const right=(Array.isArray(arr)?arr:[]).map(validDoc).find(x=>x?.url!==left.url)||null;
     sessionStorage.setItem(scoped(INTENT),JSON.stringify({left,right,created:Date.now()}));
     location.assign('split.html');
   }finally{busy=false}
 }
 const button=document.createElement('button');button.type='button';button.id='mobius-split-launch';button.textContent='◫ Split';button.title='Scinder les interfaces (⌘ + E ou Ctrl + E)';button.setAttribute('aria-label','Ouvrir Mobius Split');
 button.hidden=true;button.style.cssText='display:inline-flex;align-items:center;justify-content:center;gap:4px;border:1px solid #d8d7f9;border-radius:12px;background:rgba(82,70,238,.09);color:#5246EE;padding:8px 10px;font:600 12px Inter,system-ui,sans-serif;cursor:pointer;flex-shrink:0;white-space:nowrap;';
 const hideStyle=document.createElement('style');hideStyle.textContent='#mobius-split-launch[hidden]{display:none!important}';document.head.append(hideStyle);
 button.addEventListener('click',openSplit);
 if(!embedded){const hdr=document.querySelector('header');if(hdr){if(APP.app==='central')hdr.append(button);else{const target=hdr.querySelector('#role-badge')?.parentElement || hdr.lastElementChild || hdr;if(target&&target!==hdr)target.prepend(button);else hdr.append(button);}}}
 window.addEventListener('keydown',e=>{if(embedded||isPhone()||!APP.hasProject?.())return;const mod=e.metaKey||e.ctrlKey;if(!mod||e.altKey||e.repeat)return;
  const primary=!e.shiftKey&&(e.key.toLowerCase()==='e'||e.code==='KeyE');
  const fallback=e.shiftKey&&(e.key==='.'||e.code==='Period');
  if(primary||fallback){e.preventDefault();e.stopPropagation();openSplit()}
 },true);
 if(embedded){
   document.documentElement.classList.add('mobius-embedded');
   // The split host owns all project navigation. Internal tools and inspectors remain available.
   const style=document.createElement('style');
   const hiddenTree=APP.app==='editor'?'#tree-pane':'#tree-sidebar';
   style.textContent=`html.mobius-embedded ${hiddenTree},html.mobius-embedded #breadcrumb-container,html.mobius-embedded #mnav-tree,html.mobius-embedded #nav-btn-tree,html.mobius-embedded #tree-selbar{display:none!important}html.mobius-embedded .tree-only-control{display:none!important}html.mobius-embedded #canvas-container{min-width:0}html.mobius-embedded header{max-width:100vw}html.mobius-embedded #top-header{min-width:0}html.mobius-embedded .panel{min-width:0}`;
   document.head.append(style);
   const bc=document.getElementById('breadcrumb-container');if(bc)bc.onclick=null;
   // The back control navigates the host, instead of ejecting an iframe to Dashboard.
   if(APP.app==='map'||APP.app==='editor'){
     window.goBack=()=>notify('REQUEST_CLOSE');
   }else{
     const back=document.getElementById('back');if(back)back.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();notify('REQUEST_CLOSE')},true);
   }
   window.addEventListener('message',async e=>{
     if(e.source!==window.parent||e.origin!==location.origin)return;
     const m=e.data;if(!m||m.namespace!==PREFIX||!['PREPARE_NAV','FOCUS','REFRESH_TREE'].includes(m.type))return;
     if(m.type==='PREPARE_NAV'){
       const success=await ensureSaved();notify('PREPARE_RESULT',{requestId:m.requestId,ok:success});
     }else if(m.type==='FOCUS'){window.focus();}
     else if(m.type==='REFRESH_TREE'){/* Le projet partagé a changé : recharger la copie locale évite une réécriture obsolète du JSON d'arborescence. */window.location.reload();}
   });
 }
 document.addEventListener('DOMContentLoaded',ready);window.addEventListener('pageshow',ready);
 // Async Supabase authentication can finish after DOMContentLoaded.
 window.MobiusSplitReady=ready;
 let polls=0;const interval=setInterval(()=>{ready();if((embedded?readySent:APP.isReady())||++polls>600)clearInterval(interval)},300);
})();

</script>
